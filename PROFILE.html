<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CKCPS WARS - 個人檔案系統 v260712</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        
        :root {
            --bg-gradient: linear-gradient(180deg, #060614 0%, #0a0a24 100%);
            --header-bg: rgba(11, 11, 34, 0.85);
            --header-border: #00f9ff;
            --header-shadow: 0 0 25px rgba(0, 249, 255, 0.25);
            --header-text: #ffffff;
            --h1-font: 'Orbitron', sans-serif;
            --h1-text-shadow: 0 0 10px #00f9ff;
            --bg-dark: #060614;
            --card-bg: #11112a;
            --card-shadow: 0 10px 30px rgba(0,0,0,0.5);
            --primary: #00f9ff;     
            --secondary: #ff00aa;   
            --accent: #39ff14;      
            --text-main: #ffffff;
            --text-dim: #94a3b8;
            --border-color: #222244;
            --item-bg: rgba(255, 255, 255, 0.04);
            --chart-grid: rgba(0, 249, 255, 0.15);
            --chart-fill: rgba(255, 0, 170, 0.25);
        }

        body.school-theme {
            --bg-gradient: linear-gradient(180deg, #faf9f8 0%, #f0f4f7 100%);
            --header-bg: #2d4565;       
            --header-border: #f9995d;   
            --header-shadow: 0 4px 20px rgba(45, 69, 101, 0.15);
            --header-text: #ffffff;
            --h1-font: "微軟正黑體", -apple-system, sans-serif;
            --h1-text-shadow: none;
            --bg-dark: #faf9f8;
            --card-bg: #ffffff;
            --card-shadow: 0 4px 20px rgba(45, 69, 101, 0.06);
            --primary: #2d4565;         
            --secondary: #f9995d;       
            --accent: #71b2c4;          
            --text-main: #2d4565;       
            --text-dim: #5d718e;        
            --border-color: #cbd5e1;    
            --item-bg: #faf9f8;
            --chart-grid: rgba(45, 69, 101, 0.15);
            --chart-fill: rgba(249, 153, 93, 0.35);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "微軟正黑體", sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .controls-container { position: fixed; top: 20px; right: 20px; z-index: 1000; display: flex; gap: 12px; }
        .control-btn { padding: 10px 18px; background: rgba(11, 11, 34, 0.85); border: 2px solid var(--secondary); color: #ffffff; border-radius: 30px; cursor: pointer; font-weight: bold; font-size: 0.9rem; transition: all 0.3s ease; }
        .control-btn:hover { transform: scale(1.05); box-shadow: 0 0 25px var(--secondary); }
        body.school-theme .control-btn { background: #ffffff; border: 2px solid #2d4565; color: #2d4565; }

        header { background: var(--header-bg); padding: 25px 20px; text-align: center; border-bottom: 3px solid var(--header-border); box-shadow: var(--header-shadow); color: var(--header-text); }
        header h1 { font-family: var(--h1-font); font-size: 2rem; text-shadow: var(--h1-text-shadow); margin-bottom: 8px; }
        .back-link { display: inline-block; margin-top: 8px; color: var(--primary); text-decoration: none; font-weight: bold; }

        .main-container { max-width: 1200px; width: 100%; margin: 30px auto; padding: 0 20px; flex: 1; }

        /* 登入卡片 */
        .login-card { max-width: 450px; margin: 60px auto; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; padding: 35px; box-shadow: var(--card-shadow); text-align: center; }
        .login-title { font-size: 1.5rem; font-weight: bold; margin-bottom: 25px; color: var(--secondary); }
        .form-group { text-align: left; margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.95rem; font-weight: bold; margin-bottom: 8px; color: var(--text-dim); }
        .form-control { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--item-bg); color: var(--text-main); font-size: 1rem; outline: none; }
        .login-btn { width: 100%; padding: 14px; background: var(--secondary); border: none; color: white; font-size: 1.1rem; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; }

        /* 儀表板 */
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1.6fr; gap: 25px; }
        @media (max-width: 900px) { .dashboard-grid { grid-template-columns: 1fr; } }
        .dashboard-panel { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; padding: 25px; box-shadow: var(--card-shadow); display: flex; flex-direction: column; }
        .panel-title { font-size: 1.15rem; font-weight: bold; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid var(--border-color); color: var(--primary); display: flex; align-items: center; gap: 8px; }

        /* 內容區 */
        .info-container { display: flex; flex-direction: column; gap: 15px; justify-content: center; flex: 1; }
        .info-row { display: flex; justify-content: space-between; padding: 12px; background: var(--item-bg); border-radius: 8px; }
        .info-value { color: var(--text-main); font-weight: bold; font-size: 1.1rem; }
        
        .total-score-banner { font-size: 1.3rem; font-weight: bold; color: var(--secondary); background: var(--item-bg); padding: 8px 25px; border-radius: 30px; border: 1px solid var(--border-color); }
        .total-score-banner span { font-size: 1.8rem; font-family: 'Orbitron', sans-serif; margin-left: 5px; }
        .canvas-holder { width: 100%; max-width: 380px; aspect-ratio: 1; display: flex; justify-content: center; }

        .subject-list { display: flex; flex-direction: column; gap: 10px; max-height: 320px; overflow-y: auto; }
        .subject-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: var(--item-bg); border-radius: 8px; border-left: 4px solid var(--secondary); }
        
        .badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 15px; justify-items: center; align-content: center; flex: 1; opacity: 0.5; }
        .badge-item { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px; background: var(--item-bg); border: 1px dashed var(--border-color); border-radius: 8px; width: 100%; }
        
        .hidden { display: none !important; }
        .sync-status { text-align: center; color: var(--accent); font-size: 0.9rem; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="controls-container">
        <button class="control-btn" onclick="toggleTheme()">🎨 切換配色</button>
    </div>

    <header>
        <h1 id="page-title">👤 個人檔案與能力分析</h1>
        <a href="index.html" class="back-link">⬅️ 返回系統入口首頁</a>
    </header>

    <main class="main-container">
        <!-- 登入區域 -->
        <section id="login-section" class="login-card">
            <div class="login-title">系統身份驗證</div>
            <div class="form-group">
                <label for="login-class">班別 (Class)</label>
                <input type="text" id="login-class" class="form-control" placeholder="例如: 1A">
            </div>
            <div class="form-group">
                <label for="login-classno">班號 (Class Number)</label>
                <input type="text" id="login-classno" class="form-control" placeholder="例如: 15">
            </div>
            <div class="form-group">
                <label for="login-password">密碼 (E-book password)</label>
                <input type="password" id="login-password" class="form-control" placeholder="請輸入密碼">
            </div>
            <button class="login-btn" onclick="executeLogin()">登入並進入個人檔案</button>
            <div id="sync-msg" class="sync-status">🔄 正在與雲端同步...</div>
        </section>

        <!-- 儀表板區域 -->
        <section id="dashboard-section" class="dashboard-grid hidden">
            <div class="dashboard-panel">
                <div class="panel-title"><span>📝</span> 基本資料</div>
                <div class="info-container">
                    <div class="info-row"><span class="info-label">班別</span><span class="info-value" id="user-class">-</span></div>
                    <div class="info-row"><span class="info-label">學號</span><span class="info-value" id="user-id">-</span></div>
                    <div class="info-row"><span class="info-label">姓名</span><span class="info-value" id="user-name">-</span></div>
                </div>
            </div>

            <div class="dashboard-panel">
                <div class="panel-title"><span>📊</span> 歷來總分與六角能力指標</div>
                <div class="chart-panel-container" style="display:flex; flex-direction:column; align-items:center;">
                    <div class="total-score-banner">累積總分 <span id="user-total-score">0</span></div>
                    <div class="canvas-holder"><canvas id="radarCanvas" width="360" height="360"></canvas></div>
                </div>
            </div>

            <div class="dashboard-panel">
                <div class="panel-title"><span>📚</span> 各學科得分小計</div>
                <div class="subject-list" id="user-subject-list"></div>
            </div>

            <div class="dashboard-panel">
                <div class="panel-title"><span>🏅</span> 榮譽徽章 (開發中)</div>
                <div class="badge-grid">
                    <div class="badge-item"><span class="badge-icon">🔥</span><span class="badge-lock">鎖定</span></div>
                    <div class="badge-item"><span class="badge-icon">👑</span><span class="badge-lock">鎖定</span></div>
                    <div class="badge-item"><span class="badge-icon">🌟</span><span class="badge-lock">鎖定</span></div>
                </div>
            </div>
        </section>
    </main>

    <script>
        const GOOGLE_SHEET_URL = 'https://docs.google.com/spreadsheets/d/1lwPiw4WVCorhjgpHycsahXoaPGPPZ7XR9OWWoImZq5g/gviz/tq?tqx=out:csv&gid=0';
        let rawDataStore = [];
        let currentStudentData = { name: '', class: '', subjects: {}, radar: {'中文':0, '英文':0, '數學':0, '人文':0, '科學':0, '其他':0} };

        // 科目歸類核心邏輯
        function getSubjectCategory(sub) {
            if (!sub) return '其他';
            const s = sub.toString().toLowerCase().trim();
            if (['chinese', 'chinese-e', '中文'].includes(s)) return '中文';
            if (['english', 'english-c', '英文'].includes(s)) return '英文';
            if (['maths', 'math', '數學'].includes(s)) return '數學';
            if (['science', '科學'].includes(s)) return '科學';
            if (['humanities', '人文'].includes(s)) return '人文';
            return '其他';
        }

        async function fetchCloudData() {
            try {
                const response = await fetch(GOOGLE_SHEET_URL);
                const csvText = await response.text();
                parseCSV(csvText);
            } catch (err) { console.error("雲端數據加載失敗"); }
        }

        function parseCSV(text) {
            const lines = text.split('\n');
            rawDataStore = lines.slice(1).map(line => {
                const parts = line.split(','); 
                return { class: parts[2] ? parts[2].trim() : '', name: parts[3] ? parts[3].trim() : '', subject: parts[4] ? parts[4].trim() : '', score: parseFloat(parts[6]) || 0 };
            });
        }

        async function executeLogin() {
            const cls = document.getElementById('login-class').value.trim();
            const num = document.getElementById('login-classno').value.trim();
            const pwd = document.getElementById('login-password').value.trim();

            try {
                // 1. Base64 解碼讀取本地檔案
                const fileRes = await fetch(atob('Li9wYXNzd29yZC5jc3Y='));
                const csvText = await fileRes.text();
                const rows = csvText.split('\n');
                
                let found = false;
                for(let row of rows) {
                    const cols = row.split(',').map(c => c.trim());
                    if (cols.length >= 4 && cols[0] === cls && cols[1] === num && (cols[2] === pwd || cols[3] === pwd)) {
                        currentStudentData.name = cols[4] || "未知";
                        currentStudentData.class = cls;
                        found = true; break;
                    }
                }

                if (!found) { alert("登入失敗：資料不符"); return; }

                // 2. 篩選數據並分類
                const records = rawDataStore.filter(r => r.class.toUpperCase() === cls.toUpperCase() && r.name === currentStudentData.name);
                currentStudentData.totalScore = 0;
                currentStudentData.subjects = {};
                currentStudentData.radar = {'中文':0, '英文':0, '數學':0, '人文':0, '科學':0, '其他':0};

                records.forEach(r => {
                    const cat = getSubjectCategory(r.subject);
                    currentStudentData.totalScore += r.score;
                    currentStudentData.subjects[cat] = (currentStudentData.subjects[cat] || 0) + r.score;
                    currentStudentData.radar[cat] += r.score;
                });

                // 3. UI 更新
                document.getElementById('user-class').innerText = currentStudentData.class;
                document.getElementById('user-id').innerText = num;
                document.getElementById('user-name').innerText = currentStudentData.name;
                document.getElementById('user-total-score').innerText = currentStudentData.totalScore;

                // 渲染科目列表
                const list = document.getElementById('user-subject-list');
                list.innerHTML = Object.keys(currentStudentData.subjects).map(k => 
                    `<div class="subject-item"><span class="subject-name">${k}</span><span class="subject-score">${currentStudentData.subjects[k]} 分</span></div>`
                ).join('');

                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
                renderRadar();

            } catch(e) { alert("無法讀取驗證檔"); }
        }

        function renderRadar() {
            const canvas = document.getElementById('radarCanvas');
            const ctx = canvas.getContext('2d');
            const labels = ['中文', '英文', '數學', '人文', '科學', '其他'];
            const data = labels.map(l => currentStudentData.radar[l]);
            const maxVal = Math.max(...data, 100);
            
            // 繪圖簡化版
            ctx.clearRect(0,0,360,360);
            ctx.strokeStyle = "#00f9ff";
            ctx.beginPath();
            labels.forEach((l, i) => {
                const angle = (i * Math.PI / 3) - Math.PI / 2;
                const r = 120 * (data[i]/maxVal);
                const x = 180 + r * Math.cos(angle);
                const y = 180 + r * Math.sin(angle);
                if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
            });
            ctx.closePath();
            ctx.fillStyle = "rgba(255,0,170,0.3)";
            ctx.fill();
            ctx.stroke();
        }

        window.onload = fetchCloudData;
        function toggleTheme() { document.body.classList.toggle('school-theme'); }
    </script>
</body>
</html>
