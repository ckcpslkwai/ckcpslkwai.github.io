<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CKCPS WARS - Mr.Lee EDITION</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
      
        :root {
            --primary: #00f9ff;
            --secondary: #ff00aa;
            --accent: #39ff14;
        }
      
        body {
            margin: 0; padding: 0;
            font-family: 'Press Start 2P', system-ui;
            background: linear-gradient(180deg, #0a0a1f 0%, #05050f 100%);
            color: #fff;
            text-align: center;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
      
        header {
            background: #0a0a1f;
            padding: 12px;
            border-bottom: 3px solid var(--primary);
        }
      
        h1 {
            margin: 0;
            font-size: clamp(22px, 5vw, 30px);
            text-shadow: 0 0 10px var(--primary);
        }
      
        .container {
            max-width: 100%;
            margin: 0 auto;
            padding: 15px;
        }
      
        .screen { display: none; }
        .screen.active { display: block; }
      
        button {
            font-family: 'Press Start 2P', system-ui;
            padding: 14px 28px; margin: 8px;
            background: #12122e;
            color: #fff;
            border: 3px solid var(--primary);
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 0 12px rgba(0, 249, 255, 0.4);
            font-size: 15px;
        }
        button:hover {
            background: var(--primary);
            color: #000;
            transform: scale(1.03);
        }
      
        .section {
            background: #12122e;
            padding: 20px 18px;     /* 加大垂直空間 */
            margin: 12px 0;
            border-radius: 10px;
            border: 2px solid var(--primary);
        }
      
        select, input[type="number"] {
            font-family: 'Press Start 2P', system-ui;
            padding: 12px 12px;     /* 加大內距，讓框更高 */
            background: #0a0a1f;
            color: #fff;
            border: 2px solid var(--accent);
            margin: 6px 0;          /* 增加上下間距 */
            font-size: 14px;
            width: 95%;             /* 加寬 */
            max-width: 320px;
            box-sizing: border-box;
        }
      
        label {
            font-size: 13px;
            display: block;
            margin-bottom: 6px;
        }
      
        .score {
            font-size: 32px;
            color: var(--accent);
            text-shadow: 0 0 8px var(--accent);
        }
      
        .question {
            background: #0a0a1f;
            padding: 16px;
            border-radius: 8px;
            margin: 10px 0;
            min-height: 85px;
            display: flex;
            align-items: center;
            font-size: 17px; /* 設定一個統一的預設值 */
            line-height: 1.55;
            text-align: left;
            border: 2px solid var(--primary);
            box-sizing: border-box;
        }
      
        .option-btn {
            padding: 12px 14px;
            font-size: clamp(13px, 2vw, 15px);
            border: 2px solid #334155;
            background: #12122e;
            text-align: left;
            margin: 5px 0;
            width: 100%;
            box-sizing: border-box;
        }
      
        .leaderboard {
            background: #12122e;
            padding: 16px;
            border-radius: 10px;
            border: 2px solid var(--secondary);
            margin-bottom: 20px;
        }
       
        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(0, 1fr));
            gap: 14px;
            width: 100%;
            padding-bottom: 12px;
        }
      
        .team-card {
            background: #12122e;
            border: 4px solid #334155;
            border-radius: 10px;
            padding: 14px;
            min-height: 420px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }
       
        .team-header {
            margin-bottom: 8px;
        }
       
        .progress-bar {
            height: 8px;
            background: linear-gradient(90deg, var(--accent), var(--primary));
            margin: 8px 0;
            border-radius: 4px;
        }
       
        .options {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
       
        .compact-grid {
            display: grid;
            gap: 12px;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        }

        .csv-buttons {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }
        .csv-buttons button {
            flex: 1;
        }

        .end-condition {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-start;
        }
        .end-left, .end-right {
            flex: 1;
            min-width: 220px;
        }
    </style>
</head>
<body>
    <header>
        <h1>🏴‍☠️ CKCPS WARS 🏴‍☠️</h1>
        <p style="margin:4px 0 0 0; font-size:12px; color:#00f9ff;">CYBERPUNK NEON EDITION • P.1–P.6</p>
    </header>
    <div class="container">
        <!-- MENU SCREEN -->
        <div id="menu-screen" class="screen active">
            <!-- GAME MODE SELECTION -->
            <div class="section">
                <label style="color:#ff00aa; font-size:14px;">GAME MODE</label>
                <select id="game-mode" onchange="toggleGameMode()" style="width:100%; font-size:15px; padding:10px;">
                    <option value="team">👥 Team Mode（小組模式）</option>
                    <option value="solo">🧑 Solo Mode（個人模式）</option>
                </select>
            </div>

            <div class="compact-grid">
                <div class="section">
                    <label style="color:#00f9ff;">NUMBER OF TEAMS</label>
                    <select id="num-teams">
                        <option value="2">2 Teams</option>
                        <option value="3">3 Teams</option>
                        <option value="4" selected>4 Teams</option>
                        <option value="5">5 Teams</option>
                        <option value="6">6 Teams</option>
                    </select>
                </div>
                <div class="section">
                    <label style="color:#00f9ff;">SUBJECT <span style="font-size:10px; color:#94a3b8;">(filters Sample Set)</span></label>
                    <select id="subject">
                        <option value="English">English</option>
                        <option value="Maths">數學/Maths</option>
                        <option value="Science">Science</option>
                        <option value="科學">科學</option>
                        <option value="Chinese">中文</option>
                    </select>
                </div>
                <div class="section">
                    <label style="color:#00f9ff;">LEVEL <span style="font-size:10px; color:#94a3b8;">(filters Sample Set)</span></label>
                    <select id="level">
                        <option value="K" selected>K</option>
                        <option value="P1">P.1</option>
                        <option value="P2">P.2</option>
                        <option value="P3">P.3</option>
                        <option value="P4">P.4</option>
                        <option value="P5">P.5</option>
                        <option value="P6">P.6</option>
                    </select>
                </div>
            </div>

            <!-- SOLO MODE PLAYER INFO -->
            <div id="solo-info" class="section" style="display:none; border-color:#39ff14;">
                <label style="color:#39ff14;">PLAYER INFORMATION 玩家資料</label>
                <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:8px;">
                    <div style="flex:1; min-width:130px;">
                        <label style="font-size:12px; color:#94a3b8;">班級 Class</label>
                        <input type="text" id="solo-class" placeholder="e.g. 3A / P.3" style="width:100%; font-size:15px; padding:8px;">
                    </div>
                    <div style="flex:2; min-width:180px;">
                        <label style="font-size:12px; color:#94a3b8;">姓名 Name</label>
                        <input type="text" id="solo-name" placeholder="請輸入全名" style="width:100%; font-size:15px; padding:8px;">
                    </div>
                </div>
            </div>

            <!-- GAME END CONDITION 左右並排 -->
            <div class="section">
                <div class="end-condition">
                    <div class="end-left">
                        <label style="color:#ff00aa;">GAME END CONDITION</label>
                        <select id="end-mode" onchange="toggleEndOptions()" style="width:100%;">
                            <option value="score">First to Score</option>
                            <option value="time">Timed Game</option>
                        </select>
                    </div>
                    <div class="end-right">
                        <div id="score-options">
                            <label style="color:#ff00aa;">TARGET SCORE</label>
                            <input type="number" id="target-score" value="100" min="10" step="10" style="width:100%;">
                        </div>
                        <div id="time-options" style="display:none;">
                            <label style="color:#ff00aa;">DURATION (minutes)</label>
                            <input type="number" id="game-time" value="10" min="1" max="60" style="width:100%;">
                        </div>
                    </div>
                </div>
            </div>

            <!-- BACKGROUND MUSIC -->
            <div class="section">
                <label style="color:#00f9ff;">BACKGROUND MUSIC</label>
                <div style="display:flex; align-items:center; gap:12px; margin-top:8px; flex-wrap:wrap;">
                    <div style="flex:1; min-width:220px;">
                        <select id="music-track" style="width:100%; font-size:13px;">
                            <option value="">No music</option>
                            <option value="haaland.mp3">Music 1</option>
                            <option value="greensleeves.mp3">Music 2</option>
                            <option value="music3.mp3">Music 3</option>
                        </select>
                    </div>
                </div>
                <p style="margin:6px 0 0 0; font-size:10px; color:#94a3b8;">
                </p>
            </div>

            <div class="section">
                <label style="color:#39ff14;">QUESTION SOURCE</label>
                <div class="csv-buttons">
                    <button onclick="document.getElementById('csv-upload').click()">
                        📁 UPLOAD CSV 上載
                    </button>
                    <button onclick="loadDefaultCSV()" style="border-color:#39ff14;">
                        📋 Sample Set(Mixed) 題庫(混合)
                    </button>
                </div>
                <p style="margin:8px 0; font-size:11px; color:#94a3b8;">Sample Set uses selected SUBJECT + LEVEL to filter questions from default.csv</p>
                <input type="file" id="csv-upload" accept=".csv" style="display:none;" onchange="handleCSVUpload(event)">
            </div>
           
            <button onclick="startGame()" style="font-size:22px; padding:20px 60px; margin-top:20px; border-color:#39ff14; box-shadow: 0 0 25px #39ff14;">
                🚀 START BATTLE!
            </button>
        </div>

        <!-- GAME SCREEN -->
        <div id="game-screen" class="screen">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:10px;">
                <strong id="game-info" style="color:#00f9ff; flex:1;"></strong>
                
                <div style="display:flex; align-items:center; gap:8px; justify-content:center; flex:1;">
                    <span id="timer-display" style="font-size:15px; background:#12122e; padding:6px 12px; border-radius:6px; border:2px solid #ff00aa; display:none;"></span>
                    <button id="pause-btn" onclick="togglePause()" style="padding:10px 20px; font-size:13px; border-color:#ff00aa;">⏸️ PAUSE</button>
                </div>
                
                <div style="flex:1; text-align:right;">
                    <button onclick="endGame()" style="padding:10px 20px; font-size:13px;">END GAME</button>
                </div>
            </div>
            
            <div class="leaderboard">
                <h3 style="color:#ff00aa;">🏆 LEADERBOARD 🏆</h3>
                <div id="leaderboard" style="text-align:left;"></div>
            </div>
            
            <div id="team-grid" class="team-grid"></div>
        </div>
    </div>

    <script>
        // ==================== 題庫來源 ====================
        // 已取消內建題庫（questionsDB），現在「永遠只從 .csv 檔案提取問題」
        // 請務必先點擊「Sample Set」或上傳 CSV 後再開始遊戲

        let customQuestions = [];
        let currentSubject = '', currentLevel = '', teams = [], currentQuestions = [];
        let gameInterval = null, endMode = 'score', targetScore = 100, gameEndTime = null;
        let isPaused = false;
        let pausedRemainingTime = 0;
        let pendingResultTimeouts = {};   // 用來儲存各隊「顯示結果後自動換題」的 timer ID

        // ==================== SOLO MODE RECORDS ====================
        let soloRecords = JSON.parse(localStorage.getItem('ckcps_solo_records') || '[]');

        // ==================== GOOGLE SHEET 雲端記錄設定 ====================
        // ⚠️ 使用前請把下面 URL 改成你自己部署的 Google Apps Script Web App URL
        const GOOGLE_SHEET_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbyMVPcda6_YBIBXmy7iZFQjbIilACiNGVTz1CwB3yMNy7Od3VS81AE8lbKkTjABmt5f/exec';

        async function saveSoloResultToGoogleSheet(playerData) {
            if (!GOOGLE_SHEET_WEBAPP_URL || GOOGLE_SHEET_WEBAPP_URL.includes('你的部署ID')) {
                alert('尚未設定 Google Sheet Web App URL！\n請先按照說明部署 Apps Script 並填入 URL。');
                return false;
            }

            try {
                const response = await fetch(GOOGLE_SHEET_WEBAPP_URL, {
                    method: 'POST',
                    mode: 'no-cors', // Apps Script Web App 常用
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(playerData)
                });

                // 因為 no-cors 無法讀取回應，所以直接假設成功
                alert(`✅ 成績已成功儲存到雲端！\n\n班級：${playerData.class}\n姓名：${playerData.name}\n分數：${playerData.score}`);
                return true;
            } catch (error) {
                console.error(error);
                alert('❌ 儲存失敗，請檢查網絡或 URL 是否正確。');
                return false;
            }
        }

        // ==================== BACKGROUND MUSIC ====================
        let bgmAudio = null;
        let isMusicPlaying = false;

        function toggleEndOptions() {
            const mode = document.getElementById('end-mode').value;
            document.getElementById('score-options').style.display = mode === 'score' ? 'block' : 'none';
            document.getElementById('time-options').style.display = mode === 'time' ? 'block' : 'none';
        }

        function toggleGameMode() {
            const mode = document.getElementById('game-mode').value;
            const numTeamsSection = document.getElementById('num-teams').parentElement;
            const soloInfo = document.getElementById('solo-info');

            if (mode === 'solo') {
                numTeamsSection.style.display = 'none';
                soloInfo.style.display = 'block';
            } else {
                numTeamsSection.style.display = 'block';
                soloInfo.style.display = 'none';
            }
        }

        // ==================== PAUSE / RESUME ====================
        function disableAllAnswerButtons(disabled) {
            // More reliable: directly select all answer buttons in the grid
            const allButtons = document.querySelectorAll('#team-grid .option-btn');
            allButtons.forEach(btn => {
                btn.disabled = disabled;
            });
        }

        function togglePause() {
            const pauseBtn = document.getElementById('pause-btn');
            if (!pauseBtn) return;

            isPaused = !isPaused;

            if (isPaused) {
                // === PAUSE ===
                if (gameInterval) {
                    clearInterval(gameInterval);
                    gameInterval = null;
                }
                if (endMode === 'time' && gameEndTime) {
                    pausedRemainingTime = gameEndTime - Date.now();
                }
                disableAllAnswerButtons(true);

                // 清除所有「顯示結果後自動換下一題」的 timer，讓畫面凍結在正確/錯誤畫面
                Object.values(pendingResultTimeouts).forEach(id => clearTimeout(id));
                pendingResultTimeouts = {};

                // 暫停背景音樂
                pauseBackgroundMusic();

                pauseBtn.innerHTML = '▶️ RESUME';
                pauseBtn.style.borderColor = '#facc15';
                pauseBtn.style.boxShadow = '0 0 12px rgba(250, 204, 21, 0.5)';
            } else {
                // === RESUME ===
                if (endMode === 'time' && pausedRemainingTime > 0) {
                    gameEndTime = Date.now() + pausedRemainingTime;
                    startTimer();
                }
                disableAllAnswerButtons(false);

                // 恢復背景音樂
                resumeBackgroundMusic();

                // 如果之前有隊伍正顯示「正確/錯誤」結果，Resume 時立即幫他們換下一題
                teams.forEach((team, idx) => {
                    const statusEl = document.getElementById(`status-${team.id}`);
                    if (statusEl && statusEl.innerHTML.trim() !== '') {
                        // 清除狀態並換新題
                        currentQuestions[idx] = getRandomQuestion();
                        const qEl = document.getElementById(`qtext-${team.id}`);
                        if (qEl) qEl.textContent = currentQuestions[idx].q;
                        if (statusEl) statusEl.innerHTML = '';

                        const optsDiv = document.getElementById(`options-${team.id}`);
                        if (optsDiv) {
                            optsDiv.innerHTML = '';
                            currentQuestions[idx].options.forEach((opt, i) => {
                                const btn = document.createElement('button');
                                btn.className = 'option-btn';
                                btn.textContent = `${String.fromCharCode(65 + i)}. ${opt}`;
                                btn.onclick = () => handleAnswer(team.id, i, idx);
                                optsDiv.appendChild(btn);
                            });
                        }
                    }
                });

                pauseBtn.innerHTML = '⏸️ PAUSE';
                pauseBtn.style.borderColor = '#ff00aa';
                pauseBtn.style.boxShadow = '0 0 12px rgba(0, 249, 255, 0.4)';
            }
        }

        // ==================== BACKGROUND MUSIC (使用同資料夾的 mp3) ====================
        function playBackgroundMusic() {
            if (isMusicPlaying) return;

            const track = document.getElementById('music-track')?.value;

            // 如果選擇 "No music" 或沒有選擇，則不播放音樂
            if (!track) {
                isMusicPlaying = false;
                return;
            }

            // 停止舊音樂
            stopBackgroundMusic();

            bgmAudio = new Audio(track);
            bgmAudio.loop = true;
            bgmAudio.volume = 0.6; // 固定音量

            bgmAudio.play().catch(() => {
                // 如果檔案不存在或無法播放，靜默失敗
                console.log('%c[Music] 無法播放 ' + track + '，請確認檔案是否存在於同資料夾', 'color:#f59e0b');
            });

            isMusicPlaying = true;
        }

        function stopBackgroundMusic() {
            isMusicPlaying = false;
            if (bgmAudio) {
                bgmAudio.pause();
                bgmAudio.currentTime = 0;
                bgmAudio = null;
            }
        }

        function pauseBackgroundMusic() {
            if (bgmAudio && !bgmAudio.paused) {
                bgmAudio.pause();
            }
        }

        function resumeBackgroundMusic() {
            if (bgmAudio && bgmAudio.paused && isMusicPlaying) {
                bgmAudio.play().catch(() => {});
            }
        }

        async function loadDefaultCSV() {
            try {
                const response = await fetch('./default.csv');
                if (!response.ok) throw new Error('File not found');
                const csvText = await response.text();
                const allParsed = parseCSV(csvText);
                const selectedSubject = document.getElementById('subject').value;
                const selectedLevel = document.getElementById('level').value;
                customQuestions = filterQuestionsBySubjectLevel(allParsed, selectedSubject, selectedLevel);
                if (customQuestions.length === 0) {
                    alert(`⚠️ No questions found for ${selectedSubject} ${selectedLevel} in default.csv.\nLoaded all ${allParsed.length} questions instead.`);
                    customQuestions = allParsed;
                } else {
                    alert(`✅ Default Set loaded! ${customQuestions.length} questions for ${selectedSubject} - ${selectedLevel}`);
                }
            } catch (err) {
                alert('❌ Cannot load default.csv\nPlease make sure default.csv is in the same folder.');
            }
        }

        function handleCSVUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                const allParsed = parseCSV(e.target.result);
                const selectedSubject = document.getElementById('subject').value;
                const selectedLevel = document.getElementById('level').value;
                customQuestions = filterQuestionsBySubjectLevel(allParsed, selectedSubject, selectedLevel);
                if (customQuestions.length === 0) {
                    alert(`⚠️ No matching questions for ${selectedSubject} ${selectedLevel} in your CSV. Using all ${allParsed.length} questions.`);
                    customQuestions = allParsed;
                } else {
                    alert(`✅ CSV loaded! ${customQuestions.length} questions matched for ${selectedSubject} - ${selectedLevel}`);
                }
            };
            reader.readAsText(file);
        }

        function startGame() {
            // 強制要求先載入 CSV（已取消內建題庫）
            if (!customQuestions || customQuestions.length === 0) {
                alert('⚠️ 請先載入題庫！\n\n請點擊「📋 Sample Set」載入預設題庫，\n或上傳您的 CSV 檔案。\n\n（已取消內建題庫，遊戲現在只使用 .csv 檔案）');
                return;
            }

            const gameMode = document.getElementById('game-mode').value;

            let numTeams;
            if (gameMode === 'solo') {
                // Solo Mode 驗證
                const soloClass = document.getElementById('solo-class').value.trim();
                const soloName = document.getElementById('solo-name').value.trim();

                if (!soloClass || !soloName) {
                    alert('請填寫班級和姓名！\nPlease enter your Class and Name.');
                    return;
                }

                // 儲存 Solo 玩家資料
                window.currentSoloPlayer = { class: soloClass, name: soloName };
                numTeams = 1; // 強制只有 1 個卡片
            } else {
                numTeams = parseInt(document.getElementById('num-teams').value);
                window.currentSoloPlayer = null;
            }

            currentSubject = document.getElementById('subject').value;
            currentLevel = document.getElementById('level').value;
            endMode = document.getElementById('end-mode').value;
            if (endMode === 'score') targetScore = parseInt(document.getElementById('target-score').value) || 100;
            else window.gameMinutes = parseInt(document.getElementById('game-time').value) || 10;

            document.getElementById('menu-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
            const infoEl = document.getElementById('game-info');

            if (gameMode === 'solo' && window.currentSoloPlayer) {
                infoEl.innerHTML = `${currentSubject} • ${currentLevel} &nbsp;&nbsp; | &nbsp;&nbsp; <span style="color:#39ff14;">${window.currentSoloPlayer.class} ${window.currentSoloPlayer.name}</span>`;
            } else {
                infoEl.innerHTML = `${currentSubject} • ${currentLevel} <span style="color:#94a3b8; font-size:12px;">(${customQuestions.length} Qs from CSV)</span>`;
            }

            initTeams(numTeams);
            playBackgroundMusic();
        }

        function initTeams(numTeams) {
            teams = []; currentQuestions = [];
            const colors = ['#f87171', '#60a5fa', '#facc15', '#a78bfa', '#f472b6', '#34d399'];
            for (let i = 0; i < numTeams; i++) {
                teams.push({ id: i+1, name: `Team ${String.fromCharCode(65+i)}`, score: 0, color: colors[i % colors.length] });
                currentQuestions.push(getRandomQuestion());
            }
            renderAllTeams();
            updateLeaderboard();

            // Reset pause state
            isPaused = false;
            pausedRemainingTime = 0;
            const pauseBtn = document.getElementById('pause-btn');
            if (pauseBtn) {
                pauseBtn.innerHTML = '⏸️ PAUSE';
                pauseBtn.style.borderColor = '#ff00aa';
                pauseBtn.style.boxShadow = '0 0 12px rgba(0, 249, 255, 0.4)';
                pauseBtn.style.display = 'inline-block';   // Always show in both modes
            }

            if (endMode === 'time') {
                gameEndTime = Date.now() + (window.gameMinutes || 10) * 60 * 1000;
                document.getElementById('timer-display').style.display = 'inline';
                startTimer();
            } else {
                document.getElementById('timer-display').style.display = 'none';
            }
        }

        function parseCSV(csvText) {
            // 移除 UTF-8 BOM（如果存在）
            if (csvText.charCodeAt(0) === 0xFEFF) {
                csvText = csvText.slice(1);
            }

            const lines = csvText.trim().split('\n');
            if (lines.length < 2) return [];

            // 解析 header 並清理欄位名稱（處理換行、引號、BOM）
            let rawHeader = parseCSVLine(lines[0]);
            const header = rawHeader.map(h => 
                h.toLowerCase()
                 .trim()
                 .replace(/"/g, '')
                 .replace(/\n/g, ' ')
                 .replace(/\s+/g, ' ')
                 .trim()
            );

            const questions = [];

            // 根據新 CSV 格式精確對應欄位
            const findIdx = (keywords) => header.findIndex(h => keywords.some(k => h.includes(k)));

            const idxSubject = findIdx(['subject']);
            const idxLevel   = findIdx(['level']);
            const idxQ       = findIdx(['question text']);

            // Answer 欄位（依順序 Answer 1 ~ Answer 4）
            const idxAnswer1 = findIdx(['answer 1']);
            const idxAnswer2 = findIdx(['answer 2']);
            const idxAnswer3 = findIdx(['answer 3']);
            const idxAnswer4 = findIdx(['answer 4']);

            const idxCorrect = findIdx(['correct answer', 'correct']);

            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const row = parseCSVLine(lines[i]);
                if (row.length < 4) continue;

                const qText = (idxQ !== -1 ? row[idxQ] : row[3] || '').trim();

                // 收集非空選項（Answer 1~4）
                const opts = [];
                [idxAnswer1, idxAnswer2, idxAnswer3, idxAnswer4].forEach(idx => {
                    if (idx !== -1 && row[idx] && row[idx].trim()) {
                        opts.push(row[idx].trim());
                    }
                });

                // Correct Answer（1-based → 0-based）
                let correctIdx = -1;
                if (idxCorrect !== -1 && row[idxCorrect]) {
                    correctIdx = parseInt(row[idxCorrect].trim()) - 1;
                } else {
                    // 備用：取最後一欄
                    correctIdx = parseInt(row[row.length - 1]) - 1;
                }

                const subj = (idxSubject !== -1 ? row[idxSubject] : '').trim();
                const lvl  = (idxLevel   !== -1 ? row[idxLevel]   : '').trim();

                if (qText && opts.length >= 2 && !isNaN(correctIdx) && correctIdx >= 0 && correctIdx < opts.length) {
                    questions.push({
                        q: qText,
                        options: opts,
                        ans: correctIdx,
                        subject: subj,
                        level: lvl
                    });
                }
            }
            return questions;
        }

        function parseCSVLine(line) {
            const result = [];
            let current = '', inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') inQuotes = !inQuotes;
                else if (char === ',' && !inQuotes) { 
                    result.push(current.trim()); 
                    current = ''; 
                }
                else current += char;
            }
            result.push(current.trim());
            return result;
        }

        function filterQuestionsBySubjectLevel(allQuestions, subject, level) {
            if (!allQuestions || allQuestions.length === 0) return [];
            const norm = (str) => (str || '').toLowerCase().replace(/\.|\s|grade|form|年級|級/g, '').trim();
            const targetSub = norm(subject);
            const targetLvl = norm(level);  // e.g. "p6", "p1"

            return allQuestions.filter(q => {
                const qSub = norm(q.subject);
                const qLvl = norm(q.level);
                // Match if both subject and level match, or if CSV didn't have them (empty), include anyway
                const subMatch = !qSub || qSub === targetSub || 
                                 (targetSub === 'maths' && (qSub === 'math' || qSub === '數學')) ||
                                 (targetSub === '科學' && (qSub === '科學')) ||
                                 (targetSub === 'science' && (qSub === 'Science')) ||
                                 (targetSub === 'chinese' && (qSub === '中文' || qSub === 'chinese'));
                const lvlMatch = !qLvl || qLvl === targetLvl || qLvl === targetLvl.replace('p','');
                return subMatch && lvlMatch;
            });
        }

        function getRandomQuestion() {
            // 永遠只從已載入的 CSV 題庫提取問題（已取消內建題庫）
            if (!customQuestions || customQuestions.length === 0) {
                // 安全返回，避免遊戲崩潰（實際上 startGame 會先阻擋）
                return {
                    q: "請先載入 CSV 題庫！",
                    options: ["Sample Set", "上傳 CSV", "選擇科目年級", "重新開始"],
                    ans: 0
                };
            }
            const pool = customQuestions;
            const original = pool[Math.floor(Math.random() * pool.length)];
            let shuffled = [...original.options];
            const correctText = shuffled[original.ans];
            for (let i = shuffled.length-1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i+1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return { q: original.q, options: shuffled, ans: shuffled.indexOf(correctText) };
        }

function renderAllTeams() {
    const grid = document.getElementById('team-grid');
    grid.innerHTML = '';
    teams.forEach((team, index) => {
        const card = document.createElement('div');
        // ... (省略前面代碼)

        const qText = currentQuestions[index].q;
        // 嚴格判斷：只有 1 或 2 個字時才變大
        const isShort = qText.length > 0 && qText.length <= 5;
        
        card.innerHTML = `
            <div class="team-header">
                <div class="team-name" style="color:${team.color}">${team.name}</div>
                <div class="score" id="score-${team.id}">${team.score}</div>
            </div>
            <div class="progress-container">
                <div class="progress-bar" id="progress-${team.id}" style="width:0%"></div>
            </div>
            <div class="question" id="qtext-${team.id}"
                 style="font-size: ${isShort ? '70px' : '17px'};
                        line-height: ${isShort ? '1.2' : '1.55'}">
                ${qText}
            </div>
            <div class="options" id="options-${team.id}"></div>
            <div class="status" id="status-${team.id}"></div>
        `;
       grid.appendChild(card);

        const optsDiv = document.getElementById(`options-${team.id}`);
        currentQuestions[index].options.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';            
            btn.textContent = `${String.fromCharCode(65+i)}. ${opt}`;
            btn.onclick = () => handleAnswer(team.id, i, index);
            optsDiv.appendChild(btn);
        });
    });

        }


        function handleAnswer(teamId, selectedIndex, teamIndex) {
            const q = currentQuestions[teamIndex];
            const isCorrect = selectedIndex === q.ans;
            const statusEl = document.getElementById(`status-${teamId}`);
            const buttons = document.querySelectorAll(`#options-${teamId} .option-btn`);
           
            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === q.ans) btn.style.borderColor = '#39ff14';
                if (idx === selectedIndex && !isCorrect) btn.style.borderColor = '#ff00aa';
            });
            if (isCorrect) {
                teams[teamIndex].score += 10;
                statusEl.innerHTML = `<span style="color:#39ff14">✅ CORRECT! +10</span>`;
            } else {
                statusEl.innerHTML = `<span style="color:#ff00aa">❌ Wrong. Answer: ${String.fromCharCode(65 + q.ans)}</span>`;
            }
            document.getElementById(`score-${teamId}`).textContent = teams[teamIndex].score;
            const progress = Math.min((teams[teamIndex].score / 300) * 100, 100);
            document.getElementById(`progress-${teamId}`).style.width = `${progress}%`;
            updateLeaderboard();
            if (endMode === 'score' && teams[teamIndex].score >= targetScore) {
                setTimeout(() => { alert(`🎉 ${teams[teamIndex].name} WINS!`); endGame(); }, 800);
                return;
            }
            // 儲存 timer ID，方便 Pause 時清除
            pendingResultTimeouts[teamId] = setTimeout(() => {
                currentQuestions[teamIndex] = getRandomQuestion();
                document.getElementById(`qtext-${teamId}`).textContent = currentQuestions[teamIndex].q;
                document.getElementById(`status-${teamId}`).innerHTML = '';
                const optsDiv = document.getElementById(`options-${teamId}`);
                optsDiv.innerHTML = '';
                currentQuestions[teamIndex].options.forEach((opt, i) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.textContent = `${String.fromCharCode(65+i)}. ${opt}`;
                    btn.onclick = () => handleAnswer(teamId, i, teamIndex);
                    optsDiv.appendChild(btn);
                });

                delete pendingResultTimeouts[teamId];
            }, 1600);
        }

        function updateLeaderboard() {
            const sorted = [...teams].sort((a,b) => b.score - a.score);
            let html = '';
            sorted.forEach((t, i) => {
                html += `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #334155;">
                    <span><strong>#${i+1}</strong> ${t.name}</span>
                    <span style="color:#39ff14;font-weight:bold;">${t.score} pts</span>
                </div>`;
            });
            document.getElementById('leaderboard').innerHTML = html;
        }

        function endGame() {
            if (!confirm("End game and return to menu?")) return;

            const wasSolo = !!window.currentSoloPlayer;
            const finalScore = (teams.length > 0) ? teams[0].score : 0;

            stopBackgroundMusic();
            if (gameInterval) clearInterval(gameInterval);

            // Solo Mode 結束後詢問是否儲存到雲端
            if (wasSolo && window.currentSoloPlayer) {
                const player = window.currentSoloPlayer;
                const confirmSave = confirm(
                    `Solo Mode 結束！\n\n` +
                    `班級：${player.class}\n` +
                    `姓名：${player.name}\n` +
                    `分數：${finalScore} 分\n\n` +
                    `是否要將成績儲存到 Google Sheet 雲端？`
                );

                if (confirmSave) {
                    const recordData = {
                        timestamp: new Date().toISOString(),
                        date: new Date().toLocaleDateString('zh-HK'),
                        time: new Date().toLocaleTimeString('zh-HK'),
                        class: player.class,
                        name: player.name,
                        subject: currentSubject,
                        level: currentLevel,
                        score: finalScore,
                        endMode: endMode,
                        targetOrTime: endMode === 'score' ? targetScore : (window.gameMinutes || 10)
                    };

                    saveSoloResultToGoogleSheet(recordData);
                }
            }

            // Reset pause state
            isPaused = false;
            pausedRemainingTime = 0;
            const pauseBtn = document.getElementById('pause-btn');
            if (pauseBtn) {
                pauseBtn.style.display = 'none';
                pauseBtn.innerHTML = '⏸️ PAUSE';
            }
            document.getElementById('game-screen').classList.remove('active');
            document.getElementById('menu-screen').classList.add('active');
            document.getElementById('csv-upload').value = '';
            document.getElementById('timer-display').style.display = 'none';
            customQuestions = [];
            window.currentSoloPlayer = null;
        }

        function startTimer() {
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(() => {
                const remaining = Math.ceil((gameEndTime - Date.now()) / 1000);
                if (remaining <= 0) { 
                    clearInterval(gameInterval); 
                    alert("⏰ Time's Up!"); 
                    endGame(); 
                    return; 
                }
                const min = Math.floor(remaining / 60);
                const sec = remaining % 60;
                document.getElementById('timer-display').textContent = `TIME: ${min}:${sec < 10 ? '0'+sec : sec}`;
            }, 1000);
        }

        document.addEventListener('keydown', e => {
            if (!document.getElementById('game-screen').classList.contains('active') || isPaused) return;
            const key = e.key.toUpperCase();
            if (!['A','B','C','D'].includes(key)) return;
            const idx = key.charCodeAt(0) - 65;
            teams.forEach(team => {
                const opts = document.getElementById(`options-${team.id}`);
                if (opts && !opts.querySelector('button[disabled]')) {
                    const btns = opts.querySelectorAll('.option-btn');
                    if (btns[idx]) btns[idx].click();
                }
            });
        });

        window.onload = () => {
            toggleEndOptions();
            toggleGameMode(); // 初始化遊戲模式顯示
        };
                    // 禁止右鍵選單（防止學生查看原始碼或作弊）
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                return false;
            });
    </script>
