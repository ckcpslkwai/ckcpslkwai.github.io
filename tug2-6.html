<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CKCPS WARS V2607080909</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
      
        :root {
            --primary: #00f9ff;
            --secondary: #ff00aa;
            --accent: #39ff14;
        }
      
        body {
            margin: 0; padding: 0;
            font-family: 'Press Start 2P', system-ui;
            background: linear-gradient(180deg, #0a0a1f 0%, #05050f 100%);
            color: #fff;
            text-align: center;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
      
        header {
            background: #0a0a1f;
            padding: 12px;
            border-bottom: 3px solid var(--primary);
        }
      
        h1 {
            margin: 0;
            font-size: clamp(16px, 4vw, 28px);
            color: var(--primary);
            text-shadow: 0 0 10px var(--primary);
            letter-spacing: 2px;
        }
      
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
      
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }
      
        .panel {
            background: rgba(10, 10, 31, 0.8);
            border: 4px solid var(--primary);
            box-shadow: 0 0 20px rgba(0, 249, 255, 0.3);
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 8px;
        }
      
        .panel-title {
            color: var(--secondary);
            font-size: clamp(12px, 3vw, 20px);
            margin-top: 0;
            margin-bottom: 20px;
            text-shadow: 0 0 8px var(--secondary);
        }
      
        button, .file-label {
            font-family: 'Press Start 2P', system-ui;
            background: #000;
            color: #fff;
            border: 3px solid #fff;
            padding: 12px 24px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 12px;
            display: inline-block;
            margin: 8px;
            text-transform: uppercase;
        }
        button:hover, .file-label:hover {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary);
            transform: scale(1.05);
        }
        button:active {
            transform: scale(0.95);
        }
        button:disabled {
            background: #333 !important;
            color: #888 !important;
            border-color: #555 !important;
            box-shadow: none !important;
            cursor: not-allowed;
            transform: none !important;
        }
      
        input[type="text"], input[type="number"], select {
            font-family: 'Press Start 2P', system-ui;
            background: #000;
            color: #fff;
            border: 3px solid var(--primary);
            padding: 10px;
            font-size: 12px;
            margin: 8px;
            box-sizing: border-box;
            outline: none;
        }
        input:focus, select:focus {
            box-shadow: 0 0 10px var(--primary);
        }
      
        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
      
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 10px;
            margin-bottom: 8px;
            color: var(--primary);
        }
        .form-group input, .form-group select {
            width: 100%;
            margin: 0;
        }
      
        #csv-upload {
            display: none;
        }
      
        #timer-display {
            font-size: clamp(18px, 5vw, 36px);
            color: var(--secondary);
            text-shadow: 0 0 12px var(--secondary);
            margin: 15px 0;
            display: none;
        }
      
        .teams-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
        }
        .team-box {
            background: rgba(0,0,0,0.6);
            border: 4px solid #fff;
            padding: 20px;
            flex: 1;
            min-width: 280px;
            max-width: 500px;
            border-radius: 6px;
            transition: border-color 0.3s;
        }
        .team-box.active-turn {
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent);
        }
        .team-name {
            font-size: 16px;
            margin-bottom: 10px;
            color: var(--primary);
        }
        .team-score {
            font-size: 24px;
            margin-bottom: 15px;
            color: var(--accent);
        }
      
        .question-box {
            background: #000;
            border: 3px solid var(--primary);
            padding: 15px;
            margin-bottom: 15px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(11px, 2.5vw, 16px);
            line-height: 1.6;
        }
      
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }
        @media(min-width: 600px) {
            .options-grid { grid-template-columns: 1fr 1fr; }
        }
        .option-btn {
            text-align: left;
            padding: 12px;
            font-size: clamp(10px, 2vw, 13px);
            margin: 0;
            line-height: 1.4;
            display: flex;
            align-items: flex-start;
        }
        .option-prefix {
            color: var(--secondary);
            margin-right: 8px;
            flex-shrink: 0;
        }
      
        .feedback-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .feedback-content {
            font-size: 32px;
            margin-bottom: 20px;
            animation: pulse 0.5s infinite alternate;
        }
        .feedback-content.correct { color: var(--accent); text-shadow: 0 0 15px var(--accent); }
        .feedback-content.wrong { color: var(--secondary); text-shadow: 0 0 15px var(--secondary); }
        .explanation-text {
            max-width: 80%;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #ccc;
        }
      
        @keyframes pulse {
            from { transform: scale(0.95); }
            to { transform: scale(1.05); }
        }
      
        #audio-controls {
            position: fixed;
            bottom: 10px;
            right: 10px;
            z-index: 999;
        }
        #audio-controls button {
            padding: 6px 12px;
            font-size: 10px;
            margin: 2px;
            border-width: 2px;
            background: rgba(0,0,0,0.7);
        }
        
        .footer-credit {
            margin-top: 40px;
            font-size: 9px;
            color: #555;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <header>
        <h1>CKCPS WARS</h1>
    </header>

    <div class="container">
        
        <div id="menu-screen" class="screen active">
            <div class="panel">
                <h2 class="panel-title">1. LOAD QUESTIONS (CSV)</h2>
                <label for="csv-upload" class="file-label">📂 CHOOSE CSV FILE</label>
                <input type="file" id="csv-upload" accept=".csv">
                <div id="file-status" style="margin-top:10px; font-size:10px; color:var(--accent);">NO FILE LOADED</div>
            </div>

            <div class="panel">
                <h2 class="panel-title">2. GAME CONFIGURATION</h2>
                <div class="grid-2">
                    <div class="form-group">
                        <label>GAME MODE</label>
                        <select id="game-mode-select" onchange="toggleSoloMode()">
                            <option value="solo">SOLO MODE (單人挑戰)</option>
                            <option value="multi">TEAM MODE (小組對抗)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>END CONDITION</label>
                        <select id="end-mode" onchange="toggleEndOptions()">
                            <option value="score">REACH TARGET SCORE</option>
                            <option value="time">TIME LIMIT</option>
                        </select>
                    </div>
                </div>

                <div class="grid-2" style="margin-top:15px;">
                    <div id="target-score-group" class="form-group">
                        <label>TARGET SCORE</label>
                        <input type="number" id="target-score" value="10" min="1">
                    </div>
                    <div id="time-limit-group" class="form-group" style="display:none;">
                        <label>TIME LIMIT (MINUTES)</label>
                        <input type="number" id="time-limit" value="3" min="1">
                    </div>
                </div>

                <div id="solo-config" style="margin-top:20px; border-top:2px dashed #444; padding-top:20px;">
                    <div class="grid-2">
                        <div class="form-group">
                            <label>CLASS (班別)</label>
                            <input type="text" id="solo-class" placeholder="e.g. 4A" max-length="10">
                        </div>
                        <div class="form-group">
                            <label>NAME (姓名)</label>
                            <input type="text" id="solo-name" placeholder="e.g. Tom">
                        </div>
                    </div>
                </div>

                <div id="team-config" style="display:none; margin-top:20px; border-top:2px dashed #444; padding-top:20px;">
                    <div class="form-group" style="max-width:300px; margin:0 auto 15px auto;">
                        <label style="text-align:center;">NUMBER OF TEAMS</label>
                        <select id="team-count" onchange="generateTeamFields()">
                            <option value="1">1 TEAM</option>
                            <option value="2" selected>2 TEAMS</option>
                            <option value="3">3 TEAMS</option>
                            <option value="4">4 TEAMS</option>
                        </select>
                    </div>
                    <div id="team-names-inputs" class="grid-2"></div>
                </div>
            </div>

            <button id="start-btn" onclick="startGame()">🚀 START GAME</button>
            
            <div class="footer-credit">POWERED BY CKCPS | V2607080909</div>
        </div>

        <div id="game-screen" class="screen">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <button onclick="quitGame()" style="background:#500; border-color:#f00; font-size:10px; padding:8px 16px;">⬅️ QUIT</button>
                <button id="pause-btn" onclick="togglePause()" style="background:#550; border-color:#ff0; font-size:10px; padding:8px 16px; display:none;">⏸️ PAUSE</button>
            </div>
            
            <div id="timer-display">TIME: 0:00</div>
            
            <div id="teams-container" class="teams-container"></div>
        </div>

    </div>

    <div id="feedback-overlay" class="feedback-overlay">
        <div id="feedback-text" class="feedback-content"></div>
        <div id="explanation-text" class="explanation-text"></div>
        <button id="next-btn">CONTINUE ➡️</button>
    </div>

    <div id="audio-controls">
        <button onclick="toggleMute()">🔊/🔇 MUSIC</button>
    </div>

    <audio id="bg-music" loop>
        <source src="https://actions.google.com/sounds/v1/science_fiction/retro_video_game_loop.ogg" type="audio/ogg">
    </audio>
    <audio id="sound-correct">
        <source src="https://actions.google.com/sounds/v1/cartoon/positive_guitar_chords.ogg" type="audio/ogg">
    </audio>
    <audio id="sound-wrong">
        <source src="https://actions.google.com/sounds/v1/alarms/digital_watch_alarm_long.ogg" type="audio/ogg">
    </audio>

    <script>
        // GOOGLE SHEET APPS SCRIPT URL
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyfDofGstx_7l_yNIdYm2VvV_l6Z7fUo7eor_hOas5u_HcozCisZcZ9gD7O6V_6XW-qEA/exec";

        let allQuestions = {};
        let currentQuestions = []; 
        let customQuestions = [];
        let teams = [];
        let currentTeamTurn = 0; 
        let gameMode = 'solo'; 
        let endMode = 'score'; 
        let targetScore = 10;
        let gameInterval = null;
        let gameEndTime = 0;
        let isPaused = false;
        let pausedRemainingTime = 0;
        let currentSubject = "General";
        let currentLevel = "Mixed";
        let isMuted = false;

        // Default Fallback Questions if no CSV uploaded
        const defaultQuestions = [
            { question: "What is the capital of France?", options: ["A. Berlin", "B. Madrid", "C. Paris", "D. Rome"], ans: 2, explanation: "Paris is the capital and most populous city of France." },
            { question: "Which planet is known as the Red Planet?", options: ["A. Earth", "B. Mars", "C. Jupiter", "D. Venus"], ans: 1, explanation: "Mars is often called the Red Planet due to iron oxide on its surface." },
            { question: "What is 5 + 7?", options: ["A. 10", "B. 11", "C. 12", "D. 13"], ans: 2, explanation: "Simple addition: 5 + 7 equals 12." }
        ];

        // Handle CSV File Upload
        document.getElementById('csv-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const text = evt.target.result;
                    const parsed = parseCSV(text);
                    if (parsed && parsed.length > 0) {
                        customQuestions = parsed;
                        document.getElementById('file-status').textContent = `✅ LOADED ${parsed.length} CUSTOM QUESTIONS`;
                        
                        // Try to auto-detect Subject/Level from filename if formatted as Subject_Level.csv
                        const nameNoExt = file.name.replace(/\.[^/.]+$/, "");
                        const parts = nameNoExt.split('_');
                        if (parts.length >= 2) {
                            currentSubject = parts[0];
                            currentLevel = parts[1];
                        } else {
                            currentSubject = nameNoExt;
                            currentLevel = "Custom";
                        }
                    } else {
                        alert("Could not parse CSV or file is empty. Please ensure correct format.");
                        resetFileInput();
                    }
                } catch (err) {
                    alert("Error reading file: " + err.message);
                    resetFileInput();
                }
            };
            reader.readAsText(file, 'UTF-8');
        });

        function resetFileInput() {
            document.getElementById('csv-upload').value = '';
            document.getElementById('file-status').textContent = "NO FILE LOADED";
            customQuestions = [];
            currentSubject = "General";
            currentLevel = "Mixed";
        }

        function parseCSV(text) {
            const lines = [];
            let row = [""];
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                let next = text[i+1];
                if (c === '"') {
                    if (inQuotes && next === '"') { row[row.length - 1] += '"'; i++; }
                    else { inQuotes = !inQuotes; }
                } else if (c === ',' && !inQuotes) {
                    row.push('');
                } else if ((c === '\r' || c === '\n') && !inQuotes) {
                    if (c === '\r' && next === '\n') { i++; }
                    lines.push(row);
                    row = [''];
                } else {
                    row[row.length - 1] += c;
                }
            }
            if (row.length > 1 || row[0] !== '') lines.push(row);

            // Convert to structured questions
            // Expected headers: question, A, B, C, D, answer, explanation
            if (lines.length < 2) return [];
            
            const headers = lines[0].map(h => h.trim().toLowerCase());
            const qIdx = headers.indexOf('question');
            const aIdx = headers.indexOf('a');
            const bIdx = headers.indexOf('b');
            const cIdx = headers.indexOf('c');
            const dIdx = headers.indexOf('d');
            const ansIdx = headers.indexOf('answer');
            const expIdx = headers.indexOf('explanation');

            if (qIdx === -1 || aIdx === -1 || bIdx === -1 || cIdx === -1 || dIdx === -1 || ansIdx === -1) {
                alert("CSV configuration missing required columns: question, A, B, C, D, answer");
                return [];
            }

            const questions = [];
            for (let i = 1; i < lines.length; i++) {
                const r = lines[i];
                if (r.length < 6 || !r[qIdx]) continue; // skip shallow rows

                let rawAns = r[ansIdx].trim().toUpperCase();
                let ansNum = 0;
                if (rawAns === 'A' || rawAns === '1') ansNum = 0;
                else if (rawAns === 'B' || rawAns === '2') ansNum = 1;
                else if (rawAns === 'C' || rawAns === '3') ansNum = 2;
                else if (rawAns === 'D' || rawAns === '4') ansNum = 3;
                else {
                    let parsedInt = parseInt(rawAns);
                    if (!isNaN(parsedInt) && parsedInt >= 1 && parsedInt <= 4) ansNum = parsedInt - 1;
                    else continue; // Invalid answer mapping, skip row safely
                }

                questions.push({
                    question: r[qIdx],
                    options: [
                        "A. " + (r[aIdx] || ""),
                        "B. " + (r[bIdx] || ""),
                        "C. " + (r[cIdx] || ""),
                        "D. " + (r[dIdx] || "")
                    ],
                    ans: ansNum,
                    explanation: expIdx !== -1 ? (r[expIdx] || "") : ""
                });
            }
            return questions;
        }

        function toggleSoloMode() {
            gameMode = document.getElementById('game-mode-select').value;
            if (gameMode === 'solo') {
                document.getElementById('solo-config').style.display = 'block';
                document.getElementById('team-config').style.display = 'none';
            } else {
                document.getElementById('solo-config').style.display = 'none';
                document.getElementById('team-config').style.display = 'block';
                generateTeamFields();
            }
        }

        function toggleEndOptions() {
            endMode = document.getElementById('end-mode').value;
            if (endMode === 'score') {
                document.getElementById('target-score-group').style.display = 'block';
                document.getElementById('time-limit-group').style.display = 'none';
            } else {
                document.getElementById('target-score-group').style.display = 'none';
                document.getElementById('time-limit-group').style.display = 'block';
            }
        }

        function generateTeamFields() {
            const count = parseInt(document.getElementById('team-count').value);
            const container = document.getElementById('team-names-inputs');
            container.innerHTML = '';
            for (let i = 1; i <= count; i++) {
                container.innerHTML += `
                    <div class="form-group">
                        <label>TEAM ${i} NAME</label>
                        <input type="text" id="team-name-${i}" value="TEAM ${i}">
                    </div>
                `;
            }
        }

        function playSound(id) {
            if (isMuted) return;
            const sound = document.getElementById(id);
            if (sound) {
                sound.currentTime = 0;
                sound.play().catch(e => console.log("Audio playing prevented"));
            }
        }

        function startBackgroundMusic() {
            if (isMuted) return;
            const music = document.getElementById('bg-music');
            if (music) {
                music.play().catch(e => console.log("Music play blocked by browser. Interaction required."));
            }
        }

        function stopBackgroundMusic() {
            const music = document.getElementById('bg-music');
            if (music) music.pause();
        }

        function toggleMute() {
            isMuted = !isMuted;
            const music = document.getElementById('bg-music');
            if (music) {
                if (isMuted) music.pause();
                else if (document.getElementById('game-screen').classList.contains('active') && !isPaused) music.play().catch(e => {});
            }
        }

        function startGame() {
            const activeQuestions = customQuestions.length > 0 ? customQuestions : defaultQuestions;
            
            // Setup Teams Structure
            teams = [];
            if (gameMode === 'solo') {
                const sClass = document.getElementById('solo-class').value.trim() || "Mixed";
                const sName = document.getElementById('solo-name').value.trim() || "Player 1";
                window.currentSoloPlayer = { class: sClass, name: sName };
                teams.push({ id: 'solo', name: `[${sClass}] ${sName}`, score: 0, pool: [...activeQuestions] });
            } else {
                window.currentSoloPlayer = null;
                const count = parseInt(document.getElementById('team-count').value);
                for (let i = 1; i <= count; i++) {
                    const name = document.getElementById(`team-name-${i}`).value.trim() || `TEAM ${i}`;
                    teams.push({ id: `team-${i}`, name: name, score: 0, pool: [...activeQuestions] });
                }
            }

            // Shuffle pools safely
            teams.forEach(t => shuffleArray(t.pool));

            // Set configuration targets
            endMode = document.getElementById('end-mode').value;
            if (endMode === 'score') {
                targetScore = parseInt(document.getElementById('target-score').value) || 10;
                document.getElementById('timer-display').style.display = 'none';
                document.getElementById('pause-btn').style.display = 'none';
            } else {
                const minutes = parseFloat(document.getElementById('time-limit').value) || 3;
                window.gameMinutes = minutes; 
                document.getElementById('timer-display').style.display = 'block';
                document.getElementById('pause-btn').style.display = 'inline-block';
                gameEndTime = Date.now() + (minutes * 60 * 1000);
                startTimer();
            }

            currentTeamTurn = 0;
            isPaused = false;
            pausedRemainingTime = 0;

            // Render Layout UI
            renderGameLayout();

            // Toggle screens
            document.getElementById('menu-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');

            startBackgroundMusic();
            nextTurn();
        }

        function startTimer() {
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(() => {
                // 改用 Math.max 確保不會算出負數
                const remaining = Math.max(0, Math.ceil((gameEndTime - Date.now()) / 1000));
                
                const min = Math.floor(remaining / 60);
                const sec = remaining % 60;
                
                // 先更新畫面，確保最後一秒畫面會準確刷新成 TIME: 0:00
                document.getElementById('timer-display').textContent = `TIME: ${min}:${sec < 10 ? '0'+sec : sec}`;

                if (remaining <= 0) { 
                    clearInterval(gameInterval);
                    
                    // 核心修正：時間一到，第一時間強制停用畫面上所有的答案按鈕，防止被點擊作答
                    disableAllAnswerButtons(true);
                    
                    // 延遲 50 毫秒再跳出 alert，讓瀏覽器有時間渲染 0:00 畫面與按鈕變灰的狀態
                    setTimeout(() => {
                        alert("⏰ Time's Up!");
                        endGame('time'); 
                    }, 50);
                    return;
                }
            }, 1000);
        }

        // 輔助函式：用來將所有答題按鈕鎖定或解鎖
        function disableAllAnswerButtons(disable) {
            const optionButtons = document.querySelectorAll('.option-btn');
            optionButtons.forEach(btn => {
                btn.disabled = disable;
            });
        }

        function togglePause() {
            if (endMode !== 'time') return;
            const pauseBtn = document.getElementById('pause-btn');
            if (!isPaused) {
                isPaused = true;
                clearInterval(gameInterval);
                pausedRemainingTime = gameEndTime - Date.now();
                pauseBtn.innerHTML = '▶️ RESUME';
                stopBackgroundMusic();
                disableAllAnswerButtons(true);
            } else {
                isPaused = false;
                gameEndTime = Date.now() + pausedRemainingTime;
                startTimer();
                pauseBtn.innerHTML = '⏸️ PAUSE';
                startBackgroundMusic();
                disableAllAnswerButtons(false);
            }
        }

        function renderGameLayout() {
            const container = document.getElementById('teams-container');
            container.innerHTML = '';
            
            teams.forEach((team, index) => {
                container.innerHTML += `
                    <div id="box-${team.id}" class="team-box">
                        <div class="team-name">${team.name}</div>
                        <div id="score-${team.id}" class="team-score">0 / ${endMode==='score'?targetScore:'∞'} PTS</div>
                        <div id="q-zone-${team.id}">
                            <div class="question-box" id="question-${team.id}">LOADING...</div>
                            <div class="options-grid" id="options-${team.id}"></div>
                        </div>
                    </div>
                `;
            });
        }

        function nextTurn() {
            if (isPaused) return;

            // In multi-mode, update highlights. In solo, keep highlighted.
            teams.forEach((t, i) => {
                const element = document.getElementById(`box-${t.id}`);
                if (element) {
                    if (gameMode === 'solo' || i === currentTeamTurn) {
                        element.classList.add('active-turn');
                        document.getElementById(`q-zone-${t.id}`).style.opacity = "1";
                        document.getElementById(`q-zone-${t.id}`).style.pointerEvents = "auto";
                    } else {
                        element.classList.remove('active-turn');
                        document.getElementById(`q-zone-${t.id}`).style.opacity = "0.2";
                        document.getElementById(`q-zone-${t.id}`).style.pointerEvents = "none";
                    }
                }
            });

            // Populate question for current team (or all teams in solo)
            if (gameMode === 'solo') {
                serveQuestion(0);
            } else {
                serveQuestion(currentTeamTurn);
            }
        }

        function serveQuestion(teamIndex) {
            const team = teams[teamIndex];
            
            // Cycle question pool safely if depleted
            if (team.pool.length === 0) {
                const srcQuestions = customQuestions.length > 0 ? customQuestions : defaultQuestions;
                team.pool = [...srcQuestions];
                shuffleArray(team.pool);
            }

            const activeQ = team.pool.pop();
            currentQuestions[teamIndex] = activeQ;

            // Update DOM Elements safely
            document.getElementById(`question-${team.id}`).textContent = activeQ.question;
            const optGrid = document.getElementById(`options-${team.id}`);
            optGrid.innerHTML = '';

            const prefix = ['A', 'B', 'C', 'D'];
            activeQ.options.forEach((opt, oIdx) => {
                // Strips existing prefix inside strings if present to safely format cleanly
                const cleaner = opt.replace(/^[A-Da-d]\.\s*/, '');
                optGrid.innerHTML += `
                    <button class="option-btn" onclick="handleAnswer('${team.id}', ${oIdx}, ${teamIndex})">
                        <span class="option-prefix">${prefix[oIdx]}.</span> ${cleaner}
                    </button>
                `;
            });
        }

        function handleAnswer(teamId, selectedIndex, teamIndex) {
            // 防禦性檢查：如果是時間制且時間已經過期，或者是暫停狀態，點擊無效
            if (endMode === 'time' && (isPaused || (gameEndTime && Date.now() >= gameEndTime))) return;

            const q = currentQuestions[teamIndex];
            const isCorrect = selectedIndex === q.ans;
            const team = teams[teamIndex];

            // Lock inputs globally to avoid multi-clicks during overlay display phases
            disableAllAnswerButtons(true);

            const overlay = document.getElementById('feedback-overlay');
            const txt = document.getElementById('feedback-text');
            const exp = document.getElementById('explanation-text');
            const nextBtn = document.getElementById('next-btn');

            if (isCorrect) {
                playSound('sound-correct');
                txt.textContent = "🎯 CORRECT!";
                txt.className = "feedback-content correct";
                team.score++;
                document.getElementById(`score-${team.id}`).textContent = `${team.score} / ${endMode==='score'?targetScore:'∞'} PTS`;
            } else {
                playSound('sound-wrong');
                txt.textContent = `❌ WRONG!\nCorrect answer is: ${['A','B','C','D'][q.ans]}`;
                txt.className = "feedback-content wrong";
            }

            exp.textContent = q.explanation || "No further explanation provided.";
            overlay.style.display = 'flex';

            // Check instantly if target score achieved in target score tracking configurations
            if (endMode === 'score' && team.score >= targetScore) {
                nextBtn.onclick = function() {
                    overlay.style.display = 'none';
                    endGame('score');
                };
                return;
            }

            // Normal progression configuration handling routines
            nextBtn.onclick = function() {
                overlay.style.display = 'none';
                disableAllAnswerButtons(false);

                // Check time bound again dynamically before stepping turn positions ahead
                if (endMode === 'time' && Date.now() >= gameEndTime) {
                    return; 
                }

                if (gameMode === 'multi') {
                    currentTeamTurn = (currentTeamTurn + 1) % teams.length;
                }
                nextTurn();
            };
        }

        function endGame(endModeTriggered = 'score') {
            clearInterval(gameInterval);
            stopBackgroundMusic();
            disableAllAnswerButtons(true);

            // Determine Winner names strings
            let reportTitle = "GAME OVER!\n\n";
            if (gameMode === 'solo') {
                reportTitle += `Final Score: ${teams[0].score} points.`;
            } else {
                let max = -1;
                let winners = [];
                teams.forEach(t => {
                    if (t.score > max) { max = t.score; winners = [t.name]; }
                    else if (t.score === max) { winners.push(t.name); }
                });
                reportTitle += `👑 WINNER: ${winners.join(' & ')} with ${max} points!\n\n`;
                
                // Complete scoreboard logs summary appendations
                teams.forEach(t => {
                    reportTitle += `${t.name}: ${t.score} pts\n`;
                });
            }

            alert(reportTitle);

            // SOLO Cloud Sheet Sync Engine integration pipelines
            const wasSolo = !!window.currentSoloPlayer;
            const finalScore = (teams.length > 0) ? teams[0].score : 0;

            if (wasSolo && window.currentSoloPlayer) {
                const player = window.currentSoloPlayer;
                const confirmSave = confirm(
                    `Solo Mode 結束！\n\n班級：${player.class}\n姓名：${player.name}\n分數：${finalScore} 分\n\n是否要將成績儲存到 Google Sheet 雲端？`
                );
                if (confirmSave) {
                    const recordData = {
                        date: new Date().toLocaleDateString('zh-HK'),
                        time: new Date().toLocaleTimeString('zh-HK'),
                        class: player.class,
                        name: player.name,
                        subject: currentSubject,
                        level: currentLevel,
                        score: finalScore,
                        endMode: endModeTriggered,
                        targetOrTime: endModeTriggered === 'score' ? targetScore : (window.gameMinutes || 10)
                    };
                    saveSoloResultToGoogleSheet(recordData);
                }
            }

            quitGame();
        }

        function saveSoloResultToGoogleSheet(data) {
            // Safe cross-domain async delivery engine using standard image beaconing patterns 
            // to bypass strict CORS blocking limitations effectively
            const queryParams = new URLSearchParams(data).toString();
            const targetUrl = `${GOOGLE_SCRIPT_URL}?${queryParams}`;
            
            console.log("Saving metrics packet directly to cloud endpoint layer:", data);
            
            const beacon = new Image();
            beacon.src = targetUrl;
            beacon.onload = () => alert("🎉 成績已成功同步上傳到雲端系統！");
            beacon.onerror = () => {
                // Apps script actions often report false status updates to pure images due to redirects 
                // but usually complete execution inside tracking sheets regardless
                alert("成績備份要求已發送！(請確認雲端試算表更新)");
            };
        }

        function quitGame() {
            clearInterval(gameInterval);
            stopBackgroundMusic();
            isPaused = false;
            pausedRemainingTime = 0;
            const pauseBtn = document.getElementById('pause-btn');
            if (pauseBtn) { pauseBtn.style.display = 'none'; pauseBtn.innerHTML = '⏸️ PAUSE'; }
            
            document.getElementById('game-screen').classList.remove('active');
            document.getElementById('menu-screen').classList.add('active');
            
            // Clean dynamic parameters
            document.getElementById('csv-upload').value = '';
            document.getElementById('file-status').textContent = customQuestions.length > 0 ? `✅ LOADED ${customQuestions.length} CUSTOM QUESTIONS` : "NO FILE LOADED";
            document.getElementById('timer-display').style.display = 'none';
            window.currentSoloPlayer = null;
        }

        // Shared Standard Fisher-Yates array shuffling algorithms implementation logic
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // Global Event Hotkeys Bindings (A, B, C, D Mapping actions)
        document.addEventListener('keydown', e => {
            if (!document.getElementById('game-screen').classList.contains('active') || isPaused) return;
            const key = e.key.toUpperCase();
            if (!['A','B','C','D'].includes(key)) return;
            const idx = key.charCodeAt(0) - 65;
            
            // Target active game box context
            teams.forEach((team, teamIdx) => {
                if (gameMode === 'multi' && teamIdx !== currentTeamTurn) return; // ignore inactive team fields hotkeys
                
                const opts = document.getElementById(`options-${team.id}`);
                if (opts) {
                    const btns = opts.querySelectorAll('.option-btn');
                    // Verify if first button is not disabled to safeguard system click actions logic bounds
                    if (btns[0] && !btns[0].disabled) {
                        if (btns[idx]) btns[idx].click();
                    }
                }
            });
        });

        window.onload = () => {
            toggleEndOptions();
            toggleSoloMode();
        };
        
        // Anti-Right-Click Interface Lockdown Protections
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });
    </script>
</body>
</html>
