<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>學科成績排行榜 🏆</title>
  <style>
    :root {
      --primary: #4a90e2;
      --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --card-bg: rgba(255,255,255,0.12);
      --card-border: rgba(255,255,255,0.18);
      --text-light: #f0f4ff;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body {
      font-family:'Segoe UI',system-ui,sans-serif;
      background:var(--bg-gradient);
      color:var(--text-light);
      min-height:100vh;
      padding:15px 10px;
      font-size: 115%;
    }
    .container{max-width:1920px;margin:0 auto}
  
    header {
      text-align:center;
      padding:20px 0 25px;
      backdrop-filter:blur(10px);
      margin-bottom:20px;
      border-bottom:1px solid rgba(255,255,255,0.2);
    }
    h1 {
      font-size:2.8rem;
      font-weight:800;
      letter-spacing:2px;
      text-shadow:0 2px 10px rgba(0,0,0,0.3);
      margin-bottom:8px;
    }
    .subtitle { font-size:1.1rem; color:rgba(255,255,255,0.8); }
    
    .grid {
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:25px;
      padding:0 20px;
    }
    .panel {
      background:var(--card-bg);
      border:1px solid var(--card-border);
      border-radius:20px;
      padding:20px;
      box-shadow:0 8px 32px rgba(0,0,0,0.15);
      backdrop-filter:blur(8px);
      display:flex;
      flex-direction:column;
      min-height:480px;
    }
    .panel-header {
      text-align:center;
      font-size:1.8rem;
      font-weight:bold;
      padding-bottom:15px;
      margin-bottom:15px;
      border-bottom:2px solid rgba(255,255,255,0.1);
      color:#fff;
      text-shadow:0 2px 4px rgba(0,0,0,0.2);
    }
    
    .table-container { flex-grow:1; overflow:hidden; position:relative; }
    .slide-container {
      position:absolute; width:100%;
      animation:fadeIn 0.5s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    table { width:100%; border-collapse:collapse; table-layout:fixed; }
    th {
      color:rgba(255,255,255,0.7);
      font-size:1rem;
      font-weight:600;
      padding:12px 8px;
      border-bottom:2px solid rgba(255,255,255,0.1);
    }
    td {
      padding:14px 8px;
      text-align:center;
      border-bottom:1px solid rgba(255,255,255,0.05);
      font-size:1.15rem;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    tr:last-child td { border-bottom:none; }
    
    .rank-col { width:15%; font-weight:bold; }
    .class-col { width:22%; }
    .name-col { width:38%; text-align:left; padding-left:15px; }
    .score-col { width:25%; font-weight:bold; color:#4facfe; font-family:monospace; font-size:1.3rem; }
    
    .rank-1 td { background:rgba(255,215,0,0.15); color:#ffd700; }
    .rank-2 td { background:rgba(192,192,192,0.15); color:#e0e0e0; }
    .rank-3 td { background:rgba(205,127,50,0.15); color:#ffaa66; }
    .rank-1 .score-col { color:#ffd700; }
    .rank-2 .score-col { color:#e0e0e0; }
    .rank-3 .score-col { color:#ffaa66; }
    
    .empty-state { text-align:center; padding:30px; color:rgba(255,255,255,0.5); font-size:1.1rem; }
  </style>
</head>
<body>

  <header>
    <h1 id="main-title">讀取資料中...</h1>
    <div class="subtitle" id="lastUpdate">連線至雲端系統中...</div>
  </header>

  <main class="container">
    <div class="grid" id="gridPanels">
      </div>
  </main>

  <script>
    // ⚠️ 請填寫您的 Google Apps Script Web App URL
    const API_URL = 'https://script.google.com/macros/s/AKfycbxqgywi-q3jfo3ENHdWkQMn0KJHTtaXISaIDqq3AQJiolRn9jge_gvCH-UkHGCFTboz/exec';
    
    const LEVELS = ['P.1', 'P.2', 'P.3', 'P.4', 'P.5', 'P.6']; // 固定的6個年級面板
    let allData = [];
    let subjects = [];
    let currentSubjIndex = 0;

    // 1. 建立 P.1 ~ P.6 的固定面板
    function createPanels() {
      const grid = document.getElementById('gridPanels');
      grid.innerHTML = '';
      LEVELS.forEach(level => {
        grid.innerHTML += `
          <div class="panel">
            <div class="panel-header">${level}</div>
            <div class="table-container" id="container-${level.replace('.', '')}">
              </div>
          </div>
        `;
      });
    }

    // 2. 獲取資料
    async function fetchData() {
      try {
        const response = await fetch(API_URL);
        const data = await response.json();
        
        // 過濾掉沒有科目或年級的無效資料
        allData = data.filter(d => d.subject && d.level);
        
        // 取得所有唯一的科目名 (例如: Maths, English, Chinese)
        subjects = [...new Set(allData.map(d => d.subject.trim()))];
        
        if (subjects.length > 0) {
          renderCurrentSubject(); // 立即渲染第一次
        } else {
          document.getElementById('main-title').textContent = '目前無成績記錄';
        }
        
        document.getElementById('lastUpdate').textContent = `最後更新：${new Date().toLocaleTimeString()} (每15秒切換科目)`;
      } catch (err) {
        document.getElementById('main-title').textContent = '⚠️ 資料載入失敗';
        document.getElementById('lastUpdate').textContent = err.message;
      }
    }

    // 3. 渲染當前科目的 P.1 ~ P.6
    function renderCurrentSubject() {
      if (subjects.length === 0) return;
      
      const currentSubject = subjects[currentSubjIndex % subjects.length];
      
      // 更新大標題，並加上淡入動畫效果
      const titleEl = document.getElementById('main-title');
      titleEl.style.animation = 'none';
      titleEl.offsetHeight; // 觸發重繪 (Reflow)
      titleEl.style.animation = 'fadeIn 0.5s ease-out forwards';
      titleEl.textContent = `${currentSubject} 榮譽榜 🏆`;

      // 遍歷 P.1 到 P.6 更新各面板
      LEVELS.forEach(level => {
        const container = document.getElementById(`container-${level.replace('.', '')}`);
        
        // 正規化字串，確保 P.1 和 P1 都能匹配
        const norm = str => String(str || '').replace(/\s|\./g, '').toUpperCase();
        
        // 篩選：同科目、同年級，並依分數排序，取前 10 名
        let filtered = allData.filter(d => 
          norm(d.subject) === norm(currentSubject) && 
          norm(d.level) === norm(level)
        );
        
        filtered.sort((a, b) => (parseFloat(b.score) || 0) - (parseFloat(a.score) || 0));
        const top10 = filtered.slice(0, 10);

        // 建立 HTML
        let html = '';
        if (top10.length === 0) {
          html = `<div class="empty-state">尚無資料</div>`;
        } else {
          html = `
            <div class="slide-container">
              <table>
                <thead><tr><th class="rank-col">排名</th><th class="class-col">班級</th><th class="name-col">姓名</th><th class="score-col">分數</th></tr></thead>
                <tbody>
                  ${top10.map((row, i) => {
                    const rankClass = i < 3 ? `rank-${i + 1}` : '';
                    // 名字超過 8 字截斷
                    const displayName = (row.name && row.name.length > 8) ? row.name.substring(0, 8) + '...' : (row.name || '—');
                    return `
                      <tr class="${rankClass}">
                        <td class="rank-col">${i + 1}</td>
                        <td class="class-col">${row.class || '—'}</td>
                        <td class="name-col">${displayName}</td>
                        <td class="score-col">${row.score || 0}</td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          `;
        }
        
        // 替換內容 (會自動觸發 CSS fadeIn 動畫)
        container.innerHTML = html;
      });

      // 準備下一次輪替
      currentSubjIndex++;
    }

    // 初始化與計時器
    createPanels();
    fetchData(); // 初始抓取
    
    // 每 15 秒切換一次顯示科目
    setInterval(renderCurrentSubject, 15000); 
    
    // 每 1 分鐘重新從 Google 抓取最新雲端數據
    setInterval(fetchData, 60000);
  </script>
</body>
</html>
