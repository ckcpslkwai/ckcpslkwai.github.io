<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CKCPS WARS V2607091514</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
      
        :root {
            --primary: #00f9ff;
            --secondary: #ff00aa;
            --accent: #39ff14;
        }
      
        body {
            margin: 0; padding: 0;
            font-family: 'Press Start 2P', system-ui;
            background: linear-gradient(180deg, #0a0a1f 0%, #05050f 100%);
            color: #fff;
            text-align: center;
            user-select: none;
        }
      
        header { background: #0a0a1f; padding: 12px; border-bottom: 3px solid var(--primary); }
      
        h1 { margin: 0; font-size: clamp(20px, 5vw, 30px); text-shadow: 0 0 10px var(--primary); }
      
        .container { max-width: 100%; margin: 0 auto; padding: 15px; box-sizing: border-box; }
      
        .screen { display: none; }
        .screen.active { display: block; }
      
        button {
            font-family: 'Press Start 2P', system-ui;
            padding: 14px 28px; margin: 8px;
            background: #12122e; color: #fff;
            border: 3px solid var(--primary);
            cursor: pointer; transition: all 0.2s;
            box-shadow: 0 0 12px rgba(0, 249, 255, 0.4);
            font-size: 15px; box-sizing: border-box;
        }
        button:hover { background: var(--primary); color: #000; transform: scale(1.03); }
        button:disabled { background: #334155 !important; color: #94a3b8 !important; border-color: #475569 !important; box-shadow: none !important; cursor: not-allowed; }
      
        .section {
            background: #12122e; padding: 20px 18px; margin: 12px 0;
            border-radius: 10px; border: 2px solid var(--primary); box-sizing: border-box;
        }

        #menu-screen .section { max-width: 860px; margin-left: auto; margin-right: auto; }
      
        select, input {
            font-family: 'Press Start 2P', system-ui;
            padding: 10px 12px; background: #0a0a1f; color: #fff;
            border: 2px solid var(--accent); margin: 4px 0; font-size: 14px;
            width: 100%; box-sizing: border-box;
        }

        .question {
            background: #0a0a1f; padding: 16px; border-radius: 8px;
            margin: 10px 0; min-height: 85px; display: flex;
            align-items: center; justify-content: center;
            font-size: 17px; line-height: 1.55; text-align: left;
            border: 2px solid var(--primary); box-sizing: border-box; word-break: break-word;
        }
      
        .option-btn {
            padding: 12px 14px; font-size: clamp(13px, 2vw, 15px);
            border: 2px solid #334155; background: #12122e;
            text-align: left; margin: 5px 0; width: 100%; box-sizing: border-box;
        }

        /* 螢光強調正確答案樣式 */
        .correct-answer-highlight {
            background-color: #39ff14 !important;
            color: #000 !important;
            border-color: #fff !important;
            box-shadow: 0 0 15px #39ff14 !important;
            transform: scale(1.02);
        }

        .leaderboard { background: #12122e; padding: 16px; border-radius: 10px; border: 2px solid var(--secondary); margin-bottom: 20px; }
       
        .team-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
      
        .team-card {
            background: #12122e; border: 4px solid #334155; border-radius: 10px;
            padding: 14px; min-height: 420px; display: flex; flex-direction: column;
        }
       
        .progress-bar { height: 8px; background: linear-gradient(90deg, var(--accent), var(--primary)); margin: 8px 0; border-radius: 4px; transition: width 0.3s; }
       
        .compact-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); max-width: 860px; margin: 0 auto; }

        .game-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 10px; }

        @media (max-width: 600px) {
            .game-controls { flex-direction: column; }
            .solo-leaderboard-grid { grid-template-columns: 1fr; }
            .team-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header>
        <h1>🏴‍☠️ CKCPS WARS 🏴‍☠️</h1>
    </header>
    <div class="container">
        
        <div id="login-screen" class="screen active">
            <div class="section" style="max-width: 400px; margin: 40px auto; border-color: #facc15; padding: 30px;">
                <h2>PLAYER LOGIN</h2>
                <input type="text" id="login-class" placeholder="Class (e.g. 3A)">
                <input type="text" id="login-num" placeholder="Number (e.g. 15)">
                <input type="password" id="login-pwd" placeholder="Password">
                <button onclick="attemptLogin()" style="width: 100%; margin-top: 20px; border-color: #facc15;">LOGIN</button>
            </div>
        </div>

        <div id="menu-screen" class="screen">
            <div class="compact-grid">
                <div class="section">
                    <label>NUMBER OF TEAMS</label>
                    <select id="num-teams" onchange="toggleSoloMode()">
                        <option value="solo">🧑 SOLO</option>
                        <option value="2">2 Teams</option>
                        <option value="3">3 Teams</option>
                    </select>
                </div>
                <div class="section">
                    <label>SUBJECT</label>
                    <select id="subject">
                        <option value="Chinese">Chinese</option>
                        <option value="Maths">Maths</option>
                    </select>
                </div>
            </div>
            <button onclick="startGame()" style="width: 100%; max-width: 300px; border-color: var(--accent);">START GAME</button>
        </div>

        <div id="game-screen" class="screen">
            <div class="game-controls">
                <strong id="game-info"></strong>
                <button id="pause-btn" onclick="togglePause()">⏸️ PAUSE</button>
            </div>
            <div class="leaderboard"><div id="leaderboard"></div></div>
            <div id="team-grid" class="team-grid"></div>
        </div>
    </div>

    <script>
        let customQuestions = [], teams = [], currentQuestions = [], pendingResultTimeouts = {};
        let endMode = 'score', targetScore = 300;

        async function attemptLogin() {
            // ... (您的原有登入邏輯保持不變)
            document.getElementById('login-screen').classList.remove('active');
            document.getElementById('menu-screen').classList.add('active');
        }

        // --- 核心邏輯：handleAnswer 優化版 ---
        function handleAnswer(teamId, selectedIndex, teamIndex) {
            const q = currentQuestions[teamIndex];
            const isCorrect = selectedIndex === q.ans;
            const statusEl = document.getElementById(`status-${teamId}`);
            const buttons = document.querySelectorAll(`#options-${teamId} .option-btn`);
           
            // 鎖定所有按鈕防止重複點擊
            buttons.forEach(btn => btn.disabled = true);
            
            // 標示玩家點擊的按鈕顏色
            buttons[selectedIndex].style.borderColor = isCorrect ? '#39ff14' : '#ff00aa';

            if (isCorrect) {
                // 正確處理
                const ptsToAdd = 10 * (teams[teamIndex].multiplier || 1);
                teams[teamIndex].multiplier = 1; 
                teams[teamIndex].score += ptsToAdd;
                
                statusEl.innerHTML = `<span style="color:#39ff14">✅ CORRECT! +${ptsToAdd}</span>`;
                document.getElementById(`score-${teamId}`).textContent = teams[teamIndex].score;
                
                // 更新進度條
                const progress = Math.min((teams[teamIndex].score / targetScore) * 100, 100);
                document.getElementById(`progress-${teamId}`).style.width = `${progress}%`;

                // 正常延遲後進入下一題
                pendingResultTimeouts[teamId] = setTimeout(() => {
                    currentQuestions[teamIndex] = getRandomQuestion();
                    renderTeamQuestion(teamId, teamIndex);
                    delete pendingResultTimeouts[teamId];
                }, 1000);

            } else {
                // 錯誤處理 (螢光強調正確答案 + 3秒懲罰)
                statusEl.innerHTML = `<span style="color:#ff00aa; font-weight:bold;">❌ Wrong! 3s Penalty!</span>`;

                // 螢光強調正確答案
                buttons[q.ans].classList.add('correct-answer-highlight');

                // 懲罰等待 3000ms
                pendingResultTimeouts[teamId] = setTimeout(() => {
                    // 移除強調樣式並進入下一題
                    buttons[q.ans].classList.remove('correct-answer-highlight');
                    currentQuestions[teamIndex] = getRandomQuestion();
                    renderTeamQuestion(teamId, teamIndex);
                    delete pendingResultTimeouts[teamId];
                }, 3000); 
            }

            if (!window.currentSoloPlayer) updateLeaderboard();
        }

        // --- 其他輔助函數維持您的設定即可 (省略部分以節省篇幅) ---
        function startGame() {
            // ... (請保持您原本的 startGame 邏輯)
            document.getElementById('menu-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
        }
        
        function renderTeamQuestion(teamId, teamIndex) {
            const qEl = document.getElementById(`qtext-${teamId}`);
            const optsDiv = document.getElementById(`options-${teamId}`);
            const qData = currentQuestions[teamIndex];
            
            qEl.innerHTML = qData.q;
            optsDiv.innerHTML = '';
            qData.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = `${String.fromCharCode(65+i)}. ${opt}`;
                btn.onclick = () => handleAnswer(teamId, i, teamIndex);
                optsDiv.appendChild(btn);
            });
        }
        
        // 其他函數 (renderAllTeams, togglePause, 等) 保持您原本的設定即可
    </script>
</body>
</html>
