<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CKCPS WARS - Mr.Lee EDITION</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
      
        :root {
            --primary: #00f9ff;
            --secondary: #ff00aa;
            --accent: #39ff14;
        }
      
        body {
            margin: 0; padding: 0;
            font-family: 'Press Start 2P', system-ui;
            background: linear-gradient(180deg, #0a0a1f 0%, #05050f 100%);
            color: #fff;
            text-align: center;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
      
        header {
            background: #0a0a1f;
            padding: 12px;
            border-bottom: 3px solid var(--primary);
        }
      
        h1 {
            margin: 0;
            font-size: clamp(22px, 5vw, 30px);
            text-shadow: 0 0 10px var(--primary);
        }
      
        .container {
            max-width: 100%;
            margin: 0 auto;
            padding: 15px;
        }
      
        .screen { display: none; }
        .screen.active { display: block; }
      
        button {
            font-family: 'Press Start 2P', system-ui;
            padding: 14px 28px; margin: 8px;
            background: #12122e;
            color: #fff;
            border: 3px solid var(--primary);
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 0 12px rgba(0, 249, 255, 0.4);
            font-size: 15px;
        }
        button:hover {
            background: var(--primary);
            color: #000;
            transform: scale(1.03);
        }
        button:disabled {
            background: #334155 !important;
            color: #94a3b8 !important;
            border-color: #475569 !important;
            box-shadow: none !important;
            transform: none !important;
            cursor: not-allowed;
        }
      
        .section {
            background: #12122e;
            padding: 20px 18px;
            margin: 12px 0;
            border-radius: 10px;
            border: 2px solid var(--primary);
        }

        #menu-screen .section {
            max-width: 860px;
            margin-left: auto;
            margin-right: auto;
        }
      
        select, input[type="number"], input[type="text"], input[type="password"] {
            font-family: 'Press Start 2P', system-ui;
            padding: 10px 12px;
            background: #0a0a1f;
            color: #fff;
            border: 2px solid var(--accent);
            margin: 4px 0;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
        }

        #menu-screen .compact-grid select,
        #menu-screen .compact-grid input[type="number"] {
            width: 100% !important;
            max-width: none !important;
        }
      
        label {
            font-size: 13px;
            display: block;
            margin-bottom: 6px;
        }
      
        .score {
            font-size: 32px;
            color: var(--accent);
            text-shadow: 0 0 8px var(--accent);
        }
      
        .question {
            background: #0a0a1f;
            padding: 16px;
            border-radius: 8px;
            margin: 10px 0;
            min-height: 85px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px; 
            line-height: 1.55;
            text-align: left;
            border: 2px solid var(--primary);
            box-sizing: border-box;
        }
      
        .option-btn {
            padding: 12px 14px;
            font-size: clamp(13px, 2vw, 15px);
            border: 2px solid #334155;
            background: #12122e;
            text-align: left;
            margin: 5px 0;
            width: 100%;
            box-sizing: border-box;
        }
      
        .leaderboard {
            background: #12122e;
            padding: 16px;
            border-radius: 10px;
            border: 2px solid var(--secondary);
            margin-bottom: 20px;
        }
       
        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(0, 1fr));
            gap: 14px;
            width: 100%;
            padding-bottom: 12px;
        }
      
        .team-card {
            position: relative; 
            overflow: hidden;
            background: #12122e;
            border: 4px solid #334155;
            border-radius: 10px;
            padding: 14px;
            min-height: 420px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }
       
        .team-header {
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
       
        .progress-container {
            width: 100%;
            background: #334155;
            border-radius: 4px;
        }

        .progress-bar {
            height: 8px;
            background: linear-gradient(90deg, var(--accent), var(--primary));
            margin: 8px 0;
            border-radius: 4px;
            transition: width 0.3s;
        }
       
        .options {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .status {
            min-height: 20px;
            margin-top: 8px;
            font-size: 14px;
        }
       
        .compact-grid {
            display: grid;
            gap: 12px;
            grid-template-columns: 278px 278px 278px;
            max-width: 860px;
            margin: 0 auto;
            justify-content: center;
        }

        .csv-buttons {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        .team-grid.solo-mode {
            max-width: 620px;
            margin: 0 auto;
            justify-content: center;
        }

        .team-grid.solo-mode .team-card {
            min-height: 400px;
            border-color: #39ff14;
        }
        
        .csv-buttons button {
            flex: 1;
        }

        .end-condition {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: flex-start;
        }
        .end-left, .end-right {
            flex: 1;
            min-width: 280px;
        }

        .freeze-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 10, 31, 0.85);
            backdrop-filter: blur(3px);
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: #00f9ff;
            text-align: center;
            text-shadow: 0 0 15px #00f9ff;
            line-height: 1.8;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <header>
        <h1>🏴‍☠️ CKCPS WARS 🏴‍☠️</h1>
        <p style="margin:4px 0 0 0; font-size:12px; color:#00f9ff;">CYBERPUNK NEON EDITION • P.1–P.6</p>
    </header>
    <div class="container">
        
        <div id="login-screen" class="screen active">
            <div class="section" style="max-width: 400px; margin: 40px auto; border-color: #facc15; padding: 30px 25px;">
                <h2 style="color: #facc15; margin-top: 0;">PLAYER LOGIN</h2>
                <p style="font-size: 11px; color: #94a3b8; margin-bottom: 25px;">請輸入班別、班號與密碼</p>

                <label style="color:#00f9ff; text-align: left;">Class 班別</label>
                <input type="text" id="login-class" placeholder="e.g. 3A">

                <label style="color:#00f9ff; text-align: left; margin-top: 15px;">Class Number 班號</label>
                <input type="text" id="login-num" placeholder="e.g. 15">

                <label style="color:#00f9ff; text-align: left; margin-top: 15px;">Password 密碼</label>
                <input type="password" id="login-pwd" placeholder="****">

                <button onclick="attemptLogin()" style="width: 100%; margin-top: 25px; font-size: 18px; border-color: #facc15; box-shadow: 0 0 15px #facc15;">
                    🔓 LOGIN
                </button>
            </div>
        </div>

        <div id="menu-screen" class="screen">
            <div class="compact-grid">
                <div class="section">
                    <label style="color:#00f9ff;">NUMBER OF TEAMS</label>
                    <select id="num-teams" onchange="toggleSoloMode()">
                        <option value="solo">🧑 SOLO (個人模式)</option>
                        <option value="2">2 Teams</option>
                        <option value="3">3 Teams</option>
                        <option value="4" selected>4 Teams</option>
                        <option value="5">5 Teams</option>
                        <option value="6">6 Teams</option>
                    </select>
                </div>
                <div class="section">
                    <label style="color:#00f9ff;">&nbsp;&nbsp;&nbsp;&nbsp;SUBJECT&nbsp;&nbsp;&nbsp;&nbsp;</label>
                    <select id="subject">
                        <option value="Chinese">Chinese中文</option>
                        <option value="English">English</option>
                        <option value="Maths">Maths數學</option>
                        <option value="Science">Science</option>
                        <option value="科學">科學</option>
                    </select>
                </div>
                <div class="section">
                    <label style="color:#00f9ff;">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;LEVEL&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</label>
                    <select id="level">
                        <option value="K" selected>K</option>
                        <option value="P1">P.1</option>
                        <option value="P2">P.2</option>
                        <option value="P3">P.3</option>
                        <option value="P4">P.4</option>
                        <option value="P5">P.5</option>
                        <option value="P6">P.6</option>
                    </select>
                </div>
            </div>

            <div id="solo-info" class="section" style="display:none; border-color:#39ff14;">
                <label style="color:#39ff14;">PLAYER INFORMATION 玩家資料</label>
                <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:8px;">
                    <div style="flex:1; min-width:130px;">
                        <label style="font-size:12px; color:#94a3b8;">Class</label>
                        <input type="text" id="solo-class" placeholder="e.g. 3A" style="width:80%; font-size:15px; padding:8px;">
                    </div>
                    <div style="flex:2; min-width:180px;">
                        <label style="font-size:12px; color:#94a3b8;">Name</label>
                        <input type="text" id="solo-name" placeholder="Full name please 請輸入全名" style="width:80%; font-size:15px; padding:8px;">
                    </div>
                </div>
            </div>

            <div class="section">
                <div class="end-condition">
                    <div class="end-left">
                        <label style="color:#ff00aa;">GAME END CONDITION</label>
                        <select id="end-mode" onchange="toggleEndOptions()" style="width:100%;">
                            <option value="score">First to Score</option>
                            <option value="time">Timed Game</option>
                        </select>
                    </div>
                    <div class="end-right">
                        <div id="score-options">
                            <label style="color:#ff00aa;">TARGET SCORE</label>
                            <input type="number" id="target-score" value="300" min="50" step="50" style="width:100%;">
                        </div>
                        <div id="time-options" style="display:none;">
                            <label style="color:#ff00aa;">DURATION (minutes)</label>
                            <input type="number" id="game-time" value="10" min="1" max="60" style="width:100%;">
                        </div>
                    </div>
                </div>
            </div>

            <div class="section">
                <label style="color:#00f9ff;">BACKGROUND MUSIC</label>
                <div style="display:flex; align-items:center; gap:12px; margin-top:8px; flex-wrap:wrap;">
                    <div style="flex:1; min-width:220px;">
                        <select id="music-track" style="width:100%; font-size:13px;">
                            <option value="">No music</option>
                            <option value="Haaland.mp3">Music 1</option>
                            <option value="Greensleeves.mp3">Music 2</option>
                            <option value="music3.mp3">Music 3</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="section">
                <label style="color:#39ff14;">QUESTION SOURCE</label>
                <div class="csv-buttons">
                    <button onclick="document.getElementById('csv-upload').click()">
                        📁 UPLOAD CSV 上載
                    </button>
                    <button onclick="loadDefaultCSV()" style="border-color:#39ff14;">
                        📋 Default 預設
                    </button>
                </div>
                <input type="file" id="csv-upload" accept=".csv" style="display:none;" onchange="handleCSVUpload(event)">
            </div>
           
            <button onclick="startGame()" style="font-size:22px; padding:20px 60px; margin-top:20px; border-color:#39ff14; box-shadow: 0 0 25px #39ff14;">
                🚀 START BATTLE!
            </button>
        </div>

        <div id="game-screen" class="screen">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:10px;">
                <strong id="game-info" style="color:#00f9ff; flex:1; text-align:left;"></strong>
                
                <div style="display:flex; align-items:center; gap:8px; justify-content:center; flex:1;">
                    <span id="timer-display" style="font-size:15px; background:#12122e; padding:6px 12px; border-radius:6px; border:2px solid #ff00aa; display:none;"></span>
                    <button id="pause-btn" onclick="togglePause()" style="padding:10px 20px; font-size:13px; border-color:#ff00aa;">⏸️ PAUSE</button>
                </div>
                
                <div style="flex:1; text-align:right;">
                    <button onclick="endGame()" style="padding:10px 20px; font-size:13px;">END GAME</button>
                </div>
            </div>
            
            <div class="leaderboard">
                <h3 style="color:#ff00aa;">🏆 LEADERBOARD 🏆</h3>
                <div id="leaderboard" style="text-align:left;"></div>
            </div>
            
            <div id="team-grid" class="team-grid"></div>
        </div>
    </div>

    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            alert("⚠️ 遊戲偵測到錯誤: \n" + message + "\n位於第 " + lineno + " 行\n請檢查程式碼。");
            return true;
        };

        let customQuestions = [];
        let currentSubject = '', currentLevel = '', teams = [], currentQuestions = [];
        let gameInterval = null, endMode = 'score', targetScore = 100, gameEndTime = null;
        let isPaused = false, pausedRemainingTime = 0, pendingResultTimeouts = {};

        const GOOGLE_SHEET_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbyMVPcda6_YBIBXmy7iZFQjbIilACiNGVTz1CwB3yMNy7Od3VS81AE8lbKkTjABmt5f/exec';

        // ==================== LOGIN SYSTEM ====================
        async function attemptLogin() {
            const cls = document.getElementById('login-class').value.trim();
            const num = document.getElementById('login-num').value.trim();
            const pwd = document.getElementById('login-pwd').value.trim();

            if (!cls || !num || !pwd) {
                alert("請填寫班別、班號與密碼！\n(Please fill in all fields)");
                return;
            }

            try {
                const response = await fetch('./password.csv');
                if (!response.ok) throw new Error('找不到 password.csv 檔案');
                
                // 去除可能存在的 BOM
                let text = await response.text();
                if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
                
                const lines = text.trim().split('\n');
                let isValid = false;

                // 從第 2 行開始比對 (略過標題 Class,Number,Password)
                for (let i = 1; i < lines.length; i++) {
                    if (!lines[i].trim()) continue;
                    let parts = lines[i].split(',').map(s => s.replace(/"/g, '').trim());
                    
                    if (parts.length >= 3) {
                        // 班別不分大小寫比對，密碼區分大小寫
                        if (parts[0].toLowerCase() === cls.toLowerCase() &&
                            parts[1] === num &&
                            parts[2] === pwd) {
                            isValid = true;
                            break;
                        }
                    }
                }

                if (isValid) {
                    alert("✅ 登入成功！");
                    document.getElementById('login-screen').classList.remove('active');
                    document.getElementById('menu-screen').classList.add('active');
                    
                    // 自動帶入資料到 Solo Mode，減輕輸入負擔
                    document.getElementById('solo-class').value = cls.toUpperCase();
                    document.getElementById('solo-name').value = `No.${num}`;
                } else {
                    alert("❌ 班別、班號或密碼錯誤！\n(Invalid credentials)");
                }
            } catch (err) {
                alert("⚠️ 無法載入驗證檔。\n請確保密碼表命名為 'password.csv' 且位於相同資料夾。\n" + err.message);
            }
        }
        // ======================================================

        async function saveSoloResultToGoogleSheet(playerData) {
            if (!GOOGLE_SHEET_WEBAPP_URL || GOOGLE_SHEET_WEBAPP_URL.includes('你的部署ID')) return false;
            try {
                const response = await fetch(GOOGLE_SHEET_WEBAPP_URL, {
                    method: 'POST', mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(playerData)
                });
                alert(`✅ 成績已成功儲存到雲端！\n\n班級：${playerData.class}\n姓名：${playerData.name}\n分數：${playerData.score}`);
                return true;
            } catch (error) {
                alert('❌ 儲存失敗，請檢查網絡或 URL 是否正確。');
                return false;
            }
        }

        let bgmAudio = null;
        let isMusicPlaying = false;

        function toggleEndOptions() {
            const mode = document.getElementById('end-mode').value;
            document.getElementById('score-options').style.display = mode === 'score' ? 'block' : 'none';
            document.getElementById('time-options').style.display = mode === 'time' ? 'block' : 'none';
        }

        function toggleSoloMode() {
            const numTeamsValue = document.getElementById('num-teams').value;
            const soloInfo = document.getElementById('solo-info');
            soloInfo.style.display = numTeamsValue === 'solo' ? 'block' : 'none';
        }

        function disableAllAnswerButtons(disabled) {
            const allButtons = document.querySelectorAll('#team-grid .option-btn');
            allButtons.forEach(btn => btn.disabled = disabled);
        }

        function togglePause() {
            const pauseBtn = document.getElementById('pause-btn');
            if (!pauseBtn) return;
            isPaused = !isPaused;

            if (isPaused) {
                if (gameInterval) { clearInterval(gameInterval); gameInterval = null; }
                if (endMode === 'time' && gameEndTime) pausedRemainingTime = gameEndTime - Date.now();
                disableAllAnswerButtons(true);
                Object.values(pendingResultTimeouts).forEach(id => clearTimeout(id));
                pendingResultTimeouts = {};
                pauseBackgroundMusic();
                pauseBtn.innerHTML = '▶️ RESUME';
                pauseBtn.style.borderColor = '#facc15';
                pauseBtn.style.boxShadow = '0 0 12px rgba(250, 204, 21, 0.5)';
            } else {
                if (endMode === 'time' && pausedRemainingTime > 0) {
                    gameEndTime = Date.now() + pausedRemainingTime;
                    startTimer();
                }
                disableAllAnswerButtons(false);
                resumeBackgroundMusic();
                
                teams.forEach((team, idx) => {
                    const statusEl = document.getElementById(`status-${team.id}`);
                    if (statusEl && (statusEl.innerHTML.includes('CORRECT') || statusEl.innerHTML.includes('Wrong'))) {
                        currentQuestions[idx] = getRandomQuestion();
                        renderTeamQuestion(team.id, idx);
                    }
                });

                pauseBtn.innerHTML = '⏸️ PAUSE';
                pauseBtn.style.borderColor = '#ff00aa';
                pauseBtn.style.boxShadow = '0 0 12px rgba(0, 249, 255, 0.4)';
            }
        }

        function playBackgroundMusic() {
            if (isMusicPlaying) return;
            const musicSelect = document.getElementById('music-track');
            const track = musicSelect ? musicSelect.value : '';
            if (!track) { isMusicPlaying = false; return; }
            stopBackgroundMusic();
            bgmAudio = new Audio(track);
            bgmAudio.loop = true;
            bgmAudio.volume = 0.6;
            bgmAudio.play().catch(() => console.log('%c[Music] 無法播放', 'color:#f59e0b'));
            isMusicPlaying = true;
        }

        function stopBackgroundMusic() {
            isMusicPlaying = false;
            if (bgmAudio) { bgmAudio.pause(); bgmAudio.currentTime = 0; bgmAudio = null; }
        }

        function pauseBackgroundMusic() { if (bgmAudio && !bgmAudio.paused) bgmAudio.pause(); }
        function resumeBackgroundMusic() { if (bgmAudio && bgmAudio.paused && isMusicPlaying) bgmAudio.play().catch(()=>{}); }

        async function loadDefaultCSV() {
            try {
                const response = await fetch('./default.csv');
                if (!response.ok) throw new Error('File not found');
                const csvText = await response.text();
                const allParsed = parseCSV(csvText);
                const selectedSubject = document.getElementById('subject').value;
                const selectedLevel = document.getElementById('level').value;
                customQuestions = filterQuestionsBySubjectLevel(allParsed, selectedSubject, selectedLevel);
                if (customQuestions.length === 0) customQuestions = allParsed;
                alert(`✅ 預設題庫已成功載入！\n(Default Set loaded!)\n共 ${customQuestions.length} 題匹配 ${selectedSubject} - ${selectedLevel}`);
            } catch (err) {
                alert('❌ 無法載入 default.csv\n可能原因：檔案不在相同資料夾，或是瀏覽器阻擋了本地檔案讀取。請改用「上載」按鈕匯入。');
            }
        }

        function handleCSVUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                const allParsed = parseCSV(e.target.result);
                const selectedSubject = document.getElementById('subject').value;
                const selectedLevel = document.getElementById('level').value;
                customQuestions = filterQuestionsBySubjectLevel(allParsed, selectedSubject, selectedLevel);
                if (customQuestions.length === 0) customQuestions = allParsed;
                alert(`✅ CSV 題庫已成功載入！\n(CSV loaded!)\n共 ${customQuestions.length} 題匹配 ${selectedSubject} - ${selectedLevel}`);
            };
            reader.readAsText(file);
        }

        function startGame() {
            if (!customQuestions || customQuestions.length === 0) {
                alert('⚠️ 請先載入題庫！\n請點擊「📋 Default 預設」或上載您的 CSV 檔案。');
                return;
            }

            const numTeamsValue = document.getElementById('num-teams').value;
            let numTeams;
            if (numTeamsValue === 'solo') {
                const soloClass = document.getElementById('solo-class').value.trim();
                const soloName = document.getElementById('solo-name').value.trim();
                if (!soloClass || !soloName) { alert('請填寫班級和姓名！(Please enter Class and Name)'); return; }
                window.currentSoloPlayer = { class: soloClass, name: soloName };
                numTeams = 1;
            } else {
                numTeams = parseInt(numTeamsValue);
                window.currentSoloPlayer = null;
            }

            currentSubject = document.getElementById('subject').value;
            currentLevel = document.getElementById('level').value;
            endMode = document.getElementById('end-mode').value;
            if (endMode === 'score') targetScore = parseInt(document.getElementById('target-score').value) || 100;
            else window.gameMinutes = parseInt(document.getElementById('game-time').value) || 10;

            document.getElementById('menu-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
            const infoEl = document.getElementById('game-info');

            if (numTeamsValue === 'solo' && window.currentSoloPlayer) {
                infoEl.innerHTML = `${currentSubject} • ${currentLevel} &nbsp;|&nbsp; <span style="color:#39ff14;">${window.currentSoloPlayer.class} ${window.currentSoloPlayer.name}</span>`;
            } else {
                infoEl.innerHTML = `${currentSubject} • ${currentLevel} <span style="color:#94a3b8; font-size:12px;">(${customQuestions.length} Qs)</span>`;
            }

            initTeams(numTeams);
            playBackgroundMusic();
        }

        function initTeams(numTeams) {
            teams = []; currentQuestions = [];
            const colors = ['#f87171', '#60a5fa', '#facc15', '#a78bfa', '#f472b6', '#34d399'];
            for (let i = 0; i < numTeams; i++) {
                teams.push({ id: i+1, name: `Team ${String.fromCharCode(65+i)}`, score: 0, color: colors[i % colors.length], multiplier: 1 });
                currentQuestions.push(getRandomQuestion());
            }
            renderAllTeams();
            updateLeaderboard();

            isPaused = false;
            pausedRemainingTime = 0;
            const pauseBtn = document.getElementById('pause-btn');
            if (pauseBtn) {
                pauseBtn.innerHTML = '⏸️ PAUSE';
                pauseBtn.style.borderColor = '#ff00aa';
                pauseBtn.style.display = 'inline-block';
            }

            if (endMode === 'time') {
                gameEndTime = Date.now() + (window.gameMinutes || 10) * 60 * 1000;
                document.getElementById('timer-display').style.display = 'inline';
                startTimer();
            } else {
                document.getElementById('timer-display').style.display = 'none';
            }
        }

        function parseCSV(csvText) {
            if (csvText.charCodeAt(0) === 0xFEFF) csvText = csvText.slice(1);
            const lines = csvText.trim().split('\n');
            if (lines.length < 2) return [];

            let rawHeader = parseCSVLine(lines[0]);
            const header = rawHeader.map(h => h.toLowerCase().replace(/"/g, '').replace(/\n/g, ' ').replace(/\s+/g, ' ').trim());
            const questions = [];
            const findIdx = (keywords) => header.findIndex(h => keywords.some(k => h.includes(k)));

            const idxSubject = findIdx(['subject']);
            const idxLevel   = findIdx(['level']);
            const idxQ       = findIdx(['question text']);
            const idxAnswer1 = findIdx(['answer 1']);
            const idxAnswer2 = findIdx(['answer 2']);
            const idxAnswer3 = findIdx(['answer 3']);
            const idxAnswer4 = findIdx(['answer 4']);
            const idxCorrect = findIdx(['correct answer', 'correct']);

            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const row = parseCSVLine(lines[i]);
                if (row.length < 4) continue;

                const qText = (idxQ !== -1 ? row[idxQ] : row[3] || '').trim();
                const opts = [];
                [idxAnswer1, idxAnswer2, idxAnswer3, idxAnswer4].forEach(idx => {
                    if (idx !== -1 && row[idx] && row[idx].trim()) opts.push(row[idx].trim());
                });

                let correctIdx = -1;
                if (idxCorrect !== -1 && row[idxCorrect]) correctIdx = parseInt(row[idxCorrect].trim()) - 1;
                else correctIdx = parseInt(row[row.length - 1]) - 1;

                const subj = (idxSubject !== -1 ? row[idxSubject] : '').trim();
                const lvl  = (idxLevel   !== -1 ? row[idxLevel]   : '').trim();

                if (qText && opts.length >= 2 && !isNaN(correctIdx) && correctIdx >= 0 && correctIdx < opts.length) {
                    questions.push({ q: qText, options: opts, ans: correctIdx, subject: subj, level: lvl });
                }
            }
            return questions;
        }

        function parseCSVLine(line) {
            const result = [];
            let current = '', inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') inQuotes = !inQuotes;
                else if (char === ',' && !inQuotes) { result.push(current.trim()); current = ''; }
                else current += char;
            }
            result.push(current.trim());
            return result;
        }

        function filterQuestionsBySubjectLevel(allQuestions, subject, level) {
            if (!allQuestions || allQuestions.length === 0) return [];
            const norm = (str) => (str || '').toLowerCase().replace(/\.|\s|grade|form|年級|級/g, '').trim();
            const targetSub = norm(subject), targetLvl = norm(level);
            return allQuestions.filter(q => {
                const qSub = norm(q.subject), qLvl = norm(q.level);
                const subMatch = !qSub || qSub === targetSub || 
                                 (targetSub === 'maths' && (qSub === 'math' || qSub === '數學')) ||
                                 (targetSub === '科學' && (qSub === '科學')) ||
                                 (targetSub === 'science' && (qSub === 'Science')) ||
                                 (targetSub === 'chinese' && (qSub === '中文' || qSub === 'chinese'));
                const lvlMatch = !qLvl || qLvl === targetLvl || qLvl === targetLvl.replace('p','');
                return subMatch && lvlMatch;
            });
        }

        function getRandomQuestion() {
            if (!customQuestions || customQuestions.length === 0) return { q: "載入異常！", options: ["A", "B"], ans: 0 };
            const pool = customQuestions;
            const original = pool[Math.floor(Math.random() * pool.length)];
            let shuffled = [...original.options];
            const correctText = shuffled[original.ans];
            for (let i = shuffled.length-1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i+1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return { q: original.q, options: shuffled, ans: shuffled.indexOf(correctText) };
        }

        function renderTeamQuestion(teamId, teamIndex) {
            const qEl = document.getElementById(`qtext-${teamId}`);
            const optsDiv = document.getElementById(`options-${teamId}`);
            const statusEl = document.getElementById(`status-${teamId}`);
            if(!qEl || !optsDiv || !statusEl) return;

            const qText = currentQuestions[teamIndex].q;
            const isShort = qText.length > 0 && qText.length <= 5;
            
            qEl.style.fontSize = isShort ? '70px' : '17px';
            qEl.style.lineHeight = isShort ? '1.2' : '1.55';
            qEl.innerHTML = qText;
            
            if(teams[teamIndex].multiplier === 3) {
                statusEl.innerHTML = `<span style="color:#ff4500; font-weight:bold; animation: pulse 1s infinite;">🔥 3x POINTS NEXT Q! 🔥</span>`;
            } else {
                statusEl.innerHTML = '';
            }
            
            optsDiv.innerHTML = '';
            currentQuestions[teamIndex].options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = `${String.fromCharCode(65+i)}. ${opt}`;
                btn.onclick = () => handleAnswer(teamId, i, teamIndex);
                optsDiv.appendChild(btn);
            });
        }

        function renderAllTeams() {
            const grid = document.getElementById('team-grid');
            grid.innerHTML = '';

            if (teams.length === 1) grid.classList.add('solo-mode');
            else grid.classList.remove('solo-mode');

            teams.forEach((team, index) => {
                const card = document.createElement('div');
                card.className = 'team-card';
                card.id = `card-${team.id}`; 
                
                card.innerHTML = `
                    <div class="team-header">
                        <div class="team-name" style="color:${team.color}; font-weight:bold;">${team.name}</div>
                        <div class="score" id="score-${team.id}">${team.score}</div>
                    </div>
                    <div class="progress-container">
                        <div class="progress-bar" id="progress-${team.id}" style="width:0%"></div>
                    </div>
                    <div class="question" id="qtext-${team.id}"></div>
                    <div class="options" id="options-${team.id}"></div>
                    <div class="status" id="status-${team.id}"></div>
                `;
                grid.appendChild(card);
                renderTeamQuestion(team.id, index);
            });
        }

        function freezeTeam(targetTeamIndex, seconds) {
            const team = teams[targetTeamIndex];
            const card = document.getElementById(`card-${team.id}`);
            if(!card) return;
            
            let overlay = document.getElementById(`freeze-${team.id}`);
            if(!overlay) {
                overlay = document.createElement('div');
                overlay.id = `freeze-${team.id}`;
                overlay.className = 'freeze-overlay';
                card.appendChild(overlay);
            }
            
            overlay.style.display = 'flex';
            let timeLeft = seconds;
            overlay.innerHTML = `<h2 style="margin:0;">❄️ FROZEN ❄️<br><span style="font-size:32px;">${timeLeft}s</span></h2>`;
            
            if(team.freezeTimer) clearInterval(team.freezeTimer);
            
            team.freezeTimer = setInterval(() => {
                if(isPaused) return; 
                timeLeft--;
                if(timeLeft <= 0) {
                    clearInterval(team.freezeTimer);
                    team.freezeTimer = null;
                    if(overlay) overlay.style.display = 'none';
                } else {
                    if(overlay) overlay.innerHTML = `<h2 style="margin:0;">❄️ FROZEN ❄️<br><span style="font-size:32px;">${timeLeft}s</span></h2>`;
                }
            }, 1000);
        }

        function applyPrize(prize, teamIndex) {
            const me = teams[teamIndex];
            const opponents = teams.map((t, i) => i).filter(i => i !== teamIndex);

            if (prize.type === 'steal') {
                if (opponents.length > 0) {
                    const validOpps = opponents.filter(i => teams[i].score > 0);
                    if(validOpps.length > 0) {
                        const targetIdx = validOpps[Math.floor(Math.random() * validOpps.length)];
                        const stealAmt = Math.min(5, teams[targetIdx].score);
                        teams[targetIdx].score -= stealAmt;
                        me.score += stealAmt;
                    } else {
                        me.score += 5; 
                    }
                } else {
                    me.score += 5; 
                }
            } else if (prize.type === 'freeze1') {
                if (opponents.length > 0) {
                    const targetIdx = opponents[Math.floor(Math.random() * opponents.length)];
                    freezeTeam(targetIdx, 5);
                }
            } else if (prize.type === 'add10') {
                me.score += 10;
            } else if (prize.type === 'freezeAll') {
                opponents.forEach(i => freezeTeam(i, 3));
            } else if (prize.type === 'triple') {
                me.multiplier = 3;
            }

            const maxTarget = endMode === 'score' ? targetScore : 300;
            teams.forEach(t => {
                const scoreEl = document.getElementById(`score-${t.id}`);
                if(scoreEl) scoreEl.textContent = t.score;
                const prog = Math.min((t.score / maxTarget) * 100, 100);
                const pEl = document.getElementById(`progress-${t.id}`);
                if(pEl) pEl.style.width = `${prog}%`;
            });
            updateLeaderboard();

            if (endMode === 'score' && me.score >= targetScore) {
                setTimeout(() => { alert(`🎉 ${me.name} WINS!`); endGame(); }, 800);
            }
        }

        function startLuckyDraw(teamId, teamIndex) {
            const qEl = document.getElementById(`qtext-${teamId}`);
            const optsDiv = document.getElementById(`options-${teamId}`);
            const statusEl = document.getElementById(`status-${teamId}`);
            
            qEl.style.fontSize = '24px';
            qEl.style.lineHeight = '1.3';
            qEl.innerHTML = `<div style="text-align:center; width:100%; color:#facc15; text-shadow:0 0 10px #facc15;">🎰 MYSTERY BOX 🎰</div>`;
            optsDiv.innerHTML = '';
            statusEl.innerHTML = '';

            const prizes = [
                { icon: '🏴‍☠️', text: 'Steal 5 Pts', color: '#ff00aa', type: 'steal' },
                { icon: '❄️', text: 'Freeze 1 (5s)', color: '#00f9ff', type: 'freeze1' },
                { icon: '💎', text: '+10 Points', color: '#39ff14', type: 'add10' },
                { icon: '⚡', text: 'Freeze All (3s)', color: '#facc15', type: 'freezeAll' },
                { icon: '🔥', text: '3x Points Next Q', color: '#ff4500', type: 'triple' }
            ];

            let spinCount = 0;
            const spinInterval = setInterval(() => {
                const p = prizes[spinCount % prizes.length];
                optsDiv.innerHTML = `<div style="font-size:16px; text-align:center; padding:18px; color:${p.color}; border:2px dashed ${p.color}; margin:10px; border-radius:8px;">${p.icon} ${p.text}</div>`;
                spinCount++;
            }, 50);

            setTimeout(() => {
                clearInterval(spinInterval);
                const winIdx = Math.floor(Math.random() * prizes.length);
                const winPrize = prizes[winIdx];
                
                optsDiv.innerHTML = `<div style="font-size:18px; text-align:center; padding:20px; background:#12122e; color:${winPrize.color}; border:3px solid ${winPrize.color}; box-shadow: 0 0 15px ${winPrize.color}; margin:10px; border-radius:8px; animation: pulse 0.5s infinite;">🎉 ${winPrize.icon}<br>${winPrize.text} 🎉</div>`;
                
                applyPrize(winPrize, teamIndex);

                setTimeout(() => {
                    currentQuestions[teamIndex] = getRandomQuestion();
                    renderTeamQuestion(teamId, teamIndex);
                }, 2500);

            }, 1000); // 已經設定為 1 秒的快速轉動時間
        }

        function handleAnswer(teamId, selectedIndex, teamIndex) {
            const q = currentQuestions[teamIndex];
            const isCorrect = selectedIndex === q.ans;
            const statusEl = document.getElementById(`status-${teamId}`);
            const buttons = document.querySelectorAll(`#options-${teamId} .option-btn`);
           
            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === q.ans) btn.style.borderColor = '#39ff14';
                if (idx === selectedIndex && !isCorrect) btn.style.borderColor = '#ff00aa';
            });

            const oldScore = teams[teamIndex].score;
            const ptsToAdd = 10 * (teams[teamIndex].multiplier || 1);
            teams[teamIndex].multiplier = 1; 

            if (isCorrect) {
                teams[teamIndex].score += ptsToAdd;
                statusEl.innerHTML = `<span style="color:#39ff14">✅ CORRECT! +${ptsToAdd}</span>`;
            } else {
                statusEl.innerHTML = `<span style="color:#ff00aa">❌ Wrong. Answer: ${String.fromCharCode(65 + q.ans)}</span>`;
            }

            document.getElementById(`score-${teamId}`).textContent = teams[teamIndex].score;
            const progress = Math.min((teams[teamIndex].score / (endMode==='score' ? targetScore : 300)) * 100, 100);
            document.getElementById(`progress-${teamId}`).style.width = `${progress}%`;
            updateLeaderboard();
            
            if (endMode === 'score' && teams[teamIndex].score >= targetScore) {
                setTimeout(() => { alert(`🎉 ${teams[teamIndex].name} WINS!`); endGame(); }, 800);
                return;
            }

            const crossed50 = Math.floor(teams[teamIndex].score / 50) > Math.floor(oldScore / 50);

            pendingResultTimeouts[teamId] = setTimeout(() => {
                if (isCorrect && crossed50) {
                    startLuckyDraw(teamId, teamIndex);
                } else {
                    currentQuestions[teamIndex] = getRandomQuestion();
                    renderTeamQuestion(teamId, teamIndex);
                }
                delete pendingResultTimeouts[teamId];
            }, 1600);
        }

        function updateLeaderboard() {
            const sorted = [...teams].sort((a,b) => b.score - a.score);
            let html = '';
            sorted.forEach((t, i) => {
                html += `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #334155;">
                    <span><strong>#${i+1}</strong> ${t.name}</span>
                    <span style="color:#39ff14;font-weight:bold;">${t.score} pts</span>
                </div>`;
            });
            document.getElementById('leaderboard').innerHTML = html;
        }

        function endGame() {
            if (!confirm("End game and return to menu?")) return;

            const wasSolo = !!window.currentSoloPlayer;
            const finalScore = (teams.length > 0) ? teams[0].score : 0;

            stopBackgroundMusic();
            if (gameInterval) clearInterval(gameInterval);

            if (wasSolo && window.currentSoloPlayer) {
                const player = window.currentSoloPlayer;
                const confirmSave = confirm(
                    `Solo Mode 結束！\n\n班級：${player.class}\n姓名：${player.name}\n分數：${finalScore} 分\n\n是否要將成績儲存到 Google Sheet 雲端？`
                );
                if (confirmSave) {
                    const recordData = {
                        timestamp: new Date().toISOString(),
                        date: new Date().toLocaleDateString('zh-HK'),
                        time: new Date().toLocaleTimeString('zh-HK'),
                        class: player.class, name: player.name,
                        subject: currentSubject, level: currentLevel,
                        score: finalScore, endMode: endMode,
                        targetOrTime: endMode === 'score' ? targetScore : (window.gameMinutes || 10)
                    };
                    saveSoloResultToGoogleSheet(recordData);
                }
            }

            isPaused = false;
            pausedRemainingTime = 0;
            const pauseBtn = document.getElementById('pause-btn');
            if (pauseBtn) { pauseBtn.style.display = 'none'; pauseBtn.innerHTML = '⏸️ PAUSE'; }
            
            document.getElementById('game-screen').classList.remove('active');
            document.getElementById('menu-screen').classList.add('active');
            document.getElementById('csv-upload').value = '';
            document.getElementById('timer-display').style.display = 'none';
            customQuestions = [];
            window.currentSoloPlayer = null;
        }

        function startTimer() {
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(() => {
                const remaining = Math.ceil((gameEndTime - Date.now()) / 1000);
                if (remaining <= 0) { 
                    clearInterval(gameInterval); 
                    alert("⏰ Time's Up!"); 
                    endGame(); 
                    return; 
                }
                const min = Math.floor(remaining / 60);
                const sec = remaining % 60;
                document.getElementById('timer-display').textContent = `TIME: ${min}:${sec < 10 ? '0'+sec : sec}`;
            }, 1000);
        }

        document.addEventListener('keydown', e => {
            if (!document.getElementById('game-screen').classList.contains('active') || isPaused) return;
            const key = e.key.toUpperCase();
            if (!['A','B','C','D'].includes(key)) return;
            const idx = key.charCodeAt(0) - 65;
            teams.forEach(team => {
                const opts = document.getElementById(`options-${team.id}`);
                if (opts && !opts.querySelector('button[disabled]')) {
                    const btns = opts.querySelectorAll('.option-btn');
                    if (btns[idx]) btns[idx].click();
                }
            });
        });

        window.onload = () => {
            toggleEndOptions();
            toggleSoloMode();
        };
        
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });
    </script>
</body>
