<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CKCPS WARS - Mr.Lee EDITION</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
      
        :root {
            --primary: #00f9ff;
            --secondary: #ff00aa;
            --accent: #39ff14;
        }
      
        body {
            margin: 0; padding: 0;
            font-family: 'Press Start 2P', system-ui;
            background: linear-gradient(180deg, #0a0a1f 0%, #05050f 100%);
            color: #fff;
            text-align: center;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
      
        header {
            background: #0a0a1f;
            padding: 12px;
            border-bottom: 3px solid var(--primary);
        }
      
        h1 {
            margin: 0;
            font-size: clamp(22px, 5vw, 30px);
            text-shadow: 0 0 10px var(--primary);
        }
      
        .container {
            max-width: 100%;
            margin: 0 auto;
            padding: 15px;
        }
      
        .screen { display: none; }
        .screen.active { display: block; }
      
        button {
            font-family: 'Press Start 2P', system-ui;
            padding: 14px 28px; margin: 8px;
            background: #12122e;
            color: #fff;
            border: 3px solid var(--primary);
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 0 12px rgba(0, 249, 255, 0.4);
            font-size: 15px;
        }
        button:hover {
            background: var(--primary);
            color: #000;
            transform: scale(1.03);
        }
      
        .section {
            background: #12122e;
            padding: 20px 18px;     /* 加大垂直空間 */
            margin: 12px 0;
            border-radius: 10px;
            border: 2px solid var(--primary);
        }

        /* 首頁選單的藍框統一收窄置中 */
        #menu-screen .section {
            max-width: 860px;
            margin-left: auto;
            margin-right: auto;
        }
      
        select, input[type="number"] {
            font-family: 'Press Start 2P', system-ui;
            padding: 10px 12px;
            background: #0a0a1f;
            color: #fff;
            border: 2px solid var(--accent);
            margin: 4px 0;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
        }

        /* 強制選單頁面內的輸入框對齊 */
        #menu-screen .compact-grid select,
        #menu-screen .compact-grid input[type="number"] {
            width: 100% !important;
            max-width: none !important;
        }
      
        label {
            font-size: 13px;
            display: block;
            margin-bottom: 6px;
        }
      
        .score {
            font-size: 32px;
            color: var(--accent);
            text-shadow: 0 0 8px var(--accent);
        }
      
        .question {
            background: #0a0a1f;
            padding: 16px;
            border-radius: 8px;
            margin: 10px 0;
            min-height: 85px;
            display: flex;
            align-items: center;
            font-size: 17px; /* 設定一個統一的預設值 */
            line-height: 1.55;
            text-align: left;
            border: 2px solid var(--primary);
            box-sizing: border-box;
        }
      
        .option-btn {
            padding: 12px 14px;
            font-size: clamp(13px, 2vw, 15px);
            border: 2px solid #334155;
            background: #12122e;
            text-align: left;
            margin: 5px 0;
            width: 100%;
            box-sizing: border-box;
        }
      
        .leaderboard {
            background: #12122e;
            padding: 16px;
            border-radius: 10px;
            border: 2px solid var(--secondary);
            margin-bottom: 20px;
        }
       
        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(0, 1fr));
            gap: 14px;
            width: 100%;
            padding-bottom: 12px;
        }
      
        .team-card {
            background: #12122e;
            border: 4px solid #334155;
            border-radius: 10px;
            padding: 14px;
            min-height: 420px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            position: relative; /* 為了凍結遮罩定位 */
            transition: opacity 0.3s;
        }
       
        .team-header {
            margin-bottom: 8px;
        }
       
        .progress-bar {
            height: 8px;
            background: linear-gradient(90deg, var(--accent), var(--primary));
            margin: 8px 0;
            border-radius: 4px;
        }
       
        .options {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
       
        .compact-grid {
            display: grid;
            gap: 12px;
            grid-template-columns: 278px 278px 278px;
            max-width: 860px;
            margin: 0 auto;
            justify-content: center;
        }

        .csv-buttons {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        /* Solo Mode：單一卡片收窄並置中 */
        .team-grid.solo-mode {
            max-width: 620px;
            margin: 0 auto;
            justify-content: center;
        }

        .team-grid.solo-mode .team-card {
            min-height: 400px;
            border-color: #39ff14;
        }
        .csv-buttons button {
            flex: 1;
        }

        .end-condition {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: flex-start;
        }
        .end-left, .end-right {
            flex: 1;
            min-width: 280px;
        }

        /* 凍結特效遮罩樣式 */
        .freeze-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 150, 255, 0.25);
            backdrop-filter: blur(2px);
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #00f9ff;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 0 0 10px #00f9ff;
            z-index: 10;
            pointer-events: all;
        }
    </style>
</head>
<body>
    <header>
        <h1>🏴‍☠️ CKCPS WARS 🏴‍☠️</h1>
        <p style="margin:4px 0 0 0; font-size:12px; color:#00f9ff;">CYBERPUNK NEON EDITION • P.1–P.6</p>
    </header>
    <div class="container">
        <div id="menu-screen" class="screen active">
            <div class="compact-grid">
                <div class="section">
                    <label style="color:#00f9ff;">NUMBER OF TEAMS</label>
                    <select id="num-teams" onchange="toggleSoloMode()">
                        <option value="solo">🧑 SOLO (個人模式)</option>
                        <option value="2">2 Teams</option>
                        <option value="3">3 Teams</option>
                        <option value="4" selected>4 Teams</option>
                        <option value="5">5 Teams</option>
                        <option value="6">6 Teams</option>
                    </select>
                </div>
                <div class="section">
                    <label style="color:#00f9ff;">&nbsp;&nbsp;&nbsp;&nbsp;SUBJECT&nbsp;&nbsp;&nbsp;&nbsp;</label>
                    <select id="subject">
                        <option value="Chinese">Chinese中文</option>
                        <option value="English">English</option>
                        <option value="Maths">Maths數學</option>
                        <option value="Science">Science</option>
                        <option value="科學">科學</option>
                    </select>
                </div>
                <div class="section">
                    <label style="color:#00f9ff;">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;LEVEL&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</label>
                    <select id="level">
                        <option value="K" selected>K</option>
                        <option value="P1">P.1</option>
                        <option value="P2">P.2</option>
                        <option value="P3">P.3</option>
                        <option value="P4">P.4</option>
                        <option value="P5">P.5</option>
                        <option value="P6">P.6</option>
                    </select>
                </div>
            </div>

            <div id="solo-info" class="section" style="display:none; border-color:#39ff14;">
                <label style="color:#39ff14;">PLAYER INFORMATION 玩家資料</label>
                <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:8px;">
                    <div style="flex:1; min-width:130px;">
                        <label style="font-size:12px; color:#94a3b8;">Class</label>
                        <input type="text" id="solo-class" placeholder="e.g. 3A" style="width:80%; font-size:15px; padding:8px;">
                    </div>
                    <div style="flex:2; min-width:180px;">
                        <label style="font-size:12px; color:#94a3b8;">Name</label>
                        <input type="text" id="solo-name" placeholder="Full name please 請輸入全名" style="width:80%; font-size:15px; padding:8px;">
                    </div>
                </div>
            </div>

            <div class="section">
                <div class="end-condition">
                    <div class="end-left">
                        <label style="color:#ff00aa;">GAME END CONDITION</label>
                        <select id="end-mode" onchange="toggleEndOptions()" style="width:100%;">
                            <option value="score">First to Score</option>
                            <option value="time">Timed Game</option>
                        </select>
                    </div>
                    <div class="end-right">
                        <div id="score-options">
                            <label style="color:#ff00aa;">TARGET SCORE</label>
                            <input type="number" id="target-score" value="100" min="10" step="10" style="width:100%;">
                        </div>
                        <div id="time-options" style="display:none;">
                            <label style="color:#ff00aa;">DURATION (minutes)</label>
                            <input type="number" id="game-time" value="10" min="1" max="60" style="width:100%;">
                        </div>
                    </div>
                </div>
            </div>

            <div class="section">
                <label style="color:#00f9ff;">BACKGROUND MUSIC</label>
                <div style="display:flex; align-items:center; gap:12px; margin-top:8px; flex-wrap:wrap;">
                    <div style="flex:1; min-width:220px;">
                        <select id="music-track" style="width:100%; font-size:13px;">
                            <option value="">No music</option>
                            <option value="Haaland.mp3">Music 1</option>
                            <option value="greensleeves.mp3">Music 2</option>
                            <option value="music3.mp3">Music 3</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="section">
                <label style="color:#39ff14;">QUESTION SOURCE</label>
                <div class="csv-buttons">
                    <button onclick="document.getElementById('csv-upload').click()">
                        📁 UPLOAD CSV 上載
                    </button>
                    <button onclick="loadDefaultCSV()" style="border-color:#39ff14;">
                        📋 Default 預設
                    </button>
                </div>
                <input type="file" id="csv-upload" accept=".csv" style="display:none;" onchange="handleCSVUpload(event)">
            </div>
            
            <button onclick="startGame()" style="font-size:22px; padding:20px 60px; margin-top:20px; border-color:#39ff14; box-shadow: 0 0 25px #39ff14;">
                🚀 START BATTLE!
            </button>
        </div>

        <div id="game-screen" class="screen">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:10px;">
                <strong id="game-info" style="color:#00f9ff; flex:1; text-align:left;"></strong>
                
                <div style="display:flex; align-items:center; gap:8px; justify-content:center; flex:1;">
                    <span id="timer-display" style="font-size:15px; background:#12122e; padding:6px 12px; border-radius:6px; border:2px solid #ff00aa; display:none;"></span>
                    <button id="pause-btn" onclick="togglePause()" style="padding:10px 20px; font-size:13px; border-color:#ff00aa;">⏸️ PAUSE</button>
                </div>
                
                <div style="flex:1; text-align:right;">
                    <button onclick="endGame()" style="padding:10px 20px; font-size:13px;">END GAME</button>
                </div>
            </div>
            
            <div class="leaderboard">
                <h3 style="color:#ff00aa; margin: 5px 0 12px 0;">🏆 LEADERBOARD 🏆</h3>
                <div id="leaderboard" style="text-align:left;"></div>
            </div>
            
            <div id="team-grid" class="team-grid"></div>
        </div>
    </div>

    <div id="lucky-draw-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center; text-align: center; font-family: 'Press Start 2P', sans-serif;">
        <div style="background: #111; border: 4px solid #ff0055; box-shadow: 0 0 20px #ff0055, inset 0 0 10px #ff0055; padding: 40px; border-radius: 15px; max-width: 600px; width: 90%;">
            <h2 id="lucky-player-title" style="color: #00ffff; text-shadow: 0 0 10px #00ffff; font-size: 20px; margin-bottom: 15px; line-height: 1.4;">🏆 恭喜玩家 🏆</h2>
            <p style="color: #fff; font-size: 12px; margin-bottom: 25px; line-height: 1.6;">分數達到 50 或其倍數！<br>觸發幸運大抽獎！</p>
            <div id="lucky-roulette" style="font-size: 16px; color: #ffff00; font-weight: bold; min-height: 6
