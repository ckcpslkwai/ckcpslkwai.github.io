    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            alert("⚠️ 遊戲偵測到錯誤: \n" + message + "\n位於第 " + lineno + " 行\n請檢查程式碼。");
            return true;
        };

        let customQuestions = [];
        let currentSubject = '', currentLevel = '', teams = [], currentQuestions = [];
        let gameInterval = null, endMode = 'score', targetScore = 100, gameEndTime = null;
        let isPaused = false, pausedRemainingTime = 0, pendingResultTimeouts = {};

        const GOOGLE_SHEET_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxqgywi-q3jfo3ENHdWkQMn0KJHTtaXISaIDqq3AQJiolRn9jge_gvCH-UkHGCFTboz/exec';

        async function attemptLogin() {
            const cls = document.getElementById('login-class').value.trim();
            const num = document.getElementById('login-num').value.trim();
            const pwd = document.getElementById('login-pwd').value.trim();

            if (!cls || !num || !pwd) {
                alert("請填寫班別、班號與密碼！\n(Please fill in all fields)");
                return;
            }

            try {
                const hiddenPath = atob('Li9wYXNzd29yZC5jc3Y='); 
                const response = await fetch(hiddenPath);
                if (!response.ok) throw new Error('找不到檔案');
                
                let text = await response.text();
                if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
                
                const lines = text.trim().split('\n');
                let isValid = false;
                let playerName = "";

                for (let i = 1; i < lines.length; i++) {
                    if (!lines[i].trim()) continue;
                    let parts = lines[i].split(',').map(s => s.replace(/"/g, '').trim());
                    
                    if (parts.length >= 4) {
                        if (parts[0].toLowerCase() === cls.toLowerCase() && parts[1] === num) {
                            if (parts[2] === pwd) {
                                isValid = true; playerName = parts[3]; break;
                            } else if (parts[3] === pwd) {
                                isValid = true; playerName = parts[2]; break;
                            }
                        }
                    }
                }

                if (isValid) {
                    alert(`✅ 登入成功！歡迎，${playerName}！`);
                    document.getElementById('login-screen').classList.remove('active');
                    document.getElementById('menu-screen').classList.add('active');
                    
                    document.getElementById('solo-class').value = cls.toUpperCase();
                    document.getElementById('solo-name').value = playerName;
                } else {
                    alert("❌ 班別、班號或密碼錯誤！\n(Invalid credentials)");
                }
            } catch (err) {
                alert("⚠️ 無法載入驗證檔。\n請確保密碼表命名正確且位於相同資料夾。\n" + err.message);
            }
        }

        async function saveSoloResultToGoogleSheet(playerData) {
            if (!GOOGLE_SHEET_WEBAPP_URL || GOOGLE_SHEET_WEBAPP_URL.includes('你的部署ID')) return false;
            try {
                await fetch(GOOGLE_SHEET_WEBAPP_URL, {
                    method: 'POST', mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(playerData)
                });
                alert(`✅ 成績已成功儲存到雲端！\n\n班級：${playerData.class}\n姓名：${playerData.name}\n分數：${playerData.score}`);
                return true;
            } catch (error) {
                alert('❌ 儲存失敗，請檢查網路或 URL 是否正確。');
                return false;
            }
        }

        async function fetchCloudLeaderboard(playerClass, subject, level) {
            const leaderboardEl = document.getElementById('leaderboard');
            if (!leaderboardEl) return;

            leaderboardEl.className = '';
            leaderboardEl.style.display = 'block';
            leaderboardEl.innerHTML = '<div style="text-align:center; color:#00f9ff; font-size:11px; animation:pulse 1s infinite;">📥 正在連線並載入排行與個人成績...</div>';

            if (!GOOGLE_SHEET_WEBAPP_URL || GOOGLE_SHEET_WEBAPP_URL.includes('你的部署ID')) {
                leaderboardEl.innerHTML = '<div style="color:#ff00aa;text-align:center;font-size:11px;">⚠️ 未設定雲端網址</div>';
                return;
            }

            try {
                const response = await fetch(`${GOOGLE_SHEET_WEBAPP_URL}?t=${Date.now()}`);
                if (!response.ok) throw new Error('網路回應異常');
                
                const allRecords = await response.json();
                if (allRecords.error) {
                    leaderboardEl.innerHTML = `<div style="color:#ff00aa;text-align:center;font-size:11px;">❌ 錯誤: ${allRecords.error}</div>`;
                    return;
                }
                if (!Array.isArray(allRecords) || allRecords.length === 0) {
                    leaderboardEl.innerHTML = `<div style="text-align:center;color:#94a3b8;font-size:12px;margin-top:10px;">目前暫無紀錄，快來搶下第一個名次！</div>`;
                    return;
                }

                const norm = (str) => (str || '').toString().toLowerCase().replace(/\.|\s|grade|form|年級|級/g, '').trim();
                const targetClass = norm(playerClass);
                const targetSub = norm(subject);
                const targetLvl = norm(level);
                const currentPlayerName = window.currentSoloPlayer ? window.currentSoloPlayer.name.trim() : "";

                let subjectLevelFiltered = allRecords.filter(r => {
                    const rSub = norm(r.subject);
                    const rLvl = norm(r.level);

                    const subMatch = rSub === targetSub || 
                                     (targetSub === 'maths' && (rSub === 'math' || rSub === '數學')) ||
                                     (targetSub === '科學' && (rSub === '科學')) ||
                                     (targetSub === 'science' && (rSub === 'science')) ||
                                     (targetSub === 'chinese' && (rSub === '中文' || rSub === 'chinese'));
                    const lvlMatch = rLvl === targetLvl || rLvl === targetLvl.replace('p','');
                    
                    return subMatch && lvlMatch;
                });

                let classFiltered = subjectLevelFiltered.filter(r => norm(r.class) === targetClass);
                let uniquePlayers = {};
                classFiltered.forEach(r => {
                    const nameKey = r.name ? r.name.trim() : 'Unknown';
                    const scoreVal = parseInt(r.score) || 0;
                    if (!uniquePlayers[nameKey] || scoreVal > uniquePlayers[nameKey].score) {
                        uniquePlayers[nameKey] = {
                            name: nameKey,
                            score: scoreVal
                        };
                    }
                });
                let top5 = Object.values(uniquePlayers).sort((a, b) => b.score - a.score).slice(0, 5);

                let personalFiltered = subjectLevelFiltered.filter(r => r.name && r.name.trim().toLowerCase() === currentPlayerName.toLowerCase());
                let personalTop5 = personalFiltered
                    .map(r => ({ score: parseInt(r.score) || 0, date: r.date || '' }))
                    .sort((a, b) => b.score - a.score)
                    .slice(0, 5);

                leaderboardEl.className = 'solo-leaderboard-grid';
                leaderboardEl.innerHTML = '';

                let leftHtml = '<div class="solo-left-col"><h4 style="color:#ff00aa; margin: 0 0 10px 0; font-size:12px; text-align:center;">CLASS TOP 5</h4>';
                if (top5.length === 0) {
                    leftHtml += `<div style="text-align:center;color:#94a3b8;font-size:11px;margin-top:15px;">暫無紀錄</div>`;
                } else {
                    let currentRank = 1;
                    let previousScore = null;
                    top5.forEach((t, i) => {
                        if (previousScore !== null && t.score < previousScore) {
                            currentRank = i + 1;
                        }
                        leftHtml += `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #334155;font-size:12px;">

        function parseCSV(csvText) {
            if (csvText.charCodeAt(0) === 0xFEFF) csvText = csvText.slice(1);
            const lines = csvText.trim().split('\n');
            if (lines.length < 2) return [];

            let rawHeader = parseCSVLine(lines[0]);
            const header = rawHeader.map(h => h.toLowerCase().replace(/"/g, '').replace(/\n/g, ' ').replace(/\s+/g, ' ').trim());
            const questions = [];
            const findIdx = (keywords) => header.findIndex(h => keywords.some(k => h.includes(k)));

            const idxId      = findIdx(['question #', 'question no', 'id', '編號', '題號']);
            const idxSubject = findIdx(['subject']);
            const idxLevel   = findIdx(['level']);
            const idxQ       = findIdx(['question text']);
            const idxAnswer1 = findIdx(['answer 1']);
            const idxAnswer2 = findIdx(['answer 2']);
            const idxAnswer3 = findIdx(['answer 3']);
            const idxAnswer4 = findIdx(['answer 4']);
            const idxCorrect = findIdx(['correct answer', 'correct']);

            let validQuestionCount = 0;
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const row = parseCSVLine(lines[i]);
                if (row.length < 4) continue;

                const qText = (idxQ !== -1 && row[idxQ]) ? row[idxQ].trim() : (row[3] || '').trim();
                const opts = [];
                [idxAnswer1, idxAnswer2, idxAnswer3, idxAnswer4].forEach(idx => {
                    if (idx !== -1 && row[idx] && row[idx].trim()) opts.push(row[idx].trim());
                });

                let correctIdx = -1;
                if (idxCorrect !== -1 && row[idxCorrect]) correctIdx = parseInt(row[idxCorrect].trim()) - 1;
                else correctIdx = parseInt(row[row.length - 1]) - 1;

                const subj = (idxSubject !== -1 && row[idxSubject]) ? row[idxSubject].trim() : '';
                const lvl  = (idxLevel   !== -1 && row[idxLevel]) ? row[idxLevel].trim() : '';
                
                let rowId = (idxId !== -1 && row[idxId]) ? row[idxId].trim() : (row[0] ? row[0].trim() : (validQuestionCount + 1));

                if (qText && opts.length >= 2 && !isNaN(correctIdx) && correctIdx >= 0 && correctIdx < opts.length) {
                    validQuestionCount++;
                    questions.push({ id: rowId, q: qText, options: opts, ans: correctIdx, subject: subj, level: lvl });
                }
            }
            return questions;
        }

        function parseCSVLine(line) {
            const result = [];
            let current = '', inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') inQuotes = !inQuotes;
                else if (char === ',' && !inQuotes) { result.push(current.trim()); current = ''; }
                else current += char;
            }
            result.push(current.trim());
            return result;
        }

        function filterQuestionsBySubjectLevel(allQuestions, subject, level) {
            if (!allQuestions || allQuestions.length === 0) return [];
            const norm = (str) => (str || '').toLowerCase().replace(/\.|\s|grade|form|年級|級/g, '').trim();
            const targetSub = norm(subject), targetLvl = norm(level);
            return allQuestions.filter(q => {
                const qSub = norm(q.subject), qLvl = norm(q.level);
                const subMatch = !qSub || qSub === targetSub || 
                                 (targetSub === 'maths' && (qSub === 'math' || qSub === '數學')) ||
                                 (targetSub === '科學' && (qSub === '科學')) ||
                                 (targetSub === 'science' && (qSub === 'Science')) ||
                                 (targetSub === 'chinese' && (qSub === '中文' || qSub === 'chinese'));
                const lvlMatch = !qLvl || qLvl === targetLvl || qLvl === targetLvl.replace('p','');
                return subMatch && lvlMatch;
            });
        }

        function getRandomQuestion() {
            if (!customQuestions || customQuestions.length === 0) return { id: 0, q: "載入異常！", options: ["A", "B"], ans: 0 };
            const pool = customQuestions;
            const original = pool[Math.floor(Math.random() * pool.length)];
            let shuffled = [...original.options];
            const correctText = shuffled[original.ans];
            for (let i = shuffled.length-1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i+1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return { id: original.id, q: original.q, options: shuffled, ans: shuffled.indexOf(correctText) };
        }

        function freezeTeam(targetTeamIndex, seconds) {
            const team = teams[targetTeamIndex];
            const card = document.getElementById(`card-${team.id}`);
            if(!card) return;
            
            let overlay = document.getElementById(`freeze-${team.id}`);
            if(!overlay) {
                overlay = document.createElement('div');
                overlay.id = `freeze-${team.id}`;
                overlay.className = 'freeze-overlay';
                card.appendChild(overlay);
            }
            
            overlay.style.display = 'flex';
            let timeLeft = seconds;
            overlay.innerHTML = `<h2 style="margin:0;">❄️ FROZEN ❄️<br><span style="font-size:32px;">${timeLeft}s</span></h2>`;
            
            if(team.freezeTimer) clearInterval(team.freezeTimer);
            
            team.freezeTimer = setInterval(() => {
                if(isPaused) return; 
                timeLeft--;
                if(timeLeft <= 0) {
                    clearInterval(team.freezeTimer);
                    team.freezeTimer = null;
                    if(overlay) overlay.style.display = 'none';
                } else {
                    if(overlay) overlay.innerHTML = `<h2 style="margin:0;">❄️ FROZEN ❄️<br><span style="font-size:32px;">${timeLeft}s</span></h2>`;
                }
            }, 1000);
        }

        function applyPrize(prize, teamIndex) {
            const me = teams[teamIndex];
            const opponents = teams.map((t, i) => i).filter(i => i !== teamIndex);

            if (prize.type === 'steal') {
                if (opponents.length > 0) {
                    const validOpps = opponents.filter(i => teams[i].score > 0);
                    if(validOpps.length > 0) {
                        const targetIdx = validOpps[Math.floor(Math.random() * validOpps.length)];
                        const stealAmt = Math.min(5, teams[targetIdx].score);
                        teams[targetIdx].score -= stealAmt;
                        me.score += stealAmt;
                    } else { me.score += 5; }
                } else { me.score += 5; }
            } else if (prize.type === 'freeze1') {
                if (opponents.length > 0) {
                    const targetIdx = opponents[Math.floor(Math.random() * opponents.length)];
                    freezeTeam(targetIdx, 5);
                }
            } else if (prize.type === 'add10') {
                me.score += 10;
            } else if (prize.type === 'freezeAll') {
                opponents.forEach(i => freezeTeam(i, 3));
            } else if (prize.type === 'triple') {
                me.multiplier = 3;
            }

            const maxTarget = endMode === 'score' ? targetScore : 300;
            teams.forEach(t => {
                const scoreEl = document.getElementById(`score-${t.id}`);
                if(scoreEl) scoreEl.textContent = t.score;
                const prog = Math.min((t.score / maxTarget) * 100, 100);
                const pEl = document.getElementById(`progress-${t.id}`);
                if(pEl) pEl.style.width = `${prog}%`;
            });

            if (!window.currentSoloPlayer) {
                updateLeaderboard();
            }

            if (endMode === 'score' && me.score >= targetScore) {
                setTimeout(() => { 
                    if (window.currentSoloPlayer) alert(`🎉 Finished!`);
                    else alert(`🎉 ${me.name} WINS!`);
                    endGame(); 
                }, 800);
            }
        }

            statusEl.innerHTML = '';

                { icon: '❄️', text: 'Freeze 1 (5s)', color: '#00f9ff', type: 'freeze1' },

                setTimeout(() => {
                    currentQuestions[teamIndex] = getRandomQuestion();

                }, 2000);

            }, 1000);

        function handleAnswer(teamId, selectedIndex, teamIndex) {
            const q = currentQuestions[teamIndex];
            const isCorrect = selectedIndex === q.ans;
            const statusEl = document.getElementById(`status-${teamId}`);
            const buttons = document.querySelectorAll(`#options-${teamId} .option-btn`);
           
            // 停用所有按鈕以防止連點
            buttons.forEach((btn, idx) => {
                btn.disabled = true;
            });

            const oldScore = teams[teamIndex].score;
            const ptsToAdd = 10 * (teams[teamIndex].multiplier || 1);
            teams[teamIndex].multiplier = 1; 

            if (isCorrect) {
                // 正確的情況
                buttons[q.ans].style.borderColor = '#39ff14'; // 保持綠色邊框
                teams[teamIndex].score += ptsToAdd;
                statusEl.innerHTML = `<span style="color:#39ff14">✅ CORRECT! +${ptsToAdd}</span>`;
                
                document.getElementById(`score-${teamId}`).textContent = teams[teamIndex].score;
                const progress = Math.min((teams[teamIndex].score / (endMode=='score' ? targetScore : 300)) * 100, 100);
                document.getElementById(`progress-${teamId}`).style.width = `${progress}%`;
                
                if (!window.currentSoloPlayer) updateLeaderboard();
                
                // 檢查是否結束遊戲
                if (endMode === 'score' && teams[teamIndex].score >= targetScore) {
                    setTimeout(() => { 
                        if (window.currentSoloPlayer) alert(`🎉 Finished!`);
                        else alert(`🎉 ${teams[teamIndex].name} WINS!`);
                        endGame(); 
                    }, 800);
                    return;
                }

                // 處理連鎖獎勵 (Lucky Draw)
                const crossed50 = Math.floor(teams[teamIndex].score / 50) > Math.floor(oldScore / 50);
                pendingResultTimeouts[teamId] = setTimeout(() => {
                    if (isCorrect && crossed50 && !window.currentSoloPlayer) {
                        startLuckyDraw(teamId, teamIndex);
                    } else {
                        currentQuestions[teamIndex] = getRandomQuestion();
                        renderTeamQuestion(teamId, teamIndex);
                    }
                    delete pendingResultTimeouts[teamId];
                }, 1600);

            } else {
                // 錯誤的情況：螢光強調 + 3秒暫停
                const wrongBtn = buttons[selectedIndex];
                
                // 設定螢光色強調 (Neon Red/Pink)
                wrongBtn.style.background = '#ff0055'; 
                wrongBtn.style.boxShadow = '0 0 20px #ff0055';
                wrongBtn.style.border = '2px solid #fff';
                wrongBtn.style.color = '#fff';
                
                // 顯示錯誤訊息
                statusEl.innerHTML = `<span style="color:#ff00aa">❌ Wrong! 凍結 3 秒!</span>`;

                // 設定 3000ms (3秒) 的延遲懲罰
                pendingResultTimeouts[teamId] = setTimeout(() => {
                    currentQuestions[teamIndex] = getRandomQuestion();
                    renderTeamQuestion(teamId, teamIndex);
                    delete pendingResultTimeouts[teamId];
                }, 3000);
            }
        }

        function updateLeaderboard() {
            const leaderboardEl = document.getElementById('leaderboard');
            if (leaderboardEl) {
                leaderboardEl.className = '';
                leaderboardEl.style.display = 'block';
            }

            const sorted = [...teams].sort((a,b) => b.score - a.score);
            let html = '';
            let currentRank = 1;
            let previousScore = null;

            sorted.forEach((t, i) => {
                if (previousScore !== null && t.score < previousScore) {
                    currentRank = i + 1; 
                }
                html += `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #334155;">
                    <span><strong>#${currentRank}</strong> ${t.name}</span>
                    <span style="color:#39ff14;font-weight:bold;">${t.score} pts</span>
                </div>`;
                previousScore = t.score;
            });
            if (leaderboardEl) leaderboardEl.innerHTML = html;
        }

        function endGame() {
            if (!confirm("End game and return to menu?")) return;

            const wasSolo = !!window.currentSoloPlayer;
            const finalScore = (teams.length > 0) ? teams[0].score : 0;

            stopBackgroundMusic();
            if (gameInterval) clearInterval(gameInterval);

            if (wasSolo && window.currentSoloPlayer) {
                const player = window.currentSoloPlayer;
                const confirmSave = confirm(
                    `Solo Mode 結束！\n\n班級：${player.class}\n姓名：${player.name}\n分數：${finalScore} 分\n\n是否要將成績儲存到 Google Sheet 雲端？`
                );
                if (confirmSave) {
                    const recordData = {
                        date: new Date().toLocaleDateString('zh-HK'),
                        time: new Date().toLocaleTimeString('zh-HK'),
                        class: player.class, name: player.name,
                        subject: currentSubject, level: currentLevel,
                        score: finalScore, endMode: endMode,
                        targetOrTime: endMode === 'score' ? targetScore : (window.gameMinutes || 10)
                    };
                    saveSoloResultToGoogleSheet(recordData);
                }
            }

            isPaused = false;
            pausedRemainingTime = 0;
            const pauseBtn = document.getElementById('pause-btn');
            if (pauseBtn) { pauseBtn.style.display = 'inline-block'; pauseBtn.innerHTML = '⏸️ PAUSE'; }
            
            document.getElementById('game-screen').classList.remove('active');
            document.getElementById('menu-screen').classList.add('active');
            document.getElementById('csv-upload').value = '';
            document.getElementById('timer-display').style.display = 'none';
            customQuestions = [];
            window.currentSoloPlayer = null;
        }

        function startTimer() {
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(() => {
                const remaining = Math.ceil((gameEndTime - Date.now()) / 1000);
                
                if (remaining <= 0) { 
                    clearInterval(gameInterval); 
                    document.getElementById('timer-display').textContent = `TIME: 0:00`;
                    disableAllAnswerButtons(true);
                    
                    setTimeout(() => {
                        alert("⏰ Time's Up!"); 
                        endGame(); 
                    }, 100);
                    return; 
                }
                
                const min = Math.floor(remaining / 60);
                const sec = remaining % 60;
                document.getElementById('timer-display').textContent = `TIME: ${min}:${sec < 10 ? '0'+sec : sec}`;
            }, 1000);
        }

        document.addEventListener('keydown', e => {
            if (!document.getElementById('game-screen').classList.contains('active') || isPaused) return;
            const key = e.key.toUpperCase();
            if (!['A','B','C','D'].includes(key)) return;
            const idx = key.charCodeAt(0) - 65;
            teams.forEach(team => {
                const opts = document.getElementById(`options-${team.id}`);
                if (opts && !opts.querySelector('button[disabled]')) {
                    const btns = opts.querySelectorAll('.option-btn');
                    if (btns[idx]) btns[idx].click();
                }
            });
        });

        window.onload = () => {
            toggleEndOptions();
            toggleSoloMode();
        };
        
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });
    </script>
</body>
</html>
