<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CKCPS WARS - Mr.Lee EDITION</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
      
        :root {
            --primary: #00f9ff;
            --secondary: #ff00aa;
            --accent: #39ff14;
        }
      
        body {
            margin: 0; padding: 0;
            font-family: 'Press Start 2P', system-ui;
            background: linear-gradient(180deg, #0a0a1f 0%, #05050f 100%);
            color: #fff;
            text-align: center;
            user-select: none;
        }
      
        header { background: #0a0a1f; padding: 12px; border-bottom: 3px solid var(--primary); }
        h1 { margin: 0; font-size: clamp(22px, 5vw, 30px); text-shadow: 0 0 10px var(--primary); }
      
        .container { max-width: 100%; margin: 0 auto; padding: 15px; }
        .screen { display: none; }
        .screen.active { display: block; }
      
        button {
            font-family: 'Press Start 2P', system-ui;
            padding: 14px 28px; margin: 8px;
            background: #12122e; color: #fff;
            border: 3px solid var(--primary);
            cursor: pointer; transition: all 0.2s;
            box-shadow: 0 0 12px rgba(0, 249, 255, 0.4);
        }
        button:hover { background: var(--primary); color: #000; transform: scale(1.03); }
      
        .section { background: #12122e; padding: 20px 18px; margin: 12px 0; border-radius: 10px; border: 2px solid var(--primary); }
        .question { background: #0a0a1f; padding: 16px; border-radius: 8px; margin: 10px 0; min-height: 85px; display: flex; align-items: center; font-size: 17px; line-height: 1.55; text-align: left; border: 2px solid var(--primary); }
      
        .lucky-draw {
            background: linear-gradient(45deg, #ff00aa, #ffd700);
            color: #000; padding: 20px; border-radius: 8px; margin: 10px 0; min-height: 140px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 18px; border: 4px solid #ffff00; animation: luckyPulse 1.2s infinite alternate;
            box-shadow: 0 0 20px #ffff00;
        }
        @keyframes luckyPulse { from { box-shadow: 0 0 20px #ffff00; } to { box-shadow: 0 0 40px #ff00aa; } }
      
        .option-btn { padding: 12px 14px; font-size: clamp(13px, 2vw, 15px); border: 2px solid #334155; background: #12122e; text-align: left; margin: 5px 0; width: 100%; box-sizing: border-box; }
      
        .team-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 14px; width: 100%; padding-bottom: 12px; }
        .team-card { background: #12122e; border: 4px solid #334155; border-radius: 10px; padding: 14px; min-height: 420px; display: flex; flex-direction: column; box-sizing: border-box; }
        .score { font-size: 32px; color: var(--accent); text-shadow: 0 0 8px var(--accent); }
    </style>
</head>
<body>
    <!-- ... (header + menu 保持不變) ... -->
    <header>
        <h1>🏴‍☠️ CKCPS WARS 🏴‍☠️</h1>
        <p style="margin:4px 0 0 0; font-size:12px; color:#00f9ff;">CYBERPUNK NEON EDITION • P.1–P.6</p>
    </header>
    <div class="container">
        <!-- MENU SCREEN (保持不變，省略以節省篇幅) -->
        <!-- ... 你的原 menu-screen 內容 ... -->

        <!-- GAME SCREEN -->
        <div id="game-screen" class="screen">
            <!-- ... leaderboard + team-grid ... -->
            <div id="team-grid" class="team-grid"></div>
        </div>
    </div>

    <script>
        // ... (所有變數、loadDefaultCSV、parseCSV 等保持不變) ...

        let luckyDrawActive = new Set();

        // ==================== LUCKY DRAW ====================
        function triggerLuckyDraw(teamId, teamIndex) {
            if (luckyDrawActive.has(teamId)) return;
            luckyDrawActive.add(teamId);

            const qEl = document.getElementById(`qtext-${teamId}`);
            const optsDiv = document.getElementById(`options-${teamId}`);
            const statusEl = document.getElementById(`status-${teamId}`);

            qEl.innerHTML = `
                <div class="lucky-draw">
                    <div style="font-size:22px; margin-bottom:12px;">🎰 LUCKY DRAW! 🎰</div>
                    <div style="font-size:14px;">${teams[teamIndex].name} 觸發30分倍數獎勵！</div>
                    <div id="draw-result-${teamId}" style="margin-top:15px; font-size:16px; min-height:60px;"></div>
                </div>
            `;
            optsDiv.innerHTML = '';
            statusEl.innerHTML = '';

            setTimeout(() => {
                const effects = [
                    { text: "🚀 自己 +10分！", apply: () => { teams[teamIndex].score += 10; } },
                    { text: "🦹 隨機偷取對手5分！", apply: () => {
                        if (teams.length > 1) {
                            let targets = teams.filter((_, i) => i !== teamIndex);
                            if (targets.length > 0) {
                                const target = targets[Math.floor(Math.random() * targets.length)];
                                const tIdx = teams.findIndex(t => t.id === target.id);
                                target.score = Math.max(0, target.score - 5);
                                teams[tIdx] = target;
                            }
                        }
                    }},
                    { text: "⏳ 其他隊伍暫停回答 7 秒！", apply: () => disableOtherTeams(7000, teamId) }
                ];

                const chosen = effects[Math.floor(Math.random() * effects.length)];
                chosen.apply();

                document.getElementById(`draw-result-${teamId}`).innerHTML = `<strong>${chosen.text}</strong>`;

                // 更新畫面
                document.getElementById(`score-${teamId}`).textContent = teams[teamIndex].score;
                const progress = Math.min((teams[teamIndex].score / 300) * 100, 100);
                document.getElementById(`progress-${teamId}`).style.width = `${progress}%`;
                updateLeaderboard();

                setTimeout(() => {
                    luckyDrawActive.delete(teamId);
                    currentQuestions[teamIndex] = getRandomQuestion();
                    const newQ = currentQuestions[teamIndex];
                    qEl.textContent = newQ.q;
                    qEl.style.fontSize = (newQ.q.length <= 5) ? '70px' : '17px';
                    optsDiv.innerHTML = '';
                    newQ.options.forEach((opt, i) => {
                        const btn = document.createElement('button');
                        btn.className = 'option-btn';
                        btn.textContent = `${String.fromCharCode(65+i)}. ${opt}`;
                        btn.onclick = () => handleAnswer(teamId, i, teamIndex);
                        optsDiv.appendChild(btn);
                    });
                }, 2800);
            }, 1600);
        }

        function disableOtherTeams(ms, excludeTeamId) {
            const allOptionBtns = document.querySelectorAll('#team-grid .option-btn');
            allOptionBtns.forEach(btn => {
                const card = btn.closest('.team-card');
                if (card && !card.querySelector(`#qtext-${excludeTeamId}`)) {
                    const wasDisabled = btn.disabled;
                    btn.disabled = true;
                    setTimeout(() => { btn.disabled = wasDisabled; }, ms);
                }
            });
        }

        function handleAnswer(teamId, selectedIndex, teamIndex) {
            if (luckyDrawActive.has(teamId)) return;
            // ... 原有正確/錯誤處理 ...

            if (isCorrect) {
                teams[teamIndex].score += 10;
                // ...
            }

            // ... 更新分數、progress、leaderboard ...

            const isMultiTeam = teams.length >= 2;
            if (isMultiTeam && teams[teamIndex].score % 30 === 0 && teams[teamIndex].score > 0) {
                setTimeout(() => triggerLuckyDraw(teamId, teamIndex), 1400);
            } else {
                // 原有下一題 timer ...
            }
        }

        // ... 其他函數 (renderAllTeams, updateLeaderboard, endGame 等) 保持最新版 ...
    </script>
</body>
</html>
