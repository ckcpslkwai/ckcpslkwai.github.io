<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>排行榜 V2607071146🏆</title>
  <style>
    :root {
      /* 深色質感背景 */
      --bg-color: linear-gradient(135deg, #4c1d95 0%, #4c1d95 100%);
      --panel-bg: #1e293b;        
      --text-main: #f8fafc;       
      --text-dim: #94a3b8;        
      --accent: #38bdf8;          
      --border-color: #334155;    
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, '微軟正黑體', sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      height: 100vh; 
      overflow: hidden;
      padding: 10px;
      display: flex;
      flex-direction: column;
      font-weight: 800;
    }
  
    header { text-align: center; padding: 5px 0; flex-shrink: 0; }
    h1 { font-size: 2rem; font-weight: 900; color: var(--accent); text-shadow: 0 0 10px rgba(56,189,248,0.2); }
    
    /* 排行榜網格 */
    .grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 12px;
      flex-grow: 1;
      margin-bottom: 8px;
      min-height: 0; 
    }
    
    .panel {
      background: var(--panel-bg);
      border: 2px solid var(--border-color);
      border-radius: 15px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel-header { text-align: center; font-size: 1.4rem; border-bottom: 2px solid var(--border-color); margin-bottom: 5px; color: #e2e8f0; }
    
    table { width: 100%; border-collapse: collapse; }
    th { color: var(--text-dim); font-size: 0.95rem; padding: 4px 0; }
    td { padding: 6px 4px; text-align: center; font-size: 1.25rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .name-col { text-align: left; }
    .score-col { color: #38bdf8; } 
    
    /* 長名字強制縮小設定 */
    .long-name { font-size: 0.9rem !important; }
    
    /* ✨ 前三名金屬漸變效果 ✨ */
    .rank-1 td {
      background: linear-gradient(135deg, #ffe066 0%, #f5b041 50%, #ffd700 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0px 2px 4px rgba(245, 176, 65, 0.3));
    }
    .rank-2 td {
      background: linear-gradient(135deg, #ffffff 0%, #94a3b8 50%, #e2e8f0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0px 2px 4px rgba(255, 255, 255, 0.2));
    }
    .rank-3 td {
      background: linear-gradient(135deg, #ffedd5 0%, #ea580c 50%, #b45309 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0px 2px 4px rgba(234, 88, 12, 0.2));
    }
    
    /* 🚌 巴士 ETA 專用區塊：高度從 13vh 壓縮至 9vh，極致減少上下無用空間 */
    #bus-eta-container {
      height: 9vh;
      background: rgba(30, 41, 59, 0.7);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      margin-bottom: 8px;
      display: flex;
      flex-direction: column; 
      justify-content: center;
      padding: 4px 15px; /* 緊湊的上下 Padding */
      gap: 2px;          /* 縮小上下兩行的間距 */
      flex-shrink: 0;
    }
    
    .bus-station-row {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      overflow-x: auto;
      white-space: nowrap;
    }
    .bus-station-row::-webkit-scrollbar { display: none; } 
    
    .bus-station-name { 
      font-size: 1.4rem; /* 略微縮小站名避免佔據過多橫向空間 */
      color: var(--accent); 
      border-right: 2px solid var(--border-color); 
      padding-right: 8px;
      flex-shrink: 0; 
    }
    .bus-route-item { display: inline-flex; align-items: center; background: rgba(255,255,255,0.06); padding: 2px 8px; border-radius: 6px; gap: 6px; font-size: 1rem; }
    .bus-route-no { color: #f43f5e; font-weight: 950; } 
    .bus-route-dest { color: var(--text-dim); font-size: 1rem; max-width: 85px; overflow: hidden; text-overflow: ellipsis; }
    .bus-eta-mins { color: #10b981; font-weight: 950; }
    .bus-eta-mins.now { color: #ef4444; }

    /* 走馬燈區域 */
    #marquee-container {
      height: 7vh;
      background: rgba(255, 255, 255, 0.05); 
      border-radius: 10px;
      display: flex;
      align-items: center;
      overflow: hidden;
      padding: 0 20px;
      white-space: nowrap;
      border: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }
    #marquee-text {
      font-size: 2.2rem;
      color: #34d399; 
      display: inline-block;
      animation: marquee 100s linear infinite;
      padding-left: 100%;
    }
    @keyframes marquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }
  </style>
</head>
<body>

  <header>
    <h1 id="main-title">載入中...</h1>
  </header>

  <main class="grid" id="gridPanels"></main>

  <div id="bus-eta-container">
    <div class="bus-station-row"><span style="color: var(--text-dim); font-size: 0.95rem;">正在加載 嶺南大學學校大門 巴士時間...</span></div>
    <div class="bus-station-row"><span style="color: var(--text-dim); font-size: 0.95rem;">正在加載 學校大門 巴士時間...</span></div>
  </div>

  <div id="marquee-container">
    <div id="marquee-text">資料載入中...</div>
  </div>

  <script>
    // ==========================================
    // 1. 排行榜核心邏輯
    // ==========================================
    const API_URL = 'https://script.google.com/macros/s/AKfycbxqgywi-q3jfo3ENHdWkQMn0KJHTtaXISaIDqq3AQJiolRn9jge_gvCH-UkHGCFTboz/exec';
    const LEVELS = ['P.1', 'P.2', 'P.3', 'P.4', 'P.5', 'P.6']; 
    let allData = [], subjects = [], currentSubjIndex = 0;

    function createPanels() {
      const grid = document.getElementById('gridPanels');
      grid.innerHTML = ''; 
      LEVELS.forEach(level => {
        grid.innerHTML += `
          <div class="panel">
            <div class="panel-header">${level}</div>
            <div id="container-${level.replace('.', '')}"></div>
          </div>
        `;
      });
    }

    async function updateData() {
      try {
        const response = await fetch(API_URL);
        const data = await response.json();
        updateMarquee(data);
        // 排除 0 分與空白項目
        allData = data.filter(d => d.subject && d.level && d.score !== undefined && d.score !== null && d.score !== '' && Number(d.score) !== 0);
        subjects = [...new Set(allData.map(d => d.subject.trim()))];
        render();
      } catch (e) { 
        console.error("更新排行榜失敗:", e);
      }
    }

    function updateMarquee(rawData) {
      const infos = [...new Set(rawData.map(d => d.info || d.Info || d.INFO).filter(i => i && String(i).trim() !== ""))];
      const textEl = document.getElementById('marquee-text');
      if (infos.length > 0) {
        textEl.textContent = infos.map(i => `✦ ${i} ✦`).join('          ');
      } else {
        textEl.textContent = "目前無最新公告";
      }
    }

    function render() {
      if (subjects.length === 0) return;
      const currentSubject = subjects[currentSubjIndex % subjects.length];
      document.getElementById('main-title').textContent = `(測試中)🏆${currentSubject} 榮譽榜 Leaderboard 🏆(Testing)`;
      
      LEVELS.forEach(level => {
        const container = document.getElementById(`container-${level.replace('.', '')}`);
        const norm = str => String(str || '').replace(/\s|\./g, '').toUpperCase();
        let list = allData.filter(d => norm(d.subject) === norm(currentSubject) && norm(d.level) === norm(level))
                          .sort((a, b) => b.score - a.score).slice(0, 7); 

        container.innerHTML = `
          <table>
            <thead><tr><th>#</th><th>班</th><th class="name-col">姓名</th><th>分</th></tr></thead>
            <tbody>
              ${list.map((r, i) => {
                const sName = r.name || '—';
                const isLong = sName.length > 6 ? 'long-name' : '';
                return `
                <tr class="${i < 3 ? 'rank-' + (i + 1) : ''}">
                  <td>${i+1}</td>
                  <td>${r.class||'—'}</td>
                  <td class="name-col ${isLong}">${sName}</td>
                  <td class="score-col">${r.score}</td>
                </tr>`}).join('')}
            </tbody>
          </table>`;
      });
      currentSubjIndex++;
    }

    // ==========================================
    // 2. 🚌 巴士 ETA 固定硬編碼引擎邏輯（每 30 秒自動重新獲取）
    // ==========================================
    const FIXED_STATIONS = [
      { company: "KMB", id: "AA5DA45828958EAE", name: "嶺南大學巴士到站時間" },
      { company: "KMB", id: "E2AE7A37634C8FE5", name: "學校大門巴士到站時間" }
    ];
    
    let stopData = {};
    let busTimer = null;

    function safeText(v) { return String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c])); }
    function stationKey(s) { return `${s.company}:${s.id}`; }
    function buildApiUrl(s) { return `https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${encodeURIComponent(s.id)}`; }

    function getMinutes(dateStr) {
      if (!dateStr) return null;
      const d = new Date(dateStr);
      return Number.isNaN(d.getTime()) ? null : Math.max(0, Math.ceil((d.getTime() - Date.now()) / 60000));
    }

    function groupByRoute(items) {
      const groups = new Map();
      for (const item of items) {
        const route = String(item.route || "").toUpperCase();
        if (!route || !item.eta) continue;
        const dest = String(item.dest_tc || item.dest || "").trim();
        const key = `${route}|${dest}`;
        if (!groups.has(key)) groups.set(key, { route, dest, rows: [] });
        groups.get(key).rows.push({ eta: item.eta, seq: Number(item.eta_seq || item.seq || 0) });
      }
      return Array.from(groups.values()).map(g => {
        g.rows.sort((a, b) => new Date(a.eta) - new Date(b.eta) || a.seq - b.seq);
        const uniq = []; const used = new Set();
        for (const r of g.rows) {
          const k = new Date(r.eta).getTime();
          if (used.has(k)) continue; used.add(k); uniq.push(r);
          if (uniq.length >= 3) break;
        }
        return { ...g, rows: uniq };
      }).sort((a,b) => String(a.route).localeCompare(String(b.route), "en", {numeric:true}));
    }

    function renderAllStops() {
      let html = "";
      FIXED_STATIONS.forEach(stop => {
        const groups = groupByRoute(stopData[stationKey(stop)] || []);
        html += `
          <div class="bus-station-row">
            <span class="bus-station-name">📍${safeText(stop.name)}</span>
            ${groups.length ? groups.map(g => {
              const first = g.rows[0];
              const mins = first ? getMinutes(first.eta) : null;
              const isNow = mins !== null && mins <= 1;
              let etaStr = mins === null ? "--" : (isNow ? "即到" : `${mins}分`);
              
              let nextPills = g.rows.slice(1, 3).map(r => {
                const m = getMinutes(r.eta);
                return m <= 1 ? "即到" : `${m}分`;
              }).join(",");
              if (nextPills) etaStr += ` (${nextPills})`;

              return `
                <div class="bus-route-item">
                  <span class="bus-route-no">${safeText(g.route)}</span>
                  <span class="bus-route-dest">${safeText(g.dest)}</span>
                  <span class="bus-eta-mins ${isNow?'now':''}">${etaStr}</span>
                </div>
              `;
            }).join('') : '<span style="color:var(--text-dim);font-size:0.9rem;">暫無班次資料</span>'}
          </div>
        `;
      });
      document.getElementById("bus-eta-container").innerHTML = html;
    }

    async function fetchEta() {
      try {
        const results = await Promise.all(FIXED_STATIONS.map(async stop => {
          const res = await fetch(buildApiUrl(stop), { cache: "no-store" });
          if (!res.ok) throw new Error();
          const json = await res.json();
          return { key: stationKey(stop), data: json.data || [] };
        }));
        stopData = {};
        for (const r of results) stopData[r.key] = r.data;
        renderAllStops();
      } catch (err) {
        console.error("讀取九巴 API 失敗", err);
      }
      clearTimeout(busTimer);
      busTimer = setTimeout(fetchEta, 30000); // 固定設定為每 30 秒異步刷新 API
    }

    // ==========================================
    // 3. 系統初始化啟動區
    // ==========================================
    createPanels();
    updateData(); 
    fetchEta(); // 啟動自動抓取巴士機制

    // 排行榜每 15 秒重新獲取並輪替科目
    setInterval(updateData, 15000);

    // 巴士 ETA 時間每 1 秒校對並渲染（確保倒數分鐘與"即到"即時更新）
    setInterval(() => {
      if (Object.keys(stopData).length) renderAllStops();
    }, 1000);
  </script>
</body>
</html>
