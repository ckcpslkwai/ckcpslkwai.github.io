<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>排行榜 V2607061422 🏆</title>
  <style>
    :root {
      --bg-color: #0f172a;        /* 深藍灰背景，較原版溫和 */
      --panel-bg: #1e293b;        /* 面板底色，稍微突顯出來 */
      --text-main: #f8fafc;       /* 純白文字，高對比 */
      --text-dim: #94a3b8;        /* 柔和灰色，用於標題 */
      --accent: #38bdf8;          /* 亮藍色，取代原有的刺眼綠色，更具現代感 */
      --border-color: #334155;    /* 邊框顏色 */
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    
    body {
      font-family: '微軟正黑體', sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      height: 100vh; 
      overflow: hidden;
      padding: 10px;
      display: flex;
      flex-direction: column;
      font-weight: 800; /* 全局粗體 */
    }
  
    header { text-align: center; padding: 5px 0; flex-shrink: 0; }
    h1 { font-size: 2.7rem; font-weight: 900; margin-bottom: 5px; color: var(--accent); text-shadow: 0 0 10px rgba(56,189,248,0.2); }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 12px;
      height: 100%;
    }
    
    .panel {
      background: var(--panel-bg);
      border: 2px solid var(--border-color);
      border-radius: 15px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel-header {
      text-align: center;
      font-size: 2rem;
      font-weight: 900;
      padding-bottom: 8px;
      border-bottom: 3px solid var(--border-color);
      margin-bottom: 8px;
      color: #e2e8f0;
    }
    
    table { width: 100%; border-collapse: collapse; }
    th {
      color: var(--text-dim);
      font-size: 1.2rem;
      padding: 10px 0;
      text-transform: uppercase;
    }
    td {
      padding: 12px 4px;
      text-align: center;
      font-size: 1.6rem; /* 顯著加大字體 */
      font-weight: 800;  /* 強制粗體 */
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .rank-col { width: 10%; }
    .class-col { width: 15%; }
    .name-col { width: 50%; text-align: left; padding-left: 10px; }
    .score-col { width: 25%; color: #fbbf24; } /* 換成柔和的琥珀色，對比深底非常清晰 */
    
    .rank-1 { color: #fbbf24; } /* 金色 */
    .rank-2 { color: #cbd5e1; } /* 銀色 */
    .rank-3 { color: #d97706; } /* 古銅色 */
    
    .slide-container { animation: fadeIn 0.5s ease-out; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>

  <header>
    <h1 id="main-title">載入中...</h1>
  </header>

  <main class="grid" id="gridPanels"></main>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbxqgywi-q3jfo3ENHdWkQMn0KJHTtaXISaIDqq3AQJiolRn9jge_gvCH-UkHGCFTboz/exec';
    const LEVELS = ['P.1', 'P.2', 'P.3', 'P.4', 'P.5', 'P.6']; 
    let allData = [], subjects = [], currentSubjIndex = 0;

    function createPanels() {
      const grid = document.getElementById('gridPanels');
      LEVELS.forEach(level => {
        grid.innerHTML += `
          <div class="panel">
            <div class="panel-header">${level}</div>
            <div id="container-${level.replace('.', '')}"></div>
          </div>
        `;
      });
    }

    async function fetchData() {
      try {
        const response = await fetch(API_URL);
        allData = (await response.json()).filter(d => d.subject && d.level);
        subjects = [...new Set(allData.map(d => d.subject.trim()))];
        render();
      } catch (e) { document.getElementById('main-title').textContent = '⚠️ 連線錯誤'; }
    }

    function render() {
      const currentSubject = subjects[currentSubjIndex % subjects.length];
      document.getElementById('main-title').textContent = `(測試中)🏆${currentSubject} 榮譽榜 Leaderboard 🏆(Testing)`;
      
      LEVELS.forEach(level => {
        const container = document.getElementById(`container-${level.replace('.', '')}`);
        const norm = str => String(str || '').replace(/\s|\./g, '').toUpperCase();
        
        // 限制顯示 7 名，確保字體變大後依然不會擠出面板
        let list = allData.filter(d => norm(d.subject) === norm(currentSubject) && norm(d.level) === norm(level))
                          .sort((a, b) => b.score - a.score).slice(0, 7); 

        container.innerHTML = `
          <div class="slide-container">
            <table>
              <thead><tr><th>#</th><th>班</th><th>姓名</th><th>分</th></tr></thead>
              <tbody>
                ${list.map((r, i) => `
                  <tr class="${i<3?'rank-'+(i+1):''}">
                    <td>${i+1}</td>
                    <td>${r.class||'—'}</td>
                    <td style="text-align:left;">${r.name||'—'}</td>
                    <td class="score-col">${r.score}</td>
                  </tr>`).join('')}
              </tbody>
            </table>
          </div>
        `;
      });
      currentSubjIndex++;
    }

    createPanels();
    fetchData();
    setInterval(render, 15000);
  </script>
</body>
</html>
