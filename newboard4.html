<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>排行榜 V2607061422 🏆</title>
  <style>
    :root {
      /* 回歸深色質感漸變背景 */
      --bg-color: linear-gradient(135deg, #0f172a 0%, #020617 100%);
      --panel-bg: #1e293b;        /* 深色面板底色 */
      --text-main: #f8fafc;       /* 普通名次使用清晰的純白/亮白字 */
      --text-dim: #94a3b8;        /* 表頭文字使用柔和灰 */
      --accent: #38bdf8;          /* 主標題亮藍色 */
      --border-color: #334155;    /* 邊框顏色 */
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    
    body {
      font-family: '微軟正黑體', sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      height: 100vh; 
      overflow: hidden;
      padding: 10px;
      display: flex;
      flex-direction: column;
      font-weight: 800;
    }
  
    header { text-align: center; padding: 5px 0; flex-shrink: 0; }
    h1 { font-size: 2.2rem; font-weight: 900; color: var(--accent); text-shadow: 0 0 10px rgba(56,189,248,0.2); }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 12px;
      flex-grow: 1;
      margin-bottom: 10px;
    }
    
    .panel {
      background: var(--panel-bg);
      border: 2px solid var(--border-color);
      border-radius: 15px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel-header { text-align: center; font-size: 1.5rem; border-bottom: 2px solid var(--border-color); margin-bottom: 5px; color: #e2e8f0; }
    
    table { width: 100%; border-collapse: collapse; }
    th { color: var(--text-dim); font-size: 1rem; padding: 5px 0; }
    td { padding: 8px 4px; text-align: center; font-size: 1.3rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .name-col { text-align: left; }
    .score-col { color: #38bdf8; } /* 普通名次的分數顯色 */
    
    /* 💡 長名字縮小設定：強制將大於 8 字元的名字縮小字體至 0.9rem */
    .long-name { font-size: 0.9rem !important; }
    
    /* ✨ 前三名金屬漸變效果 ✨ */
    /* 第一名：黃金漸變 */
    .rank-1 td {
      background: linear-gradient(135deg, #ffe066 0%, #f5b041 50%, #ffd700 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0px 2px 4px rgba(245, 176, 65, 0.3));
    }
    
    /* 第二名：白銀金屬漸變（加入深色光影，使其與純白字有強烈區別） */
    .rank-2 td {
      background: linear-gradient(135deg, #ffffff 0%, #94a3b8 50%, #e2e8f0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0px 2px 4px rgba(255, 255, 255, 0.2));
    }
    
    /* 第三名：青銅/紅銅漸變 */
    .rank-3 td {
      background: linear-gradient(135deg, #ffedd5 0%, #ea580c 50%, #b45309 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0px 2px 4px rgba(234, 88, 12, 0.2));
    }
    
    /* 走馬燈區域 */
    #marquee-container {
      height: 8vh;
      background: rgba(255, 255, 255, 0.05); 
      border-radius: 10px;
      display: flex;
      align-items: center;
      overflow: hidden;
      padding: 0 20px;
      white-space: nowrap;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    #marquee-text {
      font-size: 2.5rem;
      color: #34d399; /* 亮眼翠綠 */
      display: inline-block;
      animation: marquee 100s linear infinite;
      padding-left: 100%;
    }
    @keyframes marquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }
  </style>
</head>
<body>

  <header>
    <h1 id="main-title">載入中...</h1>
  </header>

  <main class="grid" id="gridPanels"></main>

  <div id="marquee-container">
    <div id="marquee-text">資料載入中...</div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbxqgywi-q3jfo3ENHdWkQMn0KJHTtaXISaIDqq3AQJiolRn9jge_gvCH-UkHGCFTboz/exec';
    const LEVELS = ['P.1', 'P.2', 'P.3', 'P.4', 'P.5', 'P.6']; 
    let allData = [], subjects = [], currentSubjIndex = 0;

    function createPanels() {
      const grid = document.getElementById('gridPanels');
      grid.innerHTML = ''; 
      LEVELS.forEach(level => {
        grid.innerHTML += `
          <div class="panel">
            <div class="panel-header">${level}</div>
            <div id="container-${level.replace('.', '')}"></div>
          </div>
        `;
      });
    }

    async function updateData() {
      try {
        const response = await fetch(API_URL);
        const data = await response.json();
        
        updateMarquee(data);

        // 確保不導入值為0或空白的項目
        allData = data.filter(d => d.subject && d.level && d.score !== undefined && d.score !== null && d.score !== '' && Number(d.score) !== 0);
        subjects = [...new Set(allData.map(d => d.subject.trim()))];
        
        render();
      } catch (e) { 
        console.error("更新失敗:", e);
      }
    }

    function updateMarquee(rawData) {
      const infos = [...new Set(rawData.map(d => d.info || d.Info || d.INFO).filter(i => i && String(i).trim() !== ""))];
      const textEl = document.getElementById('marquee-text');
      
      if (infos.length > 0) {
        textEl.textContent = infos.map(i => `✦ ${i} ✦`).join('          ');
      } else {
        textEl.textContent = "目前無最新公告";
      }
    }

    function render() {
      if (subjects.length === 0) return;
      const currentSubject = subjects[currentSubjIndex % subjects.length];
      document.getElementById('main-title').textContent = `(測試中)🏆${currentSubject} 榮譽榜 Leaderboard 🏆(Testing)`;
      
      LEVELS.forEach(level => {
        const container = document.getElementById(`container-${level.replace('.', '')}`);
        const norm = str => String(str || '').replace(/\s|\./g, '').toUpperCase();
        let list = allData.filter(d => norm(d.subject) === norm(currentSubject) && norm(d.level) === norm(level))
                          .sort((a, b) => b.score - a.score).slice(0, 7); 

        container.innerHTML = `
          <table>
            <thead><tr><th>#</th><th>班</th><th class="name-col">姓名</th><th>分</th></tr></thead>
            <tbody>
              ${list.map((r, i) => {
                const studentName = r.name || '—';
                // 💡 判斷字數是否大於 8，成立則加入 'long-name' class
                const isLong = studentName.length > 8 ? 'long-name' : '';
                
                return `
                <tr class="${i < 3 ? 'rank-' + (i + 1) : ''}">
                  <td>${i+1}</td>
                  <td>${r.class||'—'}</td>
                  <td class="name-col ${isLong}">${studentName}</td>
                  <td class="score-col">${r.score}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>`;
      });
      currentSubjIndex++;
    }

    createPanels();
    updateData(); 

    // 每 15 秒重新由 Spreadsheet 撈取新資料並輪替科目
    setInterval(updateData, 15000);
  </script>
</body>
</html>
