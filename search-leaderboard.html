<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CKCPS WARS - 雲端榮譽排行榜查詢v2607111336</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        
        :root {
            --bg-gradient: linear-gradient(180deg, #060614 0%, #0a0a24 100%);
            --header-bg: rgba(11, 11, 34, 0.85);
            --header-border: #00f9ff;
            --header-shadow: 0 0 25px rgba(0, 249, 255, 0.25);
            --header-text: #ffffff;
            --header-desc: #94a3b8;
            --h1-font: 'Orbitron', sans-serif;
            --h1-text-shadow: 0 0 10px #00f9ff;
            
            --bg-dark: #060614;
            --card-bg: #11112a;
            --card-shadow: 0 10px 30px rgba(0,0,0,0.5);
            --primary: #00f9ff;     
            --secondary: #ff00aa;   
            --accent: #39ff14;      
            --text-main: #ffffff;
            --text-dim: #94a3b8;
            --border-color: #222244;
            --item-bg: rgba(255, 255, 255, 0.04);
            --item-border: rgba(255, 255, 255, 0.1);
            
            --th-bg: #1a1a3a;
            --tr-even: rgba(255, 255, 255, 0.02);
            --tr-hover: rgba(255, 0, 170, 0.1);
        }

        body.school-theme {
            --bg-gradient: linear-gradient(180deg, #faf9f8 0%, #f0f4f7 100%);
            --header-bg: #2d4565;       
            --header-border: #f9995d;   
            --header-shadow: 0 4px 20px rgba(45, 69, 101, 0.15);
            --header-text: #ffffff;
            --header-desc: #faf9f8;
            --h1-font: "微軟正黑體", -apple-system, sans-serif;
            --h1-text-shadow: none;
            
            --bg-dark: #faf9f8;
            --card-bg: #ffffff;
            --card-shadow: 0 4px 20px rgba(45, 69, 101, 0.06);
            --primary: #2d4565;         
            --secondary: #f9995d;       
            --accent: #71b2c4;          
            --text-main: #2d4565;       
            --text-dim: #5d718e;        
            --border-color: #cbd5e1;    
            --item-bg: #faf9f8;         
            --item-border: #e2e8f0;

            --th-bg: #e6edf5;
            --tr-even: #f8fafc;
            --tr-hover: rgba(249, 153, 93, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "微軟正黑體", sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .controls-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            gap: 12px;
        }

        .control-btn {
            padding: 10px 18px;
            background: rgba(11, 11, 34, 0.85);
            border: 2px solid var(--secondary);
            color: #ffffff;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .control-btn:hover { transform: scale(1.05); box-shadow: 0 0 25px var(--secondary); }
        body.school-theme .control-btn { background: #ffffff; border: 2px solid #2d4565; color: #2d4565; }
        body.school-theme .control-btn:hover { background: #2d4565; color: #ffffff; }

        header {
            background: var(--header-bg);
            padding: 30px 20px;
            text-align: center;
            border-bottom: 3px solid var(--header-border);
            box-shadow: var(--header-shadow);
            color: var(--header-text);
        }
        header h1 { font-family: var(--h1-font); font-size: 2.2rem; text-shadow: var(--h1-text-shadow); margin-bottom: 8px; }
        .back-link { display: inline-block; margin-top: 12px; color: var(--primary); text-decoration: none; font-weight: bold; }
        .back-link:hover { text-decoration: underline; }

        .search-container {
            max-width: 1200px;
            width: 100%;
            margin: 30px auto;
            padding: 0 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .sync-status-bar {
            background: rgba(57, 255, 20, 0.1);
            border: 1px solid var(--accent);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            font-size: 0.95rem;
            color: var(--accent);
        }
        body.school-theme .sync-status-bar { background: #e6f4ea; border-color: #34a853; color: #137333; }

        .filter-panel {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 25px;
            box-shadow: var(--card-shadow);
        }
        .filter-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 20px; color: var(--secondary); }
        
        .filter-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            align-items: flex-end;
        }
        @media (max-width: 900px) { .filter-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .filter-grid { grid-template-columns: 1fr; } }

        .filter-group { display: flex; flex-direction: column; gap: 8px; }
        .filter-group label { font-size: 0.9rem; font-weight: bold; color: var(--text-dim); }
        .filter-control {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--item-bg);
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
        }
        .filter-control:focus { border-color: var(--secondary); }
        .filter-control:disabled { opacity: 0.4; cursor: not-allowed; }

        .search-action-btn {
            grid-column: 1 / -1;
            padding: 12px 25px;
            background: var(--secondary);
            border: none;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }
        body.school-theme .search-action-btn { background: #f9995d; }

        .results-panel {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 25px;
            box-shadow: var(--card-shadow);
        }
        .table-responsive { width: 100%; overflow-x: auto; border-radius: 8px; border: 1px solid var(--border-color); }
        .leaderboard-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.95rem; }
        .leaderboard-table th { background: var(--th-bg); color: var(--text-main); padding: 14px 16px; font-weight: bold; }
        .leaderboard-table td { padding: 14px 16px; border-bottom: 1px solid var(--border-color); }
        .leaderboard-table tr:nth-child(even) { background: var(--tr-even); }
        .leaderboard-table tr:hover { background: var(--tr-hover); }

        .rank-badge { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; font-weight: bold; }
        .rank-1 { background: #ffd700; color: #000; }
        .rank-2 { background: #c0c0c0; color: #000; }
        .rank-3 { background: #cd7f32; color: #000; }
        .status-message { text-align: center; padding: 40px 20px; color: var(--text-dim); font-size: 1.1rem; }
        footer { text-align: center; padding: 20px; color: var(--text-dim); border-top: 1px solid var(--border-color); }
    </style>
</head>
<body>

    <div class="controls-container">
        <button class="control-btn" onclick="toggleTheme()"><span id="theme-btn-icon">🎨</span><span id="theme-btn-text">切換學校配色</span></button>
        <button class="control-btn" onclick="toggleLang()"><span>🌐</span><span id="lang-btn-text">English</span></button>
    </div>

    <header>
        <h1 id="page-title" data-zh="🏆 榮譽排行榜自訂查詢" data-en="🏆 Dynamic Leaderboard Query">🏆 榮譽排行榜自訂查詢</h1>
        <p data-zh="自訂篩選班級、姓名、科目、程度與月份，即時產生名次排行" data-en="Filter by Class, Name, Subject, Level, and Month for real-time rankings">自訂篩選班級、姓名、科目、程度與月份，即時產生名次排行</p>
        <a href="index.html" class="back-link" data-zh="⬅️ 返回系統入口首頁" data-en="⬅️ Back to Portal Home">⬅️ 返回系統入口首頁</a>
    </header>

    <main class="search-container">
        <div class="sync-status-bar">
            <span>🔄</span> <span id="sync-text" data-zh="正在從 Google Sheets 同步精準數據..." data-en="Syncing live data from Google Sheets...">正在從 Google Sheets 同步精準數據...</span>
        </div>

        <section class="filter-panel">
            <div class="filter-title" data-zh="🔍 條件篩選設定 (不選代表包含全部)" data-en="🔍 Filter Settings (Unselected means All)">🔍 條件篩選設定 (不選代表包含全部)</div>
            <div class="filter-grid">
                
                <!-- 1. 班級 -->
                <div class="filter-group">
                    <label for="filter-class" data-zh="班級" data-en="Class">班級</label>
                    <select id="filter-class" class="filter-control" onchange="onClassChanged()">
                        <option value="ALL" data-zh="✨ 全部班級" data-en="✨ All Classes">✨ 全部班級</option>
                    </select>
                </div>

                <!-- 2. 姓名 -->
                <div class="filter-group">
                    <label for="filter-name" data-zh="學生姓名" data-en="Student Name">學生姓名</label>
                    <select id="filter-name" class="filter-control" disabled>
                        <option value="ALL" data-zh="✨ 請先選擇班級" data-en="✨ Select Class First">✨ 請先選擇班級</option>
                    </select>
                </div>

                <!-- 3. 科目 -->
                <div class="filter-group">
                    <label for="filter-subject" data-zh="科目" data-en="Subject">科目</label>
                    <select id="filter-subject" class="filter-control">
                        <option value="ALL" data-zh="✨ 所有科合計" data-en="✨ Total All Subjects">✨ 所有科合計</option>
                    </select>
                </div>

                <!-- 4. 程度 (LEVEL) -->
                <div class="filter-group">
                    <label for="filter-level" data-zh="程度 (Level)" data-en="Level">程度 (Level)</label>
                    <select id="filter-level" class="filter-control">
                        <option value="ALL" data-zh="✨ 全部程度" data-en="✨ All Levels">✨ 全部程度</option>
                    </select>
                </div>

                <!-- 5. 月份 -->
                <div class="filter-group">
                    <label for="filter-month" data-zh="月份" data-en="Month">月份</label>
                    <select id="filter-month" class="filter-control">
                        <option value="ALL" data-zh="✨ 全部月份" data-en="✨ All Months">✨ 全部月份</option>
                        <option value="01">1 月</option><option value="02">2 月</option>
                        <option value="03">3 月</option><option value="04">4 月</option>
                        <option value="05">5 月</option><option value="06">6 月</option>
                        <option value="07">7 月</option><option value="08">8 月</option>
                        <option value="09">9 月</option><option value="10">10 月</option>
                        <option value="11">11 月</option><option value="12">12 月</option>
                    </select>
                </div>

                <button class="search-action-btn" onclick="executeFiltering()" data-zh="⚡ 執行條件篩選" data-en="⚡ Apply Filter">⚡ 執行條件篩選</button>
            </div>
        </section>

        <section class="results-panel">
            <div class="table-responsive">
                <table class="leaderboard-table" id="data-table" style="display: none;">
                    <thead>
                        <tr>
                            <th data-zh="名次" data-en="Rank">名次</th>
                            <th data-zh="日期" data-en="Date">日期</th>
                            <th data-zh="班別" data-en="Class">班別</th>
                            <th data-zh="姓名" data-en="Name">姓名</th>
                            <th data-zh="科目" data-en="Subject">科目</th>
                            <th data-zh="程度" data-en="Level">程度</th>
                            <th data-zh="得分/數據" data-en="Score">得分/數據</th>
                        </tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
            <div id="status-box" class="status-message" data-zh="🔄 正在從雲端載入數據..." data-en="🔄 Loading live database...">🔄 正在從雲端載入數據...</div>
        </section>
    </main>

    <footer>&copy; 2026 CKCPS WARS. 雲端資料庫模組.</footer>

    <script>
        let currentLang = localStorage.getItem('ckcps_lang') || 'zh';     
        let currentTheme = localStorage.getItem('ckcps_theme') || 'cyber'; 
        let fullLeaderboardData = [];

        // 使用 Google 視覺化結構 API
        const GOOGLE_SHEET_URL = 'https://docs.google.com/spreadsheets/d/1lwPiw4WVCorhjgpHycsahXoaPGPPZ7XR9OWWoImZq5g/gviz/tq?gid=0';

        window.onload = function() {
            updateUI();
            fetchCloudData();
        };

        function toggleTheme() {
            currentTheme = (currentTheme === 'cyber') ? 'school' : 'cyber';
            localStorage.setItem('ckcps_theme', currentTheme);
            updateUI();
        }

        function toggleLang() {
            currentLang = (currentLang === 'zh') ? 'en' : 'zh';
            localStorage.setItem('ckcps_lang', currentLang);
            updateUI();
        }

        function updateUI() {
            const body = document.body;
            if (currentTheme === 'school') body.classList.add('school-theme');
            else body.classList.remove('school-theme');
            
            document.querySelectorAll('[data-zh]').forEach(el => {
                const txt = el.getAttribute('data-' + currentLang);
                if (txt) el.innerHTML = txt;
            });
            document.getElementById('lang-btn-text').innerText = (currentLang === 'zh') ? "English" : "繁體中文";
        }

        async function fetchCloudData() {
            const syncText = document.getElementById('sync-text');
            try {
                const response = await fetch(GOOGLE_SHEET_URL);
                if (!response.ok) throw new Error();
                let rawText = await response.text();
                
                // 擷取正確的 JSON 物件結構
                const jsonString = rawText.match(/google\.visualization\.Query\.setResponse\(([\s\S\w\W]*)\);/)[1];
                const dataObj = JSON.parse(jsonString);
                
                processGoogleJson(dataObj);

                syncText.setAttribute('data-zh', '🟢 雲端同步完成！已載入最新精準資料。');
                syncText.setAttribute('data-en', '🟢 Cloud Sync Active! Accurate data loaded.');
                updateUI();
            } catch (err) {
                console.error(err);
                syncText.setAttribute('data-zh', '🔴 連線或解析失敗。請確認試算表已開啟「知道連結的任何人均可檢視」。');
                syncText.setAttribute('data-en', '🔴 Sync failed. Check sharing settings.');
                document.getElementById('status-box').innerText = "⚠️ Error loading data.";
                updateUI();
            }
        }

        // 🎯 核心修正：利用 Google Sheets 內建的橫向矩陣索引，100% 杜絕欄位錯位！
        function processGoogleJson(dataObj) {
            fullLeaderboardData = [];
            const rows = dataObj.table.rows;
            
            let classesSet = new Set();
            let subjectsSet = new Set();
            let levelsSet = new Set();

            rows.forEach(row => {
                const cells = row.c;
                // 確保儲存格至少有 6 欄
                if (cells && cells.length >= 6) {
                    // 安全讀取對應的文字值（防空值）
                    let dateStr = cells[0] && cells[0].v ? String(cells[0].v) : "";
                    let className = cells[1] && cells[1].v ? String(cells[1].v) : "";
                    let name = cells[2] && cells[2].v ? String(cells[2].v) : "";
                    let subject = cells[3] && cells[3].v ? String(cells[3].v) : "";
                    let level = cells[4] && cells[4].v ? String(cells[4].v) : "";
                    let scoreVal = cells[5] && cells[5].v ? parseFloat(cells[5].v) : 0;
                    let scoreStr = cells[5] && cells[5].f ? cells[5].f : (cells[5] && cells[5].v ? String(cells[5].v) : "0");

                    // 處理 Google JSON 特有的 Date 格式 (例如 "Date(2024,4,12)" 代表 2024年5月12日)
                    if(dateStr.includes("Date(")) {
                        let matches = dateStr.match(/\d+/g);
                        if(matches && matches.length >= 3) {
                            let y = matches[0];
                            let m = String(parseInt(matches[1]) + 1).padStart(2, '0'); // JS/Google 月份從 0 開始
                            let d = String(matches[2]).padStart(2, '0');
                            dateStr = `${y}/${m}/${d}`;
                        }
                    }

                    // 從日期格式中提取月份
                    let monthStr = "";
                    if (dateStr.includes("/")) {
                        monthStr = dateStr.split("/")[1].padStart(2, '0');
                    } else if (dateStr.includes("-")) {
                        monthStr = dateStr.split("-")[1].padStart(2, '0');
                    }

                    // 排除表頭標籤行
                    if (className.toLowerCase() !== "class" && className !== "班別" && className !== "班級") {
                        fullLeaderboardData.push({
                            date: dateStr,
                            month: monthStr,
                            className: className,
                            name: name,
                            subject: subject,
                            level: level,
                            score: scoreVal,
                            scoreStr: scoreStr
                        });

                        if(className) classesSet.add(className);
                        if(subject) subjectsSet.add(subject);
                        if(level) levelsSet.add(level);
                    }
                }
            });

            buildDropdown('filter-class', classesSet, '✨ 全部班級', '✨ All Classes');
            buildDropdown('filter-subject', subjectsSet, '✨ 所有科合計', '✨ Total All Subjects');
            buildDropdown('filter-level', levelsSet, '✨ 全部程度', '✨ All Levels');
            
            executeFiltering();
        }

        function buildDropdown(elementId, set, zhDefault, enDefault) {
            const el = document.getElementById(elementId);
            el.innerHTML = `<option value="ALL" data-zh="${zhDefault}" data-en="${enDefault}">${currentLang==='zh'?zhDefault:enDefault}</option>`;
            Array.from(set).sort().forEach(item => {
                if(item) {
                    const opt = document.createElement('option');
                    opt.value = item; opt.innerText = item;
                    el.appendChild(opt);
                }
            });
        }

        function onClassChanged() {
            const targetClass = document.getElementById('filter-class').value;
            const nameDropdown = document.getElementById('filter-name');

            if (targetClass === 'ALL') {
                nameDropdown.innerHTML = `<option value="ALL" data-zh="✨ 請先選擇班級" data-en="✨ Select Class First">✨ 請先選擇班級</option>`;
                nameDropdown.disabled = true;
                return;
            }

            nameDropdown.disabled = false;
            let namesInClass = new Set();
            fullLeaderboardData.forEach(item => {
                if (item.className === targetClass && item.name) {
                    namesInClass.add(item.name);
                }
            });

            nameDropdown.innerHTML = `<option value="ALL" data-zh="✨ 全部學生" data-en="✨ All Students">${currentLang==='zh'?'✨ 全部學生':'✨ All Students'}</option>`;
            Array.from(namesInClass).sort().forEach(name => {
                const opt = document.createElement('option');
                opt.value = name; opt.innerText = name;
                nameDropdown.appendChild(opt);
            });
            updateUI();
        }

        function executeFiltering() {
            const cls = document.getElementById('filter-class').value;
            const name = document.getElementById('filter-name').value;
            const sub = document.getElementById('filter-subject').value;
            const lvl = document.getElementById('filter-level').value;
            const mth = document.getElementById('filter-month').value;

            const table = document.getElementById('data-table');
            const tbody = document.getElementById('table-body');
            const sBox = document.getElementById('status-box');

            let filtered = fullLeaderboardData.filter(item => {
                if (cls !== 'ALL' && item.className !== cls) return false;
                if (name !== 'ALL' && item.name !== name) return false;
                if (sub !== 'ALL' && item.subject !== sub) return false;
                if (lvl !== 'ALL' && item.level !== lvl) return false;
                if (mth !== 'ALL' && item.month !== mth) return false;
                return true;
            });

            filtered.sort((a, b) => b.score - a.score);
            tbody.innerHTML = '';

            if (filtered.length === 0) {
                table.style.display = 'none';
                sBox.style.display = 'block';
                sBox.setAttribute('data-zh', '📭 沒有找到符合條件的排名資料。');
                sBox.setAttribute('data-en', '📭 No matching records found.');
                updateUI();
                return;
            }

            sBox.style.display = 'none';
            table.style.display = 'table';

            let rank = 1;
            for (let i = 0; i < filtered.length; i++) {
                if (i > 0 && filtered[i].score < filtered[i-1].score) { rank = i + 1; }
                const item = filtered[i];
                const tr = document.createElement('tr');
                
                let rBadge = rank;
                if (rank === 1) rBadge = `<span class="rank-badge rank-1">1</span>`;
                else if (rank === 2) rBadge = `<span class="rank-badge rank-2">2</span>`;
                else if (rank === 3) rBadge = `<span class="rank-badge rank-3">3</span>`;

                tr.innerHTML = `
                    <td>${rBadge}</td>
                    <td>${item.date}</td>
                    <td><b>${item.className}</b></td>
                    <td><b>${item.name}</b></td>
                    <td>${item.subject}</td>
                    <td><span style="color:var(--accent); font-weight:bold;">${item.level}</span></td>
                    <td><span style="color:var(--secondary); font-weight:bold;">${item.scoreStr}</span></td>
                `;
                tbody.appendChild(tr);
            }
            updateUI();
        }
    </script>
</body>
</html>
