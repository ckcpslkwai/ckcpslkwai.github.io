<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>即時排行榜輪播 V2607052348🏆</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0a0a1f 0%, #1a1a3a 100%);
      --card-bg: rgba(255,255,255,0.1);
      --text-light: #f0f4ff;
      --accent: #00f9ff;
    }
    body { font-family: 'Segoe UI', sans-serif; background: var(--bg-gradient); color: var(--text-light); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .panel { background: var(--card-bg); border-radius: 15px; border: 2px solid var(--accent); width: 100%; max-width: 600px; padding: 20px; box-shadow: 0 0 20px rgba(0,249,255,0.2); }
    .panel-header { font-size: 2rem; color: var(--accent); text-align: center; margin-bottom: 20px; text-transform: uppercase; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .rank-1 { color: #ffd700; font-weight: bold; }
    #status { margin-top: 20px; font-size: 0.9rem; color: #888; }
  </style>
</head>
<body>

  <div class="panel">
    <div id="subject-title" class="panel-header">Loading...</div>
    <table id="leaderboard-table">
      <thead><tr><th>排名</th><th>班級</th><th>姓名</th><th>分數</th></tr></thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>
  <div id="status">正在更新資料...</div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbyMVPcda6_YBIBXmy7iZFQjbIilACiNGVTz1CwB3yMNy7Od3VS81AE8lbKkTjABmt5f/exec';
    let allData = [];
    let currentIndex = 0;

    async function fetchData() {
      try {
        // 建議在您的 Apps Script 加上 Access-Control-Allow-Origin: * 標頭以避免跨域問題
        const response = await fetch(API_URL);
        const data = await response.json(); // 假設回傳格式為 [{subject, level, class, name, score}, ...]
        allData = data;
        render();
      } catch (e) {
        document.getElementById('status').textContent = '資料讀取錯誤，請確認 Apps Script 權限。';
      }
    }

    function render() {
      if (allData.length === 0) return;
      
      // 依科目與年級分組輪播
      const subjects = [...new Set(allData.map(item => item.subject))];
      const currentSubject = subjects[currentIndex % subjects.length];
      const filtered = allData.filter(d => d.subject === currentSubject)
                              .sort((a, b) => b.score - a.score)
                              .slice(0, 10);

      document.getElementById('subject-title').textContent = currentSubject + ' 🏆';
      const body = document.getElementById('table-body');
      body.innerHTML = filtered.map((row, i) => `
        <tr class="${i === 0 ? 'rank-1' : ''}">
          <td>${i + 1}</td>
          <td>${row.class}</td>
          <td>${row.name}</td>
          <td>${row.score}</td>
        </tr>
      `).join('');
      
      document.getElementById('status').textContent = `最後更新: ${new Date().toLocaleTimeString()}`;
      currentIndex++;
    }

    fetchData();
    setInterval(fetchData, 60000); // 每分鐘向伺服器更新一次原始資料
    setInterval(render, 10000);    // 每10秒切換顯示的科目
  </script>
</body>
</html>
