<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>即時排行榜輪播 v2607052322 🏆</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0a0a1f 0%, #1a1a3a 100%);
      --card-bg: rgba(255, 255, 255, 0.1);
      --accent: #00f9ff;
      --text-light: #f0f4ff;
    }
    body { 
      font-family: 'Segoe UI', system-ui, sans-serif; 
      background: var(--bg-gradient); 
      color: var(--text-light); 
      margin: 0; padding: 20px; 
      display: flex; flex-direction: column; align-items: center; 
      min-height: 100vh;
    }
    .panel { 
      background: var(--card-bg); 
      border-radius: 20px; 
      border: 2px solid var(--accent); 
      width: 100%; max-width: 650px; 
      padding: 30px; 
      box-shadow: 0 0 30px rgba(0, 249, 255, 0.2); 
      backdrop-filter: blur(10px);
    }
    #group-title { 
      font-size: 2.5rem; 
      color: var(--accent); 
      text-align: center; 
      margin-bottom: 20px; 
      text-transform: uppercase;
      text-shadow: 0 0 10px var(--accent);
    }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th { color: #888; font-size: 0.9rem; padding: 10px; border-bottom: 2px solid #333; }
    td { padding: 15px; text-align: center; font-size: 1.2rem; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .rank-cell { font-weight: bold; color: var(--accent); width: 60px; }
    .score-cell { color: #39ff14; font-weight: bold; }
    #status { margin-top: 20px; font-size: 0.8rem; color: #666; }
    .loading { text-align: center; padding: 50px; font-size: 1.5rem; }
  </style>
</head>
<body>

  <div class="panel">
    <div id="group-title">Loading...</div>
    <table id="leaderboard-table">
      <thead>
        <tr><th>排名</th><th>班級</th><th>姓名</th><th>分數</th></tr>
      </thead>
      <tbody id="table-body">
        <tr><td colspan="4" class="loading">正在連線至雲端獲取數據...</td></tr>
      </tbody>
    </table>
  </div>
  <div id="status">系統準備中...</div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbyMVPcda6_YBIBXmy7iZFQjbIilACiNGVTz1CwB3yMNy7Od3VS81AE8lbKkTjABmt5f/exec';
    
    let allData = [];      // 儲存從 API 拿到的所有資料
    let viewGroups = [];   // 儲存所有唯一的 [科目+年級] 組合
    let currentIndex = 0;

    // 1. 獲取資料
    async function fetchData() {
      try {
        const response = await fetch(API_URL);
        const data = await response.json(); 
        
        // 過濾無效資料並儲存
        allData = data.filter(d => d.subject && d.level);
        
        // 建立所有「科目+年級」的唯一清單 (例如: Math P1, English P2)
        const groups = new Set(allData.map(d => `${d.subject} ${d.level}`));
        viewGroups = Array.from(groups).sort();
        
        if (viewGroups.length > 0) render();
        document.getElementById('status').textContent = `最後更新: ${new Date().toLocaleTimeString()} | 共 ${viewGroups.length} 個組別輪播中`;
      } catch (e) {
        document.getElementById('status').textContent = '⚠️ 無法取得資料，請檢查 Apps Script 權限。';
      }
    }

    // 2. 渲染畫面
    function render() {
      if (viewGroups.length === 0) return;
      
      // 取得當前要顯示的組別
      const currentGroup = viewGroups[currentIndex % viewGroups.length];
      const [currSub, currLvl] = currentGroup.split(' ');

      // 篩選該組別資料，排序並取前 5 名
      const filtered = allData
        .filter(d => d.subject === currSub && d.level === currLvl)
        .sort((a, b) => (parseFloat(b.score) || 0) - (parseFloat(a.score) || 0))
        .slice(0, 5);

      // 更新標題
      document.getElementById('group-title').textContent = `${currSub} ${currLvl}`;

      // 更新表格
      const body = document.getElementById('table-body');
      body.innerHTML = filtered.map((row, i) => `
        <tr>
          <td class="rank-cell">#${i + 1}</td>
          <td>${row.class || '—'}</td>
          <td>${row.name || '—'}</td>
          <td class="score-cell">${row.score || 0}</td>
        </tr>
      `).join('');
      
      // 索引跳轉下一個
      currentIndex++;
    }

    // 初始化與輪播
    fetchData();
    setInterval(fetchData, 60000); // 每 60 秒重新抓取雲端最新資料
    setInterval(render, 10000);    // 每 10 秒自動輪替顯示組別
  </script>
</body>
</html>
